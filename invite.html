      'whoever had the number before you. Link only what’s yours; switched-off ' +
      'accounts stay separate.</p>' +
    '<div class="lk-head"><p class="mg-lab">Accounts</p>' +
      '<button class="lk-all" type="button" data-linkall>' +
      (n === LINKQ.profs.length ? 'Turn all off' : 'Turn all on') + '</button></div>' +
    '<div class="glist">' + LINKQ.profs.map(function(p){
      var k = (p.events || []).length, on = !!LINKQ.on[p.uid];
      return '<div class="grow"><span class="gav"><img src="' + h(p.photo || GAV) + '" alt=""></span>' +
        '<span class="gtx"><b>' + h(p.name || 'Unnamed visitor') + '</b>' +
        '<span>' + h(p.uid) + ' · ' + k + (k === 1 ? ' event' : ' events') + '</span></span>' +
        '<button class="sw' + (on ? ' on' : '') + '" type="button" role="switch" aria-checked="' + on + '" ' +
          'data-linktgl="' + h(p.uid) + '" aria-label="Link ' + h(p.name || 'this account') + '"><i></i></button>' +
      '</div>';
    }).join('') + '</div>' +
    '<button class="modal-cta" type="button" data-linkgo>' +
      (n ? 'Link ' + (n === 1 ? 'this account' : n + ' accounts') : 'Keep them separate') + '</button>' +
    '<button class="modal-later" type="button" data-linklater>Decide later</button>' +
  '</div>';
}
function renderProfile(){
  var m = loadMe(), linked = linkedProfiles(), evs = myEvents().length, pend = linkPend().length;
  var vnow = (!!normPhone(m.phone) && !phoneVerified() && smsLive()) || pend;
  var vlab = pend ? 'Choose ' + pend + ' to link'
           : linked.length || (!phoneVerified() && verifyPending() ? 'Verification paused'
           : phoneMatches().length ? 'Verify to link ' + phoneMatches().length
           : vnow ? 'Tap to verify' : 'None yet');
  return '<div class="wrap narrow">' +
    '<header class="top">' +
      '<a class="icon-btn" href="#home" data-back="home" aria-label="Back to events">' + ico('back') + '</a>' +
      brandMark() + '<div class="sp"></div>' + infoBtn(true) +
    '</header>' +
    '<h1 class="title">Your Profile</h1>' +
    '<div class="me-card">' +
      '<div class="me-av"><img src="' + h(meAvatar()) + '" alt="Your photo">' +
        '<button class="cam" type="button" data-mephoto aria-label="Change photo">' + ico('cam') + '</button></div>' +
      '<div class="me-fields">' +
        '<label class="lab" for="me-name">Name</label>' +
        '<input class="inp" id="me-name" type="text" maxlength="40" data-me="name" ' +
          'placeholder="Your name" value="' + h(m.name) + '">' +
        '<label class="lab" for="me-phone">Phone number</label>' +
        '<input class="inp" id="me-phone" type="tel" inputmode="tel" maxlength="20" data-me="phone" ' +
          'placeholder="(530) 555-0123" value="' + h(m.phone) + '">' +
        '<p class="onote">Add your number and every device you use it on becomes one account - ' +
          'events from each show up everywhere.</p>' +
        '<button class="cta solo" type="button" data-mesave>Save Profile</button>' +
      '</div>' +
    '</div>' +
    '<section class="sec"><div class="sec-h"><h2>Account</h2></div><div class="scard">' +
      '<div class="srow noact"><span class="sic">' + ico('lock') + '</span><b>Status</b>' +
        '<span class="sval">' + (phoneVerified() ? 'Verified'
          : verifyPending() ? 'Verification paused' : 'Guest · this device') + '</span></div>' +
      '<div class="srow noact"><span class="sic">' + ico('person') + '</span><b>Visitor ID</b>' +
        '<span class="sval mono">' + h(m.uid) + '</span></div>' +
      '<div class="srow noact"><span class="sic">' + ico('cal-p') + '</span><b>Events opened</b>' +
        '<span class="sval">' + evs + '</span></div>' +
      '<div class="srow' + (vnow ? ' act" data-verifynow role="button" tabindex="0"' : ' noact"') +
        '><span class="sic">' + ico('phone') + '</span><b>Linked accounts</b>' +
        '<span class="sval">' + vlab + '</span></div>' +
    '</div></section>' +
    (linked.length ?
      '<section class="sec"><div class="sec-h"><h2>Linked accounts</h2></div>' +
      '<p class="fsub">These visitor ids share your phone number, so their events count as yours.</p>' +
      '<div class="glist">' + linked.map(function(p){
        var k = (p.events || []).length;
        return '<div class="grow"><span class="gav"><img src="' + h(p.photo || GAV) + '" alt=""></span>' +
          '<span class="gtx"><b>' + h(p.name || 'Unnamed visitor') + '</b>' +
          '<span>' + h(p.uid) + ' \u00B7 ' + k + (k === 1 ? ' event' : ' events') + '</span></span></div>';
      }).join('') + '</div></section>' : '') +
  '</div>';
}

/* ================= chrome (fixed bars) ================= */
function bottomNav(active){
  return '<nav class="bnav" aria-label="Main">'+
    '<a class="bnav-i" href="#home" data-nav'+(active==='home'?' aria-current="page"':'')+'>'+
      ico('home')+'<span>Home</span></a>'+
    '<a class="bnav-new" href="#create" data-nav><span class="em">\uD83D\uDDD3\uFE0F</span>New Event</a>'+
    '<a class="bnav-i" href="#calendar" data-nav'+(active==='calendar'?' aria-current="page"':'')+'>'+
      ico('cal-p')+'<span>Calendar</span></a>'+
  '</nav>';
}
function eventDock(id){
  return '<nav class="dock" aria-label="Event actions">'+
    '<button type="button" data-invite="'+id+'">'+ico('user-plus')+'<span>Invite Friends</span></button>'+
    '<a href="#chat/'+id+'" data-nav>'+ico('chat')+'<span>Event Chat</span></a>'+
    '<button type="button" data-share-kind="event" data-share-id="'+id+'">'+
      ico('net')+'<span>Share Event</span></button></nav>';
}
</script>
<script>
(function(){
  var app=document.getElementById('app'),
      chrome=document.getElementById('chrome'),
      menu=document.getElementById('row-menu'),
      lb=document.getElementById('lightbox'),
      modal=document.getElementById('app-modal'),
      anchor=null, homeTab='upcoming', homeQ='', scrolls={}, curKey='', watching=null,
      lbEvent=null, lbIdx=0, lastEvId=null;

  function route(){
    var hash=location.hash.replace(/^#/,''), parts=hash.split('/');
    if(parts[0]==='event')  return {v:'event',  id:parts[1]};
    if(parts[0]==='guests') return {v:'guests', id:parts[1]};
    if(parts[0]==='photos') return {v:'photos', id:parts[1]};
    if(parts[0]==='chat')   return {v:'chat',   id:parts[1]};
    if(parts[0]==='calendar') return {v:'calendar'};
    if(parts[0]==='create'){       /* old 4-step links: settings merged into 2, invites = 3 */
      var cs = +parts[1] || 1; if(cs === 4) cs = 3;
      return {v:'create', step: cs >= 2 && cs <= 3 ? cs : 1};
    }
    if(parts[0]==='edit') return {v:'edit', id:parts[1]};
    if(parts[0]==='profile') return {v:'profile'};
    return {v:'home'};
  }

  var homeSearch=false;

  function render(){
    closeMenu();
    var r=route(), key=location.hash||'#home';
    remapRoles();   /* who is looking may have changed - roles are per-viewer */
    /* tabs and history get real names instead of five identical "Down2Chill"s */
    var tev=(r.v==='event'||r.v==='guests'||r.v==='photos'||r.v==='chat') && findEvent(r.id);
    document.title = tev ? tev.title+' · Down2Chill'
      : r.v==='profile' ? 'Your Profile · Down2Chill'
      : r.v==='create'  ? 'New Event · Down2Chill'
      : r.v==='edit'    ? 'Edit Event · Down2Chill'
      : r.v==='calendar'? 'Calendar · Down2Chill'
      : 'Down2Chill';

    /* Detail views stream their subcollections; attach on entry, drop on exit. */
    var wants = (r.v==='event'||r.v==='guests'||r.v==='photos'||r.v==='chat') ? r.id : null;
    if(wants !== watching){
      if(window.D2C && D2C.watchEvent){
        D2C.unwatchEvent();
        watching = wants;
        if(wants) D2C.watchEvent(wants);
      } else {
        /* The firebase module is a deferred <script type="module">, so on a
           deep link it hasn't loaded yet. Leave `watching` unset so the next
           render (the store's first notify) actually attaches the listeners. */
        watching = null;
      }
    }

    /* the create form owns its own state, so it opens before events load */
    if(!STORE.ready && r.v!=='create' && r.v!=='profile'){ app.innerHTML=loadingView(); chrome.innerHTML=''; return; }
    /* leaving the edit screen by any route drops the pending changes */
    if(r.v!=='edit' && EDIT){ editCleanup(false); endEdit(); }
    if(r.v==='edit' && (!EDIT || EDIT.id!==r.id) && !startEdit(r.id)){
      toast('That event is no longer here','err'); r={v:'home'};
      history.replaceState({d:0},'','#home');
    }
    var curKeyChanged = curKey !== key;
    if(curKey && curKeyChanged) scrolls[curKey]=app.scrollTop;

    closeLb();
    /* live pages repaint on every stream notify - a confirm sheet must ride
       that out like the claim sheets do, or its confirmFn dies mid-decision */
    if(curKeyChanged || !modal.querySelector('.claim, [data-confirm-yes]')) closeModal();
    /* an event a banned viewer opens (or one that was deleted) is simply gone -
       never a dead end. Mid-view (the stream just dropped it, i.e. the host
       removed them) they land straight back on Home; arriving fresh at a dead
       link lands on Home under an "unavailable" notice. */
    var isDetail=(r.v==='event'||r.v==='guests'||r.v==='photos'||r.v==='chat'),
        dEv=isDetail ? findEvent(r.id) : null,
        gone=isDetail && !dEv, goneNote=false;
    if(gone){
      goneNote=lastEvId!==r.id;
      lastEvId=null;
      closeModal();
      history.replaceState({d:0},'','#home');
      r={v:'home'}; key='#home'; gone=false;
      curKeyChanged=curKey!==key;
    } else lastEvId=isDetail ? r.id : null;
    if(r.v==='home'){ app.innerHTML=renderHome(homeTab,homeQ,homeSearch); chrome.innerHTML=bottomNav('home'); }
    else if(r.v==='calendar'){ app.innerHTML=renderCalendar();  chrome.innerHTML=bottomNav('calendar'); }
    else if(r.v==='event'){    app.innerHTML=renderEvent(r.id); chrome.innerHTML=eventDock(r.id); }
    else if(r.v==='chat'){     var stick=curKeyChanged || app.scrollHeight-app.scrollTop-app.clientHeight<80;
                               app.innerHTML=renderChat(r.id);  chrome.innerHTML=composer(r.id);
                               if(stick) scrollThread(); }
    else if(r.v==='photos'){   app.innerHTML=renderPhotos(r.id);chrome.innerHTML=''; }
    else if(r.v==='profile'){  app.innerHTML=renderProfile();  chrome.innerHTML=bottomNav('profile'); }
    else if(r.v==='edit'){     app.innerHTML=renderEditPage(); chrome.innerHTML=editFoot(); }
    else if(r.v==='create'){   app.innerHTML=r.step>=3?renderCreate4()
                                              :r.step===2?renderCreate2():renderCreate1();
                               chrome.innerHTML=createFoot(r.step); }
    else {                     app.innerHTML=renderGuests(r.id);chrome.innerHTML=''; }

    document.body.className = (r.v==='event') ? 'has-dock'
                            : (r.v==='create'||r.v==='edit') ? 'has-cbar'
                            : (r.v==='guests'||r.v==='photos'||r.v==='chat') ? '' : 'has-nav';
    if(!modal.hidden) document.body.classList.add('modal-open');   /* survives the reset */
    if(goneNote){
      modal.innerHTML=goneCard();
      modal.hidden=false;
      document.body.classList.add('modal-open');
    }
    var cSheet=modal.querySelector('[data-claimfor]');
    if(cSheet && r.v==='event' && cSheet.dataset.claimfor===r.id){
      var cInp=document.getElementById('claim-name'),
          cVal=cInp?cInp.value:'', cFoc=document.activeElement===cInp,
          cAt=cInp?cInp.selectionStart:0, cEv=findEvent(r.id);
      if(cEv){
        modal.innerHTML=claimCard(cEv);
        var cInp2=document.getElementById('claim-name');
        if(cInp2){ cInp2.value=cVal;
          if(cFoc){ cInp2.focus(); try{ cInp2.setSelectionRange(cAt,cAt); }catch(e){} } }
      }
    }
    if(r.v==='event' && dEv) maybeClaim(r.id);

    curKey=key;
    var restore = curKeyChanged ? (scrolls[key]!=null ? scrolls[key] : 0) : app.scrollTop;
    if(r.v==='chat') return;   // chat manages its own scroll (pinned while at the newest)
    if(curKeyChanged) jump((r.v==='guests'||r.v==='photos') ? 0 : restore);
  }

  /* programmatic scrolls are instant - CSS smooth-behavior is for the user */
  function jump(y){
    app.style.scrollBehavior='auto';
    app.scrollTop=y;
    app.style.scrollBehavior='';
  }

  /* same view slot, new hash - no extra history entry */
  function swapHash(hash){
    history.replaceState(history.state||{d:0},'',hash);
    render();
  }
  function go(hash){
    var d=(history.state&&history.state.d)||0;
    history.pushState({d:d+1},'',hash);
    render();
  }
  function back(fallback){
    var d=(history.state&&history.state.d)||0;
    if(d>0) history.back();
    else { history.replaceState({d:0},'','#'+fallback); render(); }
  }

  /* ---------- delegated events ---------- */
  document.addEventListener('click',function(e){
    var t=e.target;

    var em=t.closest('[data-evmenu]');
    if(em){
      e.preventDefault(); e.stopPropagation();
      openEventMenu(em);
      return;
    }
    var mi=t.closest('[data-emenu]');
    if(mi){
      /* the menu is parented into the card, which is an <a> */
      e.preventDefault();
      var act=mi.dataset.emenu, mid=menuEvent, mm=menuMsg;
      closeMenu();
      if(act==='mcopy'){ if(mm) copyMsg(mm.id, mm.idx); return; }
      if(act==='medit'){ if(mm) openMsgEdit(mm.id, mm.idx); return; }
      if(act==='mdelete'){ if(mm) delMsg(mm.id, mm.idx); return; }
      if(act==='edit')   go('#edit/'+mid);
      if(act==='hide')   hideOne(mid);
      if(act==='delete') askDelete(mid);
      if(act==='share')  doShare('event', mid);
      if(act==='link')   copyLink(absUrl('event/'+mid));
      return;
    }

    var sh=t.closest('[data-share-kind]');
    if(sh){ doShare(sh.dataset.shareKind, sh.dataset.shareId); return; }

    var send=t.closest('#msg-send');
    if(send){ sendMsg(send.dataset.event); return; }
    var att=t.closest('#msg-attach');
    if(att){ sendImg(att.dataset.event); return; }

    if(t.closest('[data-lb-del]')){
      var dev=lbEvent, dpi=lbIdx, dph=dev && dev.photos && dev.photos[dpi];
      if(!dph) return;
      confirmFn=function(){
        closeLb();
        if(STORE.mode==='live' && window.D2C && D2C.deletePhoto && dph.id){
          D2C.deletePhoto(dev.id, dph.id, dph.path)
            .then(function(){ toast('Photo removed'); })
            .catch(function(e){ toast((e&&e.message)||'Could not remove the photo','err',4500); });
        } else {
          dev.photos.splice(dpi,1);
          dev.photoCount=Math.max(0,(dev.photoCount||1)-1);
          appendLocalActivity(dev.id,'x','removed a photo');
          STORE.notify(); toast('Photo removed');
        }
      };
      modal.innerHTML=confirmCard('Delete this photo?',
        'It comes off the event for everyone. This can’t be undone.','Delete Photo');
      modal.hidden=false; document.body.classList.add('modal-open'); modalShown();
      return;
    }
    var addp=t.closest('[data-addphoto]');
    if(addp){
      var aev=findEvent(addp.dataset.addphoto);
      if(aev && !canPost(aev)){
        toast(!canJoin(aev) ? 'Only invited guests can add photos.'
             : postMode(aev)==='host' ? 'Only the host adds photos on this event.'
             : 'Only guests who are Going can post here.','err',4200);
        return;
      }
      if(window.D2C && D2C.pickPhoto) D2C.pickPhoto(addp.dataset.addphoto);
      else toast('Connect Firebase to add photos.','err');
      return;
    }

    var invb=t.closest('[data-invite]');
    if(invb){
      var iev=findEvent(invb.dataset.invite);
      if(iev && !canJoin(iev)){ toast('Only invited guests can invite friends.','err',4000); return; }
      openInvite(invb.dataset.invite); return;
    }
    if(t.closest('[data-inv-add]')){ commitInvite(true); return; }
    var invx=t.closest('[data-inv-x]');
    if(invx){ INVQ.splice(+invx.dataset.invX,1); repaintInvite(); return; }
    if(t.closest('[data-inv-send]')){ sendInvites(); return; }

    if(t.closest('[data-cback]')){
      var r0=route();
      if(r0.v==='edit'){ leaveEdit(); return; }
      var st=r0.step;
      if(st>1) swapHash(st===2?'#create':'#create/'+(st-1)); else back('home');
      return;
    }
    if(t.closest('[data-savedraft]')){
      saveEventDraft(); clearDraft();
      toast('Draft saved - it\u2019s waiting under Hosting');
      homeTab='hosting';
      history.replaceState({d:0},'','#home');
      render(); return;
    }
    var ddel=t.closest('[data-draftdel]');
    if(ddel){
      var dd=eventDrafts().filter(function(x){ return x.draftId===ddel.dataset.draftdel; })[0];
      /* a draft's uploaded cover belongs to nothing else - clean it up */
      if(dd && dd.coverPath && window.D2C && D2C.deleteFile) D2C.deleteFile(dd.coverPath);
      deleteEventDraft(ddel.dataset.draftdel);
      toast('Draft deleted'); render(); return;
    }
    var dres=t.closest('[data-draft]');
    if(dres){
      if(resumeEventDraft(dres.dataset.draft)) go('#create');
      return;
    }
    if(t.closest('[data-cnext]')){
      var er=draftErrors(loadDraft());
      if(er){ toast(er[0],'err'); var bad=document.getElementById(er[1]); if(bad) bad.focus(); return; }
      saveDraft(); swapHash('#create/2'); return;
    }
    if(t.closest('[data-cnext2]')){ saveDraft(); swapHash('#create/3'); return; }
    if(t.closest('[data-editcancel]')){ leaveEdit(); return; }
    var esave=t.closest('[data-editsave]');
    if(esave){ commitEdit(esave); return; }
    if(t.closest('[data-confirm-yes]')){ var v=confirmFn; closeModal(); if(v) v(); return; }
    if(t.closest('[data-modal-close]') || t===modal){ closeModal(); return; }
    var inv=t.closest('[data-cinvite]');
    if(inv){
      if(!loadMe().name){
        pendingName=function(){ var b=document.querySelector('[data-cinvite]'); if(b) saveEvent(b); };
        modal.innerHTML=nameCard(); modal.hidden=false;
        document.body.classList.add('modal-open');
        return;
      }
      saveEvent(inv); return;
    }
    if(t.closest('[data-cover-pick]')){ pickCover(); return; }
    if(t.closest('[data-cover-remove]')){ dropCover(loadDraft()); return; }
    if(t.closest('[data-map]')){
      var q=draftMapQuery(loadDraft());
      if(!q){ toast('Add a place or address first','err'); return; }
      window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),
                  '_blank','noopener');
      return;
    }
    var g=t.closest('[data-guest]');
    if(g){
      var gd=loadDraft(), gi=gd.invitees.indexOf(g.dataset.guest);
      if(gi>-1) gd.invitees.splice(gi,1); else gd.invitees.push(g.dataset.guest);
      saveDraft(); repaintStep4(); return;
    }
    if(t.closest('[data-gclear]')){
      var cd=loadDraft(); cd.invitees=[]; cd.extra=[];
      saveDraft(); repaintStep4(); return;
    }
    if(t.closest('[data-contacts]')){ importContacts(); return; }
    if(t.closest('[data-vcfhelp]')){
      VCF_OS='';
      modal.innerHTML=vcfCard(); modal.hidden=false;
      document.body.classList.add('modal-open');
      modalShown();
      return;
    }
    var vhw=t.closest('[data-vhow]');
    if(vhw){
      VCF_OS = VCF_OS===vhw.dataset.vhow ? '' : vhw.dataset.vhow;
      modal.innerHTML=vcfCard(); return;
    }
    if(t.closest('[data-vcf]')){
      var vfi=document.getElementById('vcf-input');
      vfi.value='';
      vfi.onchange=function(){ var f=vfi.files&&vfi.files[0]; if(f){ closeModal(); importVcf(f); } };
      vfi.click(); return;
    }
    if(t.closest('[data-callall]')){
      var cad=loadDraft(),
          cAll=CONTACTS.every(function(c){ return extraAt(cad,c.id)>-1; });
      if(cAll){
        cad.extra=cad.extra.filter(function(e){
          return !CONTACTS.some(function(c){ return c.id===e.id; }); });
      } else {
        CONTACTS.forEach(function(c){
          if(extraAt(cad,c.id)<0)
            cad.extra.push({ id:c.id, name:c.name, phone:c.phone, photo:'', src:'contact' });
        });
      }
      saveDraft(); repaintStep4(); return;
    }
    if(t.closest('[data-addguest]')){ commitAdd(true); return; }

    var face=t.closest('[data-face]');
    if(face){ pickFace(face.dataset.face); return; }

    var unx=t.closest('[data-unextra]');
    if(unx){
      var xd=loadDraft(), xi=extraAt(xd,unx.dataset.unextra);
      if(xi>-1) xd.extra.splice(xi,1);
      saveDraft(); repaintStep4(); return;
    }

    var ct=t.closest('[data-contact]');
    if(ct){
      var td=loadDraft(), ti=extraAt(td,ct.dataset.contact);
      if(ti>-1) td.extra.splice(ti,1);
      else {
        for(var ci=0; ci<CONTACTS.length; ci++) if(CONTACTS[ci].id===ct.dataset.contact){
          var c=CONTACTS[ci], cpn=normPhone(c.phone), cnm=c.name.toLowerCase();
          /* already typed in by hand? don't add the same person twice */
          if(td.extra.some(function(x){
            return (cpn && normPhone(x.phone)===cpn) || x.name.toLowerCase()===cnm;
          })){ toast(c.name+' is already on the list'); break; }
          td.extra.push({ id:c.id, name:c.name, phone:c.phone, photo:'', src:'contact' });
          break;
        }
      }
      saveDraft(); repaintStep4(); return;
    }

    var gf=t.closest('[data-gfilter]');
    if(gf){ inviteGroup=gf.dataset.gfilter; repaintStep4(); return; }

    var grp=t.closest('[data-group]');
    if(grp){
      var gd=loadDraft(), mem=groupMembers(grp.dataset.group),
          all=mem.length && mem.every(function(id){ return gd.invitees.indexOf(id)>-1; });
      mem.forEach(function(id){
        var at=gd.invitees.indexOf(id);
        if(all){ if(at>-1) gd.invitees.splice(at,1); }
        else if(at<0) gd.invitees.push(id);
      });
      saveDraft(); repaintStep4(); return;
    }

    if(t.closest('[data-sharelink]')){
      toast('Your shareable link is ready as soon as the event is created.','',4000);
      return;
    }

    if(t.closest('[data-info]')){ openInfo(); return; }
    if(t.closest('[data-info-verify]')){ closeModal(); promptVerify(); return; }
    if(t.closest('[data-info-profile]')){ closeModal(); location.hash='#profile'; return; }
    if(t.closest('[data-verifynow]')){
      if(linkPend().length) promptLinkChoice(true); else promptVerify();
      return;
    }
    if(t.closest('[data-mephoto]')){ pickMePhoto(); return; }
    if(t.closest('[data-mesave]')){
      saveMe(); propagateMe(); toast('Profile saved'); repaintProfile();
      checkPhoneLink(); return;
    }
    var padj=t.closest('[data-plusadj]');
    if(padj && !padj.disabled){
      var pid=route().id, pev=findEvent(pid), pm=loadMe();
      var pmax=pev?plusMaxOf(pev):0;
      var pn=Math.max(0, Math.min(pmax, (pm.plus[pid]||0) + (+padj.dataset.plusadj)));
      pm.plus[pid]=pn; saveMe();
      if(STORE.mode==='live' && window.D2C && D2C.setPlus)
        D2C.setPlus(pid, pn).catch(function(){});
      else appendLocalActivity(pid, 'user-plus',
        pn>0?'is bringing +'+pn:'isn’t bringing anyone now');
      var ps=document.getElementById('plus-slot');
      if(ps && pev) ps.innerHTML=plusRowInner(pev);
      var cg=document.getElementById('c-going');
      if(cg && pev) cg.textContent=((pev.counts||{}).going||0)+goingPlus(pev);
      return;
    }
    var clm=t.closest('[data-claim]');
    if(clm){ doClaim(clm.dataset.claim, false, clm.dataset.claimrow||''); return; }
    if(t.closest('[data-claim-go]')){
      var cin=document.getElementById('claim-name'), cv=cin&&cin.value.trim();
      if(!cv){ toast('Type your name first','err'); return; }
      doClaim(cv, true, ''); return;
    }
    if(t.closest('[data-name-go]')){
      var nin=document.getElementById('claim-name'), nv=nin&&nin.value.trim();
      if(!nv){ toast('Type your name first','err'); return; }
      var mn=loadMe(); mn.name=nv; saveMe();
      var cb=pendingName; pendingName=null;
      closeModal();
      if(cb) cb();
      return;
    }
    if(t.closest('[data-finish]')){
      var fp=document.getElementById('fin-phone');
      var mf=loadMe(); if(fp) mf.phone=fp.value;
      saveMe(); propagateMe(); closeModal();
      toast('Profile updated');
      checkPhoneLink(); return;
    }
    if(t.closest('[data-vedit]')){
      closeModal(); location.hash='#profile';
      setTimeout(function(){
        var pi=document.getElementById('me-phone');
        if(pi){ pi.focus(); pi.select(); }
      }, 300);
      return;
    }
    if(t.closest('[data-vskip]')){
      var md=loadMe(); md.verifyDeclined=normPhone(md.phone);
      saveMe(); closeModal();
      toast('Skipped - you can verify anytime from your profile','',4500);
      repaintMe();
      /* the verify sheet replaced the old photo follow-up - offer it now */
      if(!loadMe().photo){
        modal.innerHTML=finishCard(); modal.hidden=false;
        document.body.classList.add('modal-open');
      }
      return;
    }
    var sb=t.closest('[data-sms-send]');
    if(sb){
      if(sb.disabled) return;
      if(!smsLive()){                    /* demo: nothing to send, go to the code step */
        VF.stage='code'; modal.innerHTML=verifyCard();
        var dc=document.getElementById('vf-code'); if(dc) dc.focus();
        return;
      }
      if(Date.now()<SMS_AT){
        toast('Wait '+Math.ceil((SMS_AT-Date.now())/1000)+'s before another text','err');
        return;
      }
      var tel=toE164(loadMe().phone);
      if(!/^\+\d{8,15}$/.test(tel)){ toast('Add a full phone number first','err'); return; }
      var so=sb.textContent;
      sb.disabled=true; sb.textContent='Sending…';
      D2C.smsSend(tel).then(function(){
        /* a successful send means texting is back - any parked state ends */
        var mOk=loadMe();
        if(mOk.verifyPending){ mOk.verifyPending=''; mOk.verifyPendingAt=0; saveMe(); }
        var first=VF.stage!=='code'; VF.stage='code';
        if(first && !modal.hidden){
          modal.innerHTML=verifyCard();
          var ci=document.getElementById('vf-code'); if(ci) ci.focus();
        } else { sb.disabled=false; sb.textContent=so; }
        armCooldown();
        toast('Code texted to '+tel);
      }).catch(function(e){
        sb.disabled=false; sb.textContent=so;
        /* an outage parks the number - unless a code is already out, in
           which case the old code may still work, so keep that stage */
        if(SMS_OUTAGE[e && e.code] && VF.stage!=='code'){ smsParked(); return; }
        toast(smsErr(e),'err',5200);
      });
      return;
    }
    if(t.closest('[data-verify]')){
      var vc=document.getElementById('vf-code'), vv=vc&&vc.value.trim();
      if(!/^\d{6}$/.test(vv)){ toast('Enter the 6-digit code','err'); return; }
      var vb=t.closest('[data-verify]');
      if(!smsLive()){ smsVerified(); return; }   /* demo build: any 6 digits */
      if(vb.disabled) return;
      var vo=vb.textContent;
      vb.disabled=true; vb.textContent='Checking…';
      D2C.smsCheck(vv).then(function(tel){ smsVerified(tel); })
        .catch(function(e){
          vb.disabled=false; vb.textContent=vo;
          toast(smsErr(e),'err',5200);
        });
      return;
    }
    var ltg=t.closest('[data-linktgl]');
    if(ltg){
      LINKQ.on[ltg.dataset.linktgl]=!LINKQ.on[ltg.dataset.linktgl];
      linkSync(); return;
    }
    if(t.closest('[data-linkall]')){
      var allOn=LINKQ.profs.every(function(p){ return LINKQ.on[p.uid]; });
      LINKQ.profs.forEach(function(p){ LINKQ.on[p.uid]=!allOn; });
      linkSync(); return;
    }
    if(t.closest('[data-linklater]')){ LINK_LATER=true; closeModal(); repaintMe(); return; }
    if(t.closest('[data-linkgo]')){
      var lm=loadMe();
      LINKQ.profs.forEach(function(p){
        var oi=lm.linkOks.indexOf(p.uid), ri=lm.linkRejects.indexOf(p.uid);
        if(LINKQ.on[p.uid]){
          if(oi<0) lm.linkOks.push(p.uid);
          if(ri>-1) lm.linkRejects.splice(ri,1);
        } else {
          if(ri<0) lm.linkRejects.push(p.uid);
          if(oi>-1) lm.linkOks.splice(oi,1);
          lm.cloudLinked=(lm.cloudLinked||[]).filter(function(c){ return c.uid!==p.uid; });
        }
      });
      saveMe(); closeModal();
      if(linkedProfiles().length) finishLink();
      else { toast('Number verified - accounts kept separate'); repaintMe(); }
      return;
    }
    var mnm=t.closest('[data-mname]');
    if(mnm){ MERGE.name=mnm.dataset.mname; modal.innerHTML=mergeCard(); return; }
    var mph=t.closest('[data-mphoto]');
    if(mph){ MERGE.photo=(MERGE.photos[+mph.dataset.mphoto]||{}).v||''; modal.innerHTML=mergeCard(); return; }
    if(t.closest('[data-mupload]')){ pickMergePhoto(); return; }
    if(t.closest('[data-mergego]')){
      applyMerge(MERGE.name, MERGE.photo);
      closeModal();
      toast('Accounts linked as '+fname(loadMe().name||'you'));
      repaintProfile(); return;
    }
    var rok=t.closest('[data-rok]');
    if(rok){ actRequest(rok.dataset.rok, true); return; }
    var rno=t.closest('[data-rno]');
    if(rno){ actRequest(rno.dataset.rno, false); return; }
    var gsec=t.closest('[data-gsec]');
    if(gsec){
      guestsOpen[gsec.dataset.gsec]=!guestsOpen[gsec.dataset.gsec];
      var r14=route();
      if(r14.v==='guests') app.innerHTML=renderGuests(r14.id);
      return;
    }
    var am=t.closest('[data-actmore]');
    if(am){
      ACT_OPEN[am.dataset.actmore]=!ACT_OPEN[am.dataset.actmore];
      var ra=route();
      if(ra.v==='event') app.innerHTML=renderEvent(ra.id);
      return;
    }

    var sec=t.closest('[data-sec]');
    if(sec){ SEC_OPEN[sec.dataset.sec]=!SEC_OPEN[sec.dataset.sec]; repaintStep3(); return; }

    var opt=t.closest('[data-opt]');
    if(opt){
      var od=loadDraft(), f=opt.dataset.opt;
      od[f]=opt.dataset.val;
      if(f==='rsvpMode' && opt.dataset.val==='custom' && !od.rsvpBy) od.rsvpBy=od.date;
      saveDraft(); repaintStep3(); return;
    }

    var st1=t.closest('[data-inc]'), st2=t.closest('[data-dec]');
    if(st1||st2){ bumpStep((st1||st2).dataset[st1?'inc':'dec'], st1?1:-1); return; }

    var rem=t.closest('[data-rem]');
    if(rem){ toggleReminder(rem.dataset.rem); return; }
    if(t.closest('[data-remadd]')){ addReminder(); return; }
    var remx=t.closest('[data-remx]');
    if(remx){
      var rd=loadDraft(), at=rd.reminders.indexOf(+remx.dataset.remx);
      if(at>-1) rd.reminders.splice(at,1);
      saveDraft(); repaintStep3(); return;
    }
    if(t.closest('[data-notify]')){
      var nd=loadDraft(); nd.notifyChanges=!nd.notifyChanges;
      saveDraft(); repaintStep3(); return;
    }

    if(t.closest('[data-endtime]')){
      var ed=loadDraft(); ed.endTime=timePlus(ed.time,120)||'';
      saveDraft(); repaintWhen(); return;
    }
    if(t.closest('[data-endtime-off]')){ loadDraft().endTime=null; saveDraft(); repaintWhen(); return; }
    var vb=t.closest('[data-vibe]');
    if(vb){
      var vd=loadDraft(), at=vd.vibes.indexOf(vb.dataset.vibe);
      if(at>-1){ vd.vibes.splice(at,1); saveDraft(); repaintVibes(); return; }
      /* Custom asks for its text before it turns on; active Custom just
         toggles off like any other tile (the text is kept for next time) */
      if(vb.dataset.vibe==='Custom'){ openVibeEdit(); return; }
      vd.vibes.push(vb.dataset.vibe);
      saveDraft(); repaintVibes(); return;
    }
    if(t.closest('[data-medit-save]')){
      var mev2=MEDIT && findEvent(MEDIT.id),
          mm2=mev2 && mev2.messages && mev2.messages[MEDIT.idx],
          mval=(document.getElementById('me-in')||{value:''}).value.trim();
      if(!mm2){ closeModal(); return; }
      if(!mval){ toast('A message can’t be empty - delete it instead.','err',4000); return; }
      if(STORE.mode==='live' && window.D2C && D2C.editMessage){
        D2C.editMessage(mev2.id, mm2, mval)
          .then(function(){ toast('Message updated'); })
          .catch(function(e){ toast((e&&e.message)||'Could not save the edit','err',4000); });
      } else {
        mm2.text=mval; mm2.edited=true;
        STORE.notify(); toast('Message updated');
      }
      MEDIT=null; closeModal(); return;
    }
    if(t.closest('[data-cvibe-save]')){
      var cvi=document.getElementById('cv-in'), cdd=loadDraft();
      cdd.vibeCustom=(cvi&&cvi.value.trim())||'';
      if(cdd.vibes.indexOf('Custom')<0) cdd.vibes.push('Custom');
      saveDraft(); closeModal(); repaintVibes(); return;
    }
    var vinf=t.closest('[data-vibeinfo]');
    if(vinf){
      var vev=findEvent(vinf.dataset.vibeinfo);
      if(vev && vev.vibeCustom){
        modal.innerHTML='<div class="modal-card claim">'+
          '<button class="modal-x" type="button" data-modal-close aria-label="Close">'+ico('x')+'</button>'+
          '<div class="modal-ic"><svg aria-hidden="true" style="width:36px;height:36px">'+
            '<use href="#v-custom"/></svg></div>'+
          '<h3 id="modal-h">Custom vibe</h3>'+
          '<p>'+h(vev.vibeCustom)+'</p>'+
          '<button class="modal-cta" type="button" data-modal-close>Got it</button>'+
        '</div>';
        modal.hidden=false; document.body.classList.add('modal-open'); modalShown();
      }
      return;
    }

    var backEl=t.closest('[data-back]');
    if(backEl){ e.preventDefault(); back(backEl.dataset.back); return; }

    var nav=t.closest('a[data-nav]');
    if(nav){ e.preventDefault(); go(nav.getAttribute('href')); return; }

    var tab=t.closest('[data-tab]');
    if(tab){ homeTab=tab.dataset.tab; render(); return; }


    var step=t.closest('[data-step]');
    if(step){
      var n=+step.dataset.step;
      if(calState.mode==='week'){ calState.sel=addDays(calState.sel,7*n); }
      else{
        calState.m+=n;
        if(calState.m<0){ calState.m=11; calState.y--; }
        if(calState.m>11){ calState.m=0; calState.y++; }
      }
      paintCal(); return;
    }

    var mode=t.closest('[data-mode]');
    if(mode){
      calState.mode=mode.dataset.mode;
      if(calState.mode==='month'){
        var d=parse(calState.sel); calState.y=d.getFullYear(); calState.m=d.getMonth();
      }
      render(); return;
    }

    var day=t.closest('[data-day]');
    if(day && !day.classList.contains('out')){
      calState.sel=day.dataset.day;
      if(calState.mode==='month'){
        var dd=parse(calState.sel); calState.y=dd.getFullYear(); calState.m=dd.getMonth();
      }
      paintCal(); return;
    }

    var tog=t.closest('[data-toggle]');
    if(tog){ var dy=tog.closest('.day');
      dy.dataset.open = dy.dataset.open==='1'?'0':'1';
      calState.open = +dy.dataset.open; return; }

    if(t.closest('[data-unhide]')){ unhideAll(); toast('Hidden events restored'); render(); return; }

    if(t.closest('[data-discmore]')){
      DISC_OPEN=!DISC_OPEN;
      var dlb=document.getElementById('list-body');
      if(dlb) dlb.innerHTML=homeList(homeTab,homeQ);
      return;
    }

    var fs0=t.closest('[data-focus-search]');
    if(fs0){
      var bar=document.querySelector('.home-search');
      if(!bar) return;
      homeSearch=!bar.classList.contains('open');
      bar.classList.toggle('open', homeSearch);
      fs0.classList.toggle('on', homeSearch);
      fs0.setAttribute('aria-expanded', String(homeSearch));
      var qi=bar.querySelector('input');
      if(homeSearch){ qi.focus(); qi.select(); }
      else if(homeQ){
        homeQ=''; qi.value='';
        var lb=document.getElementById('list-body');
        if(lb) lb.innerHTML=homeList(homeTab,homeQ);
      }
      return;
    }
    if(t.closest('[data-toggle-search]')){
      var bar=document.querySelector('.cal-search');
      if(bar){ bar.classList.toggle('open');
        if(bar.classList.contains('open')) bar.querySelector('input').focus();
        else { calState.q=''; bar.querySelector('input').value=''; paintCal(); } }
      return;
    }

    var ph=t.closest('[data-ph]');
    if(ph){ openLb(route().id, +ph.dataset.ph); return; }
    var ivw=t.closest('[data-imgview]');
    if(ivw){ openImgLb(ivw.dataset.imgview, ivw.dataset.imgby||''); return; }
    var mb=t.closest('[data-msg]');
    if(mb){ openMsgMenu(mb); return; }
    var lbs=t.closest('[data-lb-step]');
    if(lbs){ stepLb(+lbs.dataset.lbStep); return; }
    /* NB: `lb` is shadowed here - a `var lb` in the search branch above hoists
       over the lightbox element, so match the element itself. Clicks on the
       empty stage (beside the image) count as the backdrop too. */
    if(t.closest('[data-lb-close]') || t.id==='lightbox' || t.classList.contains('lb-stage')){
      closeLb(); return; }

    var rs=t.closest('#rsvp button[data-k]');
    if(rs){ rsvp(rs); return; }

    var dots=t.closest('[data-gdots]');
    if(dots){
      e.stopPropagation();
      if(anchor===dots){ closeMenu(); return; }
      closeMenu();
      var isPerson=!!dots.dataset.gduid;
      menu.innerHTML='<button type="button" role="menuitem" class="danger" data-gremove>'+
        ico('trash')+(isPerson?'Remove Guest':'Remove Invitation')+'</button>';
      menuEvent=null;
      menuGuest={ id:route().id, name:dots.dataset.gdots,
                  uid:dots.dataset.gduid||'', docId:dots.dataset.gdid||'',
                  status:dots.dataset.gstat||'' };
      anchor=dots; dots.setAttribute('aria-expanded','true');
      placeMenu(dots); return;
    }
    if(t.closest('[data-gremove]')){
      var mg=menuGuest; closeMenu();
      if(mg) askRemoveGuest(mg);
      return;
    }
    var rq=t.closest('[data-greq]');
    if(rq){
      e.stopPropagation();
      if(anchor===rq){ closeMenu(); return; }
      closeMenu();
      menu.innerHTML='<button type="button" role="menuitem" class="danger" data-greqgo>'+
        ico('trash')+'Request Removal</button>';
      menuEvent=null;
      menuGuest={ id:route().id, name:rq.dataset.greq, uid:rq.dataset.grequid||'' };
      anchor=rq; rq.setAttribute('aria-expanded','true');
      placeMenu(rq); return;
    }
    if(t.closest('[data-greqgo]')){
      var mq=menuGuest; closeMenu();
      if(mq) askReqRemove(mq);
      return;
    }
    if(!t.closest('#row-menu')) closeMenu();
  });

  function paintCal(){
    var el=document.getElementById('cal-body');
    if(el) el.innerHTML=calBody();
  }

  /* the quick-add field: Enter commits, so several names go in without
     ever leaving the keyboard */
  function commitAdd(all){
    var box=document.getElementById('c-add');
    if(!box) return;
    var text=box.value;
    if(!all){
      var cut=text.lastIndexOf(',');
      if(cut<0) return;
      text=text.slice(0,cut);
      box.value=box.value.slice(cut+1).replace(/^\s+/,'');
    } else box.value='';
    var added=addManual(text);
    if(added) repaintStep4();
    else if(all && text.trim()) toast('Already on the list','err');
    var again=document.getElementById('c-add');
    if(again) again.focus();
  }

  document.addEventListener('keydown',function(e){
    if(e.key==='Enter' && e.target.id==='msg-in'){ e.preventDefault(); sendMsg(e.target.dataset.event); }
    if(e.key==='Enter' && e.target.id==='c-add'){ e.preventDefault(); commitAdd(true); }
    if(e.key==='Enter' && e.target.id==='inv-add'){ e.preventDefault(); commitInvite(true); }
    if(e.key==='Enter' && e.target.id==='cv-in'){
      e.preventDefault();
      var cvb=document.querySelector('[data-cvibe-save]'); if(cvb) cvb.click();
    }
    /* spans/divs with role="button" don't click from the keyboard on their own */
    if((e.key==='Enter'||e.key===' ') && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){
      var rb=e.target.closest && e.target.closest('[role="button"]');
      if(rb && rb.tagName!=='BUTTON' && rb.tagName!=='A'){ e.preventDefault(); rb.click(); }
    }
  });

  document.addEventListener('input',function(e){
    var mk=e.target.getAttribute && e.target.getAttribute('data-me');
    if(mk){ loadMe()[mk]=e.target.value; return; }
    if(e.target.id==='cv-in'){
      var cvc=document.getElementById('cv-count');
      if(cvc) cvc.textContent=e.target.value.length+' / 80';
      return;
    }
    var dk=e.target.getAttribute && e.target.getAttribute('data-d');
    if(dk){
      loadDraft()[dk]=e.target.value; saveDraft();
      if(dk==='about'){
        var cc=document.getElementById('c-count');
        if(cc) cc.textContent=e.target.value.length+' / 2000';
      } else if(dk==='venue'||dk==='address'){
        var mb=document.querySelector('.mapb');
        if(mb) mb.hidden=!draftMapQuery(loadDraft());
      } else if(dk==='inviteMsg'){
        var d4=loadDraft(); d4.msgTouched=true;
        var mc=document.getElementById('c-msgcount');
        if(mc) mc.textContent=e.target.value.length+' / 300';
      } else if(dk==='entryNote'){
        var ec=document.getElementById('c-entrycount');
        if(ec) ec.textContent=e.target.value.length+' / 80';
        var eh=e.target.closest('.sec3').querySelector('.sval');
        if(eh) eh.textContent=entryLabel(loadDraft());
      }
      return;
    }
    if(e.target.id==='c-add'){
      if(e.target.value.indexOf(',')>-1) commitAdd(false);
      return;
    }
    if(e.target.id==='inv-add'){
      if(e.target.value.indexOf(',')>-1) commitInvite(false);
      return;
    }
    if(e.target.getAttribute && e.target.getAttribute('data-step')==='capacity'){
      var cd2=loadDraft(), cn=parseInt(e.target.value,10);
      cd2.capMode='custom';
      if(!isNaN(cn)) cd2.capacity=Math.max(2,Math.min(500,cn));
      saveDraft();
      var chd=e.target.closest('.sec3'), csv=chd&&chd.querySelector('.sval');
      if(csv) csv.textContent=capLabel(cd2);
      return;
    }
    if(e.target.id==='msg-in'){
      var sb=document.getElementById('msg-send');
      if(sb) sb.disabled=!e.target.value.trim();
      return;
    }
    if(e.target.id==='q-invite'){
      inviteQ=e.target.value;
      var gl=document.getElementById('g-list');
      if(gl) gl.innerHTML=inviteList();
      return;
    }
    if(e.target.id==='q-home'){
      homeQ=e.target.value;
      var el=document.getElementById('list-body');
      if(el) el.innerHTML=homeList(homeTab,homeQ);
    } else if(e.target.id==='q-cal'){
      calState.q=e.target.value;
      paintCal();
    }
  });

  /* ---------- create form: native pickers ---------- */
  document.addEventListener('change',function(e){
    var t=e.target, d=loadDraft(), lab;
    /* leaving the capacity field snaps it into range and repaints the card */
    if(t.getAttribute && t.getAttribute('data-step')==='capacity'){
      var cv=parseInt(t.value,10);
      d.capMode='custom';
      if(!isNaN(cv)) d.capacity=Math.max(2,Math.min(500,cv));
      saveDraft(); repaintStep3(); return;
    }
    if(t.id==='c-rsvp'){ d.rsvpBy=t.value; d.rsvpMode='custom'; d.rsvpTouched=true;
                         saveDraft(); repaintStep3(); return; }
    if(t.id==='c-rsvp2'){ d.rsvpBy=t.value; d.rsvpMode='custom'; d.rsvpTouched=true;
                          saveDraft(); repaintP2(); return; }
    var p2=t.getAttribute && t.getAttribute('data-p2');
    if(p2){ applyP2(p2,t.value); saveDraft(); repaintP2(); return; }
    if(t.id==='c-remunit'){ d.remUnit=t.value; saveDraft(); repaintStep3(); return; }
    if(t.id==='c-date'){
      d.date=t.value; lab=dateLabel(t.value);
      if(!d.rsvpTouched) d.rsvpBy=t.value;

    if(STORE.mode==='live' && window.D2C && D2C.renameLinked){

  function finishLink(){
    var m=loadMe();
    var seenN={}, seenP={}, names=[], photos=[];
    var profs=[m].concat(linkedProfiles())
      .slice().sort(function(a,b){ return (b.at||0)-(a.at||0); });   /* newest first */
    profs.forEach(function(p){
      if(p.name && !seenN[p.name.toLowerCase()]){
        seenN[p.name.toLowerCase()]=1; names.push({ v:p.name, mine:p.uid===m.uid });
      }
      if(p.photo && !seenP[p.photo]){
        seenP[p.photo]=1; photos.push({ v:p.photo, mine:p.uid===m.uid });
      }
    });

       ranked below every real photo so skipping never discards a real one */

      if(!seenP[d]){ seenP[d]=1; photos.push({ v:d, mine:p.uid===m.uid, def:true }); }
    });
    applyMerge(names.length?names[0].v:'',
               (photos.length && !photos[0].def) ? photos[0].v : '');

  function commitInvite(all){

        ev=sheet?findEvent(sheet.dataset.invitefor):null,
        have={}, phones={};
    if(ev) [].concat(ev.guests||[],ev.maybes||[],ev.cants||[],ev.waiting||[],
                     ev.requests||[],ev.guestPreview||[])
      .forEach(function(g){

  function doClaim(name, custom, rowId){
    var id=route().id, m=loadMe(), ev=findEvent(id);
    var taken=ev?takenSpots(ev):{rows:{},names:{}};
    /* only the exact SPOT being claimed can be taken - two invitees who
       share a full name each keep their own claimable row */
    if(ev && !custom && (rowId ? taken.rows[rowId] : taken.names[name.toLowerCase()])){
      toast('Sorry - that spot was just claimed. Tap your own name or type it below.','err',4500);
      return;
    }
    /* a typed name that matches an UNCLAIMED listed spot IS a claim of that
       spot; matching only claimed spots means a second person with the same
       name - fine as a plain join, a host-approval request on gated rungs.
       An unlisted name on the gated rungs is a join request as before. */
    if(custom && ev){
      var pool=inviteePool(ev), listed=null, i, gi;
      for(i=0;i<pool.length && !listed;i++){
        gi=pool[i];
        if((gi.name||'').toLowerCase()!==name.toLowerCase()) continue;
        if(gi.docId ? taken.rows[gi.docId] : taken.names[(gi.name||'').toLowerCase()]) continue;
        listed=gi;
      }
      if(listed){ name=listed.name; rowId=listed.docId||''; }
      else if(joinMode(ev)==='guests'||joinMode(ev)==='private'){ requestJoin(ev, name); return; }
    }
    m.claims[id]=name;
    if(rowId) m.claimRow[id]=rowId;
    if(custom || !m.name) m.name=name;
    if(!custom && ev){
      var src=null;
      claimList(ev).forEach(function(g){
        if(src) return;
        if(rowId ? g.docId===rowId : g.name===name) src=g;
      });
      if(src){
        if(src.phone && !m.phone) m.phone=src.phone;
        /* never adopt the generic placeholder as a real photo */
        if(src.avatarUrl && src.avatarUrl!==GAV && !m.photo) m.photo=src.avatarUrl;
      }
    }
    if(m.events.indexOf(id)<0) m.events.push(id);
    var pr=pendingRsvp; pendingRsvp=null;
    saveMe(); closeModal();
    if(STORE.mode==='live' && window.D2C && D2C.announceGuest && !m.rsvp[id])
      D2C.announceGuest(id, m.claimRow[id]||'').catch(function(){});
    toast('Welcome, '+fname(name)+'!','top');
    if(pr && pr.id===id){
      var pb=document.querySelector('#rsvp button[data-k="'+pr.k+'"]');
      if(pb) rsvp(pb);
    }
    /* an adopted number that duplicates an existing account links right away
       (behind the 2FA-style check); otherwise offer the photo/phone follow-up */
    var m2=loadMe();
    if(normPhone(m2.phone) && !phoneVerified() && !verifyDeclined() && !verifyPending() &&
       (phoneMatches().length || smsLive())){
      promptVerify();
    } else if(!m2.phone || !m2.photo){
      modal.innerHTML=finishCard(); modal.hidden=false;
      document.body.classList.add('modal-open');
    }
  }

  /* ---------- the host answers a request ---------- */
  function actRequest(ref, ok){
    var id=route().id, ev=findEvent(id);
    if(!ev || !ev.requests) return;
    var i, r=null;
    for(i=0;i<ev.requests.length;i++)
      if(String(ev.requests[i].docId||i)===String(ref)){ r=ev.requests[i]; break; }
    if(!r) return;
    if(r.reqType==='remove'){
      /* approving opens the standard remove confirm (erase toggle included);
         the request doc rides along as reqDoc and clears on either outcome.
         A remove request without its target uid must NEVER fall through to
         the name-only invitation-withdraw path - that deletes their pending
         row but bans nobody, so the person keeps full access to the event. */
      if(ok){
        var tu=r.targetUid||r.uid;
        if(!tu){ toast('This request lost its guest - decline it, then remove them from the list yourself.','err',6000); return; }
        askRemoveGuest({ id:id, uid:tu, name:r.targetName||r.name, reqDoc:r.docId });
        return;
      }
      if(STORE.mode==='live' && window.D2C && r.docId){
        D2C.declineRequest(ev.id, r.docId)
          .then(function(){ toast('Request declined'); })
          .catch(function(e){ toast((e&&e.message)||'Could not update the request','err',4500); });
        return;
      }
      ev.requests.splice(i,1); STORE.notify(); toast('Request declined'); return;
    }
    if(STORE.mode==='live' && window.D2C && r.docId){
      (ok ? D2C.approveRequest(ev.id, r.docId) : D2C.declineRequest(ev.id, r.docId))
        .then(function(){ toast(ok ? r.name+' approved' : 'Request declined'); })
        .catch(function(e){ toast((e&&e.message)||'Could not update the request','err',4500); });
      return;                            /* the guests stream repaints */
    }
    ev.requests.splice(i,1);
    if(ok){
      ev.waiting=(ev.waiting||[]).concat([{ name:r.name, avatarUrl:r.avatarUrl||GAV,
        phone:r.phone||'', message:'', invitedLabel:'Request approved',
        isHost:false, isYou:false, status:'pending', uid:r.uid||'', plus:0,
        source:'request' }]);
      ev.counts.pending=(ev.counts.pending||0)+1;
      appendLocalActivity(id, 'user-plus', 'approved '+r.name);

  function rsvp(btn){
    var box=btn.parentNode, k=btn.dataset.k, id=route().id, ev=findEvent(id),
        cur=box.querySelector('[aria-pressed="true"]');
    if(cur===btn) return;
    if(ev){
      if(ev.role==='hosting') return;          /* hosts are going by definition */
      if(ev.rsvpBy && TODAY>ev.rsvpBy){
        toast('RSVPs closed on '+dateLabel(ev.rsvpBy)+' - ask the host to reopen them.','err',4500);
        return;
      }
      /* capacity counts guests only; the host rides on top of it */
      if(k==='going' && ev.capacityMax>0 && ev.counts.going>ev.capacityMax){
        toast('This event is full ('+ev.capacityMax+' guests).','err',4000);
        return;
      }
    }
    var m=loadMe();
    if(!m.name){
      pendingRsvp={ id:id, k:k };
      if(ev){ modal.innerHTML=claimCard(ev); modal.hidden=false;
              document.body.classList.add('modal-open'); }
      return;
    }
    if(ev && !canJoin(ev)){
      if(myJoinRequest(ev)){
        toast('Request sent - waiting for '+fname(ev.hostName)+' to approve.','',4500);
        return;
      }
      /* the way in is claiming a spot - reopen the sheet with the answer parked */
      pendingRsvp={ id:id, k:k };
      modal.innerHTML=claimCard(ev); modal.hidden=false;
      document.body.classList.add('modal-open');
      return;
    }
    var prev=myRsvp(id)||'';
    var n={going:+box.dataset.going, maybe:+box.dataset.maybe, cant:+box.dataset.cant};
    if(cur) n[cur.dataset.k]--;
    n[k]++;
    box.dataset.going=n.going; box.dataset.maybe=n.maybe; box.dataset.cant=n.cant;
    Array.prototype.forEach.call(box.children,function(b){
      b.setAttribute('aria-pressed', String(b===btn)); });
    ['going','maybe','cant'].forEach(function(x){
      var el=document.getElementById('c-'+x);
      if(el) el.textContent=n[x]+(x==='going'&&ev?goingPlus(ev):0); });

    /* remember the answer on this uid and keep the event on my list -
       a "can't go" still stays visible in case you change your mind */
    m.rsvp[id]=k;
    if(m.events.indexOf(id)<0) m.events.push(id);
    saveMe();
    if(ev) ev.counts={going:n.going, maybe:n.maybe, cant:n.cant,
                      pending:(ev.counts&&ev.counts.pending)||0};
    /* first answer: my waiting presence is absorbed by my response - the
       curated uid-less row under my name, and my own approved-request row.
       Only rows that were counted move the pending counter (an approved
       request was; an announce-visit row never was). Live mode mirrors this
       via absorbPending + the wasReq flag on setRsvp. */
    var wasReq=false;
    if(!prev && ev && ev.waiting){
      var an=(m.claims[id]||m.name||'').toLowerCase(), uids0=myUids(), cut=0;
      ev.waiting=ev.waiting.filter(function(g){
        if(g.uid){
          if(uids0.indexOf(g.uid)<0) return true;
          if(g.source==='request'){ wasReq=true; cut++; }
          return false;
        }
        if(an && (g.name||'').toLowerCase()===an){ cut++; return false; }
        return true;
      });
      if(cut) ev.counts.pending=Math.max(0,(ev.counts.pending||0)-cut);
    }
    var pslot=document.getElementById('plus-slot');
    if(pslot && ev) pslot.innerHTML=plusRowInner(ev);
    if(STORE.mode==='live' && window.D2C && D2C.setRsvp){
      D2C.setRsvp(id, k, prev, wasReq).catch(function(e){
        toast((e&&e.message)||'Could not save your RSVP','err',4500);
      });
    } else {
      appendLocalActivity(id, k==='going'?'check':k==='maybe'?'help':'x',
        k==='going'?'is Going':k==='maybe'?'might come':'can\u2019t make it', k==='going');
      toast(k==='going'?'You\u2019re going!':k==='maybe'?'Marked as maybe':'Marked as can\u2019t go');
    }
  }

  /* ---------- privacy panel (fronts CookieYes, whose UI never renders) ----
     Same mechanism as index.html: the revisit button (captured, so CookieYes
     never sees the click) or the info sheet's link toggles the panel; the
     switch drives CookieYes's hidden opt-out checkbox + save button. A
     checked CookieYes box means opted OUT - the inverse of the switch. */
  (function(){
    var panel=document.getElementById('privacyPanel');
    var ppToggle=document.getElementById('ppAnalytics');
    var ppNote=panel.querySelector('.pp-note');
    var ppNoteDefault=ppNote.textContent;
    var ckyBox=function(){ return document.querySelector('.cky-modal input[type="checkbox"], .cky-consent-container input[type="checkbox"]'); };
    var ckySave=function(){
      return document.querySelector('.cky-btn-preferences') ||
        Array.prototype.find.call(document.querySelectorAll('.cky-modal button, .cky-consent-container button'),
          function(b){ return /save/i.test(b.textContent); });
    };
    var syncPanel=function(){
      var box=ckyBox();
      if(box){
        ppToggle.checked=!box.checked;
        ppToggle.disabled=false;
        ppNote.textContent=ppNoteDefault;
      } else {
        ppToggle.checked=false;
        ppToggle.disabled=true;
        ppNote.textContent='Our analytics tool has not loaded in this browser, so nothing is being tracked.';
      }
    };
    document.addEventListener('click', function(e){
      if(!e.isTrusted || !e.target.closest) return;   /* synthetic clicks on hidden CookieYes controls must not close the panel */
      if(e.target.closest('.cky-btn-revisit-wrapper, #ppOpen')){
        e.preventDefault(); e.stopPropagation();
        if(e.target.closest('#ppOpen')) closeModal();  /* the info sheet sits above the panel */
        syncPanel();
        panel.hidden=!panel.hidden;
      } else if(!panel.hidden && !e.target.closest('#privacyPanel')){
        panel.hidden=true;
      }
    }, true);
    document.getElementById('ppClose').addEventListener('click', function(){ panel.hidden=true; });
    ppToggle.addEventListener('change', function(){
      var want=!ppToggle.checked;   /* desired CookieYes opt-out state */
      var box=ckyBox();
      if(!box) return;
      if(box.checked!==want) box.click();
      var save=ckySave();
      if(save) save.click();
      setTimeout(function(){        /* verify against CookieYes's real state */
        var b=ckyBox();
        if(b && b.checked!==want && !want){
          /* opting back IN doesn't commit through the hidden modal - erase the
             stored opt-out and reload clean */
          ['', '; domain='+location.hostname, '; domain=.'+location.hostname.replace(/^www\./,'')]
            .forEach(function(d){ document.cookie='cookieyes-consent=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/'+d; });
          location.reload();
          return;
        }
        if(b) ppToggle.checked=!b.checked;
      }, 400);
    });
  })();

      D2C.deleteEvent(id).then(after).catch(function(e){
        toast((e&&e.message)||'Could not delete the event','err',5000);
      });
      return;
    }
    STORE.setEvents(STORE.events.filter(function(e){ return e.id!==id; }));
    after();
  }

  /* ---------- removing someone (host only) ----------
     A pending uid-less row is just an invitation - withdrawing it frees the
     name. A person (any row with a visitor uid) is removed AND banned: the
     event disappears for them and their link stops working. */
  function askRemoveGuest(mg){
    var ev=findEvent(mg.id); if(!ev || !mg.name) return;
    var eraseOn=true;   /* the toggle's live state - read when Remove is tapped */
    confirmFn=function(){ doRemoveGuest(mg, eraseOn); };
    modal.innerHTML=confirmCard('Remove “'+mg.name+'”?',
      mg.uid
        ? 'They come off the guest list and the event disappears for them - their link stops working. You can invite them again later.'
        : 'Their invitation is withdrawn and they leave the waiting list. You can invite them again anytime.',
      mg.uid ? 'Remove guest' : 'Remove invitation',
      mg.uid
        ? '<div class="swrow rm-erase"><span>Also erase their messages, photos &amp; activity</span>'+
          '<button class="sw on" type="button" role="switch" aria-checked="true" id="rm-erase" '+
          'aria-label="Also erase their messages, photos and activity"><i></i></button></div>'
        : '');
    modal.hidden=false;
    document.body.classList.add('modal-open');
    var sw=modal.querySelector('#rm-erase');
    if(sw) sw.addEventListener('click',function(){
      eraseOn=!eraseOn;
      sw.classList.toggle('on',eraseOn);
      sw.setAttribute('aria-checked',String(eraseOn));
    });
    var c=modal.querySelector('[data-confirm-yes]'); if(c) c.focus();
  }
  /* ---------- a member asks the host to remove someone ---------- */
  function askReqRemove(mg){
    var ev=findEvent(mg.id); if(!ev || !mg.uid || !mg.name) return;
    if((ev.requests||[]).some(function(r){ return r.reqType==='remove' && r.targetUid===mg.uid; })){
      toast('Already requested - '+fname(ev.hostName)+' decides.','',4500); return;
    }
    confirmFn=function(){ doReqRemove(mg); };
    modal.innerHTML=confirmCard('Ask to remove “'+mg.name+'”?',
      'Your request goes privately to '+fname(ev.hostName)+'. Nothing happens unless they approve it.',
      'Send request');
    modal.hidden=false;
    document.body.classList.add('modal-open');
    var c=modal.querySelector('[data-confirm-yes]'); if(c) c.focus();
  }
  function doReqRemove(mg){
    var ev=findEvent(mg.id); if(!ev) return;
    var sent=function(){ toast('Request sent - '+fname(ev.hostName)+' decides.','',5000); };
    if(STORE.mode==='live' && window.D2C && D2C.requestRemoval){
      toast('Sending…','wait',0);
      D2C.requestRemoval(ev.id, mg.uid, mg.name).then(sent)
        .catch(function(e){ toast((e&&e.message)||'Could not send the request','err',4500); });
      return;
    }
    ev.requests=(ev.requests||[]).concat([{ reqType:'remove', uid:mg.uid, name:mg.name,
      targetUid:mg.uid, targetName:mg.name, avatarUrl:GAV,
      byName:loadMe().name||'A guest', docId:'' }]);
    STORE.notify(); sent();
  }
  function doRemoveGuest(mg, erase){
    var ev=findEvent(mg.id); if(!ev) return;
    if(STORE.mode==='live' && window.D2C){
      toast('Removing…','wait',0);
      (mg.uid ? D2C.banGuest(ev.id, mg.uid, mg.name, erase)
              : D2C.removeGuest(ev.id, mg.name, mg.docId||''))
        .then(function(){
          /* an approved removal request is done with its request doc (the ban
             usually swept it already - the doc is keyed by the target's uid) */
          if(mg.reqDoc && D2C.declineRequest) D2C.declineRequest(ev.id, mg.reqDoc).catch(function(){});
          toast(mg.uid?'Guest removed':'Invitation removed');
        })
        .catch(function(e){ toast((e&&e.message)||'Could not remove','err',4500); });
      return;
    }
    var low=(mg.name||'').toLowerCase(), cuts={going:0,maybe:0,cant:0,pending:0};
    var hit=function(g){
      /* an invitation removal with a known row hits exactly that row */
      if(!mg.uid) return mg.docId ? g.docId===mg.docId
                                  : (!g.uid && (g.name||'').toLowerCase()===low);
      return g.uid===mg.uid || (!g.uid && (g.name||'').toLowerCase()===low);
    };
    [['guests','going'],['maybes','maybe'],['cants','cant'],['waiting','pending']]
      .forEach(function(p){
        var arr=ev[p[0]]||[], keep=arr.filter(function(g){ return !hit(g); });
        cuts[p[1]]=arr.length-keep.length;
        ev[p[0]]=keep;
      });
    ['going','maybe','cant','pending'].forEach(function(k){
      if(cuts[k] && ev.counts) ev.counts[k]=Math.max(0,(ev.counts[k]||0)-cuts[k]);
    });
    ev.requests=(ev.requests||[]).filter(function(r){ return !hit(r); });
    if(mg.uid && (ev.banned||[]).indexOf(mg.uid)<0)
      ev.banned=(ev.banned||[]).concat([mg.uid]);
    if(mg.uid && erase){
      var mine=function(u){ return u===mg.uid; };
      ['chatMessages','messages'].forEach(function(k){
        if(ev[k]) ev[k]=ev[k].filter(function(c){ return !mine(c.fromUid||c.from); });
      });
      if(ev.photos) ev.photos=ev.photos.filter(function(p){ return !mine(p.byUid); });
      if(ev.activity) ev.activity=ev.activity.filter(function(a){ return !mine(a.personUid); });
    }
    STORE.notify();
    toast(mg.uid?'Guest removed':'Invitation removed');
  }

  function closeMenu(){
    menu.hidden=true;
    /* park it back on <body> - its last parent may be about to be re-rendered */
    if(menu.parentNode!==document.body) document.body.appendChild(menu);
    if(anchor){ anchor.setAttribute('aria-expanded','false'); anchor=null; }
  }
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ closeMenu(); closeLb(); closeModal(); }
    if(lbEvent){
      if(e.key==='ArrowRight') stepLb(1);
      if(e.key==='ArrowLeft')  stepLb(-1);
    }
  });

  function loadingView(){
    return '<div class="wrap"><header class="top"></header>'+
      '<h1 class="title">Events</h1><p class="skel">Loading events\u2026</p></div>';
  }

  /* Any store change - first load, a new event, an edited doc, a subcollection
     arriving - repaints the current view in place. */
  STORE.onChange(function(){
    var rv=route().v;
    /* never repaint over a half-filled form - but an edit still needs the
       first load, since it cannot open before its event exists */
    if(rv==='create'||(rv==='edit'&&EDIT)) return;
    var y=app.scrollTop;
    render();
    jump(y);
  });

  /* the other device keeps opening events after we linked - pull the fresh
     union when the app boots and whenever this tab comes back into view */
  var lastSync=0;
  function syncLinks(){
    if(STORE.mode!=='live' || !phoneVerified()) return;
    var now=Date.now();
    if(now-lastSync<60000) return;
    lastSync=now; saveMe();
  }
  STORE.onChange(function(){ if(STORE.mode==='live') syncLinks(); });
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden) syncLinks();
  });

  if(location.hash==='#vpdebug'){
    (function(){
      var probe=function(u){
        var d=document.createElement('div');
        d.style.cssText='position:absolute;visibility:hidden;height:100'+u;
        document.body.appendChild(d);
        var v=Math.round(d.getBoundingClientRect().height); d.remove(); return v;
      };
      var mark=function(parent,color){
        var d=document.createElement('div');
        d.style.cssText='position:fixed;left:0;right:0;bottom:0;height:5px;background:'+color+';z-index:998';
        parent.appendChild(d);
      };
      mark(document.body,'red');                             /* browser fixed viewport */
      mark(document.getElementById('shell'),'lime');         /* shell bottom */
      var dbg=document.createElement('div');
      dbg.style.cssText='position:fixed;top:70px;left:8px;z-index:999;background:rgba(0,0,0,.82);'+
        'color:#7CFC00;font:12px/1.6 monospace;padding:10px 12px;border-radius:10px;white-space:pre';
      document.body.appendChild(dbg);
      function upd(){
        var vv=window.visualViewport;
        dbg.textContent=
          'innerH  '+window.innerHeight+
          '\nclientH '+document.documentElement.clientHeight+
          '\nvv.h    '+(vv?vv.height.toFixed(1):'n/a')+'  off '+(vv?vv.offsetTop:'-')+
          '\nsvh '+probe('svh')+'  dvh '+probe('dvh')+'  lvh '+probe('lvh')+
          '\nscreen  '+screen.height+'  avail '+screen.availHeight+
          '\nshellH  '+Math.round(document.getElementById('shell').getBoundingClientRect().height);
      }
      upd(); setInterval(upd,800);
    })();
  }

  window.addEventListener('scroll',function(){ if(!menu.hidden) closeMenu(); },true);
  window.addEventListener('resize',function(){ if(!menu.hidden) closeMenu(); });
  window.addEventListener('popstate',render);
  window.addEventListener('hashchange',render);
  if(!history.state) history.replaceState({d:0},'',location.hash||'#home');
  render();
})();
</script>

<script type="module">
/* =====================================================================
   FIREBASE  -  fill in apiKey and the WEB appId below.
   Your pasted appId ended in ":ios:" which the JS SDK cannot use.
   Firebase Console -> Project settings -> General -> Your apps
     -> Add app -> Web  ->  copy apiKey + appId from that config.
   ===================================================================== */
const FB_CONFIG = {
  apiKey:            "__FIREBASE_API_KEY__",               // substituted at build time
  authDomain:        "down2chill-cc664.firebaseapp.com",
  projectId:         "down2chill-cc664",
  storageBucket:     "down2chill-cc664.appspot.com",
  messagingSenderId: "202068437157",
  appId:             "__FIREBASE_APP_ID__"                 // substituted at build time
};

/* A placeholder is a non-empty string, so a plain truthiness test would treat
   an unsubstituted build as configured. These check for real values.        */
const KEY_OK = !!FB_CONFIG.apiKey && !FB_CONFIG.apiKey.startsWith("__");
const APP_OK = /:web:/.test(FB_CONFIG.appId || "");
const UNSUBBED = (v) => (v || "").startsWith("__");

const SDK = "https://www.gstatic.com/firebasejs/12.3.0/";
/* Namespacing - this bucket/database already hold other data, so everything
   this app writes lives under one prefix and nothing else is touched.
     Firestore : apps/down2chill/{events,people}/...
     Storage   : down2chill/events/{eventId}/photos/...  (event albums)
                 down2chill/chat/{eventId}/...           (chat pictures)   */
const FS_ROOT    = ["apps", "down2chill"];
const PHOTO_ROOT = "down2chill/events";
const COVER_ROOT = "down2chill/covers";
const CHAT_ROOT  = "down2chill/chat";

let fb = null;      // { app, db, storage, auth, uid, api:{...} }

/* ---------------- logging ---------------- */
function logEl(){ return document.getElementById("fb-log"); }
function log(msg, cls){
  const el = logEl(); if(!el) return;
  if(el.querySelector(".dim") && el.children.length === 1 && el.textContent === "Ready.") el.textContent = "";
  const line = document.createElement("div");
  if(cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}
function ok(m){ log("\u2713 " + m, "ok"); }
function err(m){ log("\u2717 " + m, "err"); }
function warn(m){ log("! " + m, "warn"); }
function dim(m){ log(m, "dim"); }

/* ---------------- init ---------------- */
async function initFirebase(){
  if(fb){
    /* a client whose first sign-in failed (Anonymous disabled, flaky mobile
       network) retries before every call - the rules require request.auth
       for all writes, so staying signed-out means "permission denied" */
    if(!fb.auth.currentUser){
      try { const c = await fb.au.signInAnonymously(fb.auth); fb.uid = c.user.uid; }
      catch(e){ authDown(); }
    }
    return fb;
  }
  if(!KEY_OK) throw new Error(UNSUBBED(FB_CONFIG.apiKey)
    ? "apiKey is still the build placeholder - Cloudflare did not substitute it."
    : "apiKey is blank - set FB_CONFIG.apiKey.");

  const [{ initializeApp }, fs, st, au] = await Promise.all([
    import(SDK + "firebase-app.js"),
    import(SDK + "firebase-firestore.js"),
    import(SDK + "firebase-storage.js"),
    import(SDK + "firebase-auth.js")
  ]);

  const app     = initializeApp(FB_CONFIG);
  const db      = fs.getFirestore(app);
  const storage = st.getStorage(app);
  const auth    = au.getAuth(app);

  // Sign-in is optional - it only matters when rules require request.auth.
  // Reuse whoever is already signed in (a phone-verified user survives
  // reloads) and only fall back to a fresh anonymous session.
  let uid = null;
  try {
    await new Promise(res => { const un = au.onAuthStateChanged(auth, () => { un(); res(); }); });
    const u = auth.currentUser || (await au.signInAnonymously(auth)).user;
    uid = u.uid;
    dim("signed in as " + (u.phoneNumber || "anon " + uid.slice(0, 10) + "\u2026"));
    /* cleared site data forgets verifiedPhone, but the phone user often
       survives - re-hydrate the flag instead of costing another SMS */
    if(u.phoneNumber && window.loadMe && window.normPhone){
      const m = loadMe();
      if(m.phone && normPhone(m.phone) === normPhone(u.phoneNumber) &&
         m.verifiedPhone !== normPhone(m.phone)){
        m.verifiedPhone = normPhone(m.phone);
        try{ localStorage.setItem("d2c.me.v1", JSON.stringify(m)); }catch(e){}
      }
    }
  } catch(e){
    warn("auth unavailable (" + e.code + ") - continuing unauthenticated");
  }
  if(!uid) authDown();

  fb = { app, db, storage, auth, au, uid, fs, st };
  return fb;
}
/* signed-out clients fail every write under the rules - say so loudly ONCE
   instead of letting each action die with a cryptic permission error */
function authDown(){
  if(window.__authWarned || typeof window.toast !== "function") return;
  window.__authWarned = true;
  toast("Saving is off - sign-in failed. In Firebase: Authentication → Sign-in method → enable Anonymous.",
        "err", 9000);
}

/* The seeder, connection panel, and read tests live in debug.html now - a
   standalone snapshot that can be deleted from production and dropped back
   in whenever something needs diagnosing. */
/* __DEBUG_REMOVED__ */
/* the signed-in visitor, shaped like the old hardcoded person */
function meIdent(){
  const m = window.loadMe ? loadMe() : { uid: "", name: "" };
  return { fsId: m.uid || "", name: m.name || "Guest", av: window.meAvatar ? meAvatar() : "" };
}

/* ---------------- 2. upload ---------------- */
/* Shared by the debug panel and the in-app "Add Photo" buttons. */
async function uploadPhoto(evId, file, say, noLog){
  say = say || dim;
  const { db, storage, fs, st } = await initFirebase();
  if(!evId) throw new Error("No event id - run step 1 first.");
  if(!file) throw new Error("Choose an image file first.");
  if(!/^image\//.test(file.type)) throw new Error("That file isn\u2019t an image.");
  if(file.size > 25 * 1024 * 1024)
    throw new Error("File is " + (file.size/1048576).toFixed(1) + " MB - the limit is 25 MB.");

  file = await downscale(file, 1600);
  const safe = (file.name || "photo.jpg").replace(/[^\w.\-]+/g, "_");
  const path = PHOTO_ROOT + "/" + evId + "/photos/" + Date.now() + "_" + safe;
  say("uploading " + (file.size / 1024).toFixed(0) + " KB to " + path);

  const ref  = st.ref(storage, path);
  await st.uploadBytes(ref, file, { contentType: file.type });
  const url  = await st.getDownloadURL(ref);

  const me = meIdent();
  const photoRef = fs.doc(fs.collection(db, ...FS_ROOT, "events", evId, "photos"));
  await fs.setDoc(photoRef, {
    path, url, thumbUrl: url, eventUid: evId,
    byUid: me.fsId || "", byName: me.name, byAvatarUrl: me.av,
    authUid: authUid(), whenLabel: "Just now",
    order: Date.now(), source: "upload", uploadedAt: fs.serverTimestamp()
  });
  await fs.updateDoc(fs.doc(db, ...FS_ROOT, "events", evId), { photoCount: fs.increment(1) });
  if(!noLog) logActivity(evId, "cam", "added a photo");
  return { url, path, id: photoRef.id };
}

/* in-app version: opens the OS file picker for a given event. Albums take
   SEVERAL photos at once (multi-select works on desktop and the iOS/Android
   photo pickers); chat reuses this same input one-at-a-time, so the multiple
   flag is set here and dropped again the moment a pick lands. */
function pickPhoto(eventId){
  if(STORE.mode !== "live"){
    toast("Connect Firebase to add photos.", "err");
    return;
  }
  const input = document.getElementById("photo-input");
  input.value = "";
  input.multiple = true;
  input.onchange = async () => {
    input.multiple = false;
    let files = Array.from(input.files || []).filter(f => /^image\//.test(f.type));
    if(!files.length) return;
    if(files.length > 10){
      files = files.slice(0, 10);
      toast("Uploading the first 10 - add the rest in another batch.", "", 4500);
    }
    let okN = 0, failN = 0, lastErr = "";
    for(let i = 0; i < files.length; i++){
      toast(files.length === 1 ? "Uploading photo\u2026"
            : "Uploading " + (i + 1) + " of " + files.length + "\u2026", "wait", 0);
      try { await uploadPhoto(eventId, files[i], () => {}, true); okN++; }
      catch(e){
        failN++;
        lastErr = e.code === "storage/unauthorized"
          ? "permission refused - reload once and retry" : (e.message || "");
      }
    }
    /* one activity line for the whole batch instead of one per photo */
    if(okN) logActivity(eventId, "cam", okN === 1 ? "added a photo" : "added " + okN + " photos");
    if(failN) toast(okN + " added, " + failN + " failed" + (lastErr ? " - " + lastErr : ""), "err", 5200);
    else toast(okN === 1 ? "Photo added" : okN + " photos added");   // the live listener repaints the grid
  };
  input.click();
}

/* ---------------- 4. create an event ---------------- */
/* Phone cameras hand us 5-12 MB originals; nothing here needs more than
   ~1600px. Falls back to the untouched file on any decode hiccup. */
async function downscale(file, max){
  try {
    if(!/^image\//.test(file.type) || /gif$/i.test(file.type) || file.size < 900 * 1024) return file;
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, (max || 1600) / Math.max(bmp.width, bmp.height));
    if(k === 1) return file;
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    if(!blob) return file;
    blob.name = file.name;
    return blob;
  } catch(e){ return file; }
}
/* the writer's auth uid - rules use it to tie rows to their author */
function authUid(){ return (fb && fb.auth.currentUser && fb.auth.currentUser.uid) || ""; }

/* Cover photos live beside the event photos but in their own prefix, so a
   cover picked before the event exists still has somewhere to go.          */
async function uploadCover(file, onProgress){
  const { storage, st } = await initFirebase();
  if(!file) throw new Error("Choose an image first.");
  if(!/^image\//.test(file.type)) throw new Error("That file isn\u2019t an image.");
  if(file.size > 25 * 1024 * 1024)
    throw new Error("File is " + (file.size/1048576).toFixed(1) + " MB - the limit is 25 MB.");
  file = await downscale(file, 1600);

  const safe = (file.name || "cover.jpg").replace(/[^\w.\-]+/g, "_");
  const path = COVER_ROOT + "/" + Date.now() + "_" + safe;
  const ref  = st.ref(storage, path);

  if(st.uploadBytesResumable){
    await new Promise((resolve, reject) => {
      const task = st.uploadBytesResumable(ref, file, { contentType: file.type });
      task.on("state_changed",
        s => { if(onProgress && s.totalBytes) onProgress(s.bytesTransferred / s.totalBytes); },
        reject, resolve);
    });
  } else {
    await st.uploadBytes(ref, file, { contentType: file.type });
  }
  const url = await st.getDownloadURL(ref);
  dim("cover uploaded to " + path);
  return { url, path };
}

/* Writes the event document plus the host's own guest row and the opening
   activity entry. The events listener picks it up and the new card appears
   on Home by itself.                                                       */
async function createEvent(draft){
  const { db, fs } = await initFirebase();
  const me    = meIdent();
  const evRef = fs.doc(fs.collection(db, ...FS_ROOT, "events"));
  const data  = draftDoc(draft, evRef.id, me.fsId || "");
  data.createdAt = fs.serverTimestamp();
  /* the security rules key host powers off these two - the creator's auth
     uid now, and their proven number once (or if already) verified. Never
     stamp an empty uid: rules read absent as legacy-open, present as locked,
     so an "" stamp would lock the host out of their own event for good. */
  const hu = authUid();
  if(hu) data.hostAuthUid = hu;
  data.hostPhone   = (fb.auth.currentUser && fb.auth.currentUser.phoneNumber) || "";

  await fs.setDoc(evRef, data);
  await fs.setDoc(fs.doc(fs.collection(evRef, "guests")), {
    uid: me.fsId || "", name: me.name, avatarUrl: me.av, message: "",
    invitedLabel: "Just now", isHost: true, isYou: true, status: "going",
    authUid: authUid(),
    order: Date.now(), source: "created"
  });
  /* everyone picked on step 4 starts as a pending guest */
  const invited = invitedList(draft);
  await Promise.all(invited.map((g, i) =>
    fs.setDoc(fs.doc(fs.collection(evRef, "guests")), {
      uid: g.uid, name: g.name, avatarUrl: g.avatarUrl, phone: g.phone, message: "",
      invitedLabel: "Just now", isHost: false, isYou: false, status: "pending",
      order: Date.now() + i + 1, source: g.source
    })));
  await fs.setDoc(fs.doc(fs.collection(evRef, "activity")), {
    personName: me.name, personAvatarUrl: me.av, icon: "check", isCheck: true,
    text: "created this event", whenLabel: "Just now",
    at: new Date().toISOString(),
    order: Date.now(), source: "created"
  });
  ok("event created: " + FS_ROOT.join("/") + "/events/" + evRef.id +
     " with " + invited.length + " invited");
  return evRef.id;
}

/* ---------------- content moderation ----------------
   Rules let the photo's author or the event host delete; chat lives on the
   event doc, whose chatMessages field every signed-in client may rewrite. */
async function deletePhoto(eventId, photoId, path){
  const { db, fs } = await initFirebase();
  await fs.deleteDoc(fs.doc(db, ...FS_ROOT, "events", eventId, "photos", photoId));
  await fs.updateDoc(fs.doc(db, ...FS_ROOT, "events", eventId),
    { photoCount: fs.increment(-1) }).catch(() => {});
  if(path) deleteFile(path);
  logActivity(eventId, "x", "removed a photo");
}
function msgIndex(arr, m){
  for(let i = arr.length - 1; i >= 0; i--){
    const c = arr[i];
    if((m.ms && c.ms === m.ms) ||
       (!m.ms && c.at === m.at && (c.fromUid || "") === m.fromUid &&
        (c.text || "") === m.text && (c.imageUrl || "") === m.imageUrl)) return i;
  }
  return -1;
}
async function deleteMessage(eventId, m){
  const { db, fs } = await initFirebase();
  const evRef = fs.doc(db, ...FS_ROOT, "events", eventId);
  const snap = await fs.getDoc(evRef);
  const arr = (snap.data() || {}).chatMessages || [];
  const hit = msgIndex(arr, m);
  if(hit < 0) throw new Error("That message is already gone.");
  const dead = arr[hit];
  arr.splice(hit, 1);
  await fs.updateDoc(evRef, { chatMessages: arr });
  if(dead.imagePath) deleteFile(dead.imagePath);
}
async function editMessage(eventId, m, text){
  const { db, fs } = await initFirebase();
  const evRef = fs.doc(db, ...FS_ROOT, "events", eventId);
  const snap = await fs.getDoc(evRef);
  const arr = (snap.data() || {}).chatMessages || [];
  const hit = msgIndex(arr, m);
  if(hit < 0) throw new Error("That message is already gone.");
  arr[hit] = Object.assign({}, arr[hit], { text: text, edited: true });
  await fs.updateDoc(evRef, { chatMessages: arr });
}
