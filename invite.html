<script>
/* =====================================================================
   STORE - the single source the views render from.

   Every view reads STORE.events. Those objects are shaped exactly like a
   Firestore event document, so the same rendering code serves both modes:

     mode 'live'   onSnapshot streams docs straight in
     mode 'local'  the hardcoded SEED array is mapped into the same shape,

/* ================= WHO IS LOOKING AT THIS =================
   Every visitor gets a random uid the first time the page loads, kept in
   localStorage so a returning visitor is the same person. The profile

   several uids together into one account. The registry keeps every profile

    try{ localStorage.setItem(ME_KEY, JSON.stringify(ME)); }catch(e){}
  }
  if(!Array.isArray(ME.events)) ME.events = [];
  if(!Array.isArray(ME.linked)) ME.linked = [];
  if(!Array.isArray(ME.cloudLinked)) ME.cloudLinked = [];
  if(!Array.isArray(ME.linkRejects)) ME.linkRejects = [];
  /* pre-chooser profiles linked every match - carry those over as accepted */
  if(!Array.isArray(ME.linkOks)){
    ME.linkOks = [];
    ME.linked.concat(ME.cloudLinked.map(function(p){ return p.uid; }))
      .forEach(function(u){ if(ME.linkOks.indexOf(u) < 0) ME.linkOks.push(u); });
  }
  if(!ME.claims || typeof ME.claims !== 'object') ME.claims = {};
  /* which curated guest ROW each claim took - lets two people who share a
     full name hold separate spots on the same event */
  if(!ME.claimRow || typeof ME.claimRow !== 'object') ME.claimRow = {};
  if(!ME.rsvp || typeof ME.rsvp !== 'object') ME.rsvp = {};
  if(typeof ME.verifiedPhone !== 'string') ME.verifiedPhone = '';
  if(typeof ME.verifiedAt !== 'number') ME.verifiedAt = 0;
  if(typeof ME.verifyDeclined !== 'string') ME.verifyDeclined = '';

function ago(isoTs){
  var t = Date.parse(isoTs);
  if(isNaN(t)) return "";
  var m = Math.round((Date.now() - t) / 60000);
  if(m < 1)    return "Just now";
  if(m < 60)   return m + " min ago";
  var hh = Math.round(m / 60);
  if(hh < 24)  return hh + (hh === 1 ? " hour ago" : " hours ago");
  var dd = Math.round(hh / 24);
  if(dd === 1) return "Yesterday";
  if(dd < 7)   return dd + " days ago";

function actText(ev, a){
  if(a.icon !== 'chat' && a.icon !== 'cam') return a.text;
  var msgs = ev.messages || [], mi = -1, i;
  if(a.ms){
    for(i = 0; i < msgs.length; i++) if(msgs[i].ms === a.ms){ mi = i; break; }
  } else if(a.icon === 'chat'){
    /* pre-stamp entries: match the quoted text (the quote may be truncated) */
    var q = String(a.text || '').replace(/^“/, '').replace(/”$/, ''),
        pre = q.slice(-1) === '…' ? q.slice(0, -1) : null;
    for(i = 0; i < msgs.length; i++){
      var tx = msgs[i].text || '';
      if(tx === q || (pre && tx.indexOf(pre) === 0)){ mi = i; break; }
    }
  } else return a.text;      /* old photo-in-chat entries carry no handle */
  if(mi < 0) return 'deleted a message';
  if(msgs[mi].edited) return 'edited a message';
  return a.text;
}

function useLocalData(reason){
  STORE.error = reason || null;
  STORE.setEvents(SEED_EVENTS.map(seedToModel), "local");
}

/* ---------- queries over whatever is loaded ---------- */
function matches(ev, q){
  if(!q) return true;
  return ev.title.toLowerCase().indexOf(q.trim().toLowerCase()) > -1;
}
/* ---------- events hidden on this device ----------
   "Hide" is personal: nothing is written to the event, the ids just sit in
   localStorage and every list filters them out. Reversible from the list. */
var HIDDEN_KEY = 'd2c.hidden.v1', HIDDEN = null;
function hiddenSet(){
  if(HIDDEN) return HIDDEN;
  HIDDEN = {};
  try{
    var raw = JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]');
    if(raw && raw.length) raw.forEach(function(id){ HIDDEN[id] = 1; });
  }catch(e){}
  return HIDDEN;
}
function saveHidden(){
  var out = [], k;
  for(k in HIDDEN) if(HIDDEN[k]) out.push(k);
  try{ localStorage.setItem(HIDDEN_KEY, JSON.stringify(out)); }catch(e){}
}
function isHidden(ev){ var x = hiddenSet(); return !!(x[ev.id] || (ev.slug && x[ev.slug])); }
function hideId(ev){ hiddenSet()[ev.id] = 1; if(ev.slug) HIDDEN[ev.slug] = 1; saveHidden(); }
function unhideAll(){ HIDDEN = {}; saveHidden(); }
function hiddenCount(){
  return STORE.events.filter(isHidden).length;
}
function shown(list){ return list.filter(function(e){ return !isHidden(e); }); }

/* ---------- chat read tracking ----------
   Per-viewer, per-event count of messages already seen; the unread badge is
   whatever arrived past that mark. Stored locally - "read" is in the eye of
   the viewer, never on the shared event. */
var SEEN_KEY = 'd2c.seen.v1', SEEN = null;
function seenMap(){
  if(SEEN) return SEEN;
  try{ SEEN = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}') || {}; }catch(e){ SEEN = {}; }
  return SEEN;
}
function markSeen(id, n){
  if(seenMap()[id] === n) return;
  SEEN[id] = n;
  try{ localStorage.setItem(SEEN_KEY, JSON.stringify(SEEN)); }catch(e){}
}
function unseenCount(ev){
  return Math.max(0, (ev.messages || []).length - (seenMap()[ev.id] || 0));
}

/* An event is on your page only if you host it or one of your linked uids
   opened it by direct link (any RSVP counts - a "can't go" stays visible so
   you can change your mind). Everything else stays invisible. */
function inMyList(ev){
  if(isBanned(ev)) return false;
  if(ev.role === 'hosting') return true;
  /* a public event you never answered is not part of your history - once
     it has passed, it only lingers for people who chose going/maybe/no */
  if(joinMode(ev) === 'public' && ev.dateISO < TODAY && !myRsvp(ev.id)) return false;
  var ids = myEvents();
  return ids.indexOf(ev.id) > -1 || (ev.slug && ids.indexOf(ev.slug) > -1);
}
function mineOnly(list){ remapRoles(); return shown(list.filter(inMyList)); }

function eventsOn(iso, q){
  return mineOnly(STORE.events.filter(function(e){ return e.dateISO === iso && matches(e, q); }));
}
function upcoming(){ return mineOnly(STORE.events.filter(function(e){ return e.dateISO >= TODAY; })); }
function past(){ return mineOnly(STORE.events.filter(function(e){ return e.dateISO < TODAY; }))
  .slice().reverse(); }
function hosting(){ return mineOnly(STORE.events.filter(function(e){ return e.role === "hosting"; })); }
/* public events for anyone visiting the site - the Discover rail */
function discover(q){
  return shown(STORE.events.filter(function(e){
    return joinMode(e) === 'public' && e.dateISO >= TODAY && !isBanned(e) &&
           !inMyList(e) && matches(e, q);
  }));
}

<script>
/* ================= tiny helpers ================= */
function h(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function ico(id,cls){ return '<svg class="i'+(cls?' '+cls:'')+'"><use href="#'+id+'"/></svg>'; }
function img(url,alt,cls){ return '<img'+(cls?' class="'+cls+'"':'')+' src="'+h(url||'')+'" alt="'+
  h(alt||'')+'" loading="lazy" decoding="async">'; }
function fname(n){ return nfl(n); }
/* subpages (chat, guests, photos): the host sees every guest in full - they need to tell

function evName(ev,name,uid){
  if(ev && ev.role==='hosting') return String(name||'');
  var host = !!ev && ((uid && ev.hostUid && uid===ev.hostUid) || (!!name && name===ev.hostName));
  return host ? String(name||'') : nfl(name); }
var _toastT=null;
function toast(msg,kind,ms){

  el.innerHTML=(kind==='wait'?'<span class="spin"></span>':'')+h(msg);
  el.hidden=false;
  if(ms!==0) _toastT=setTimeout(function(){ el.hidden=true; }, ms||2600);
}
function absUrl(hash){ return location.origin + location.pathname + '#' + hash; }
/* address alone - a "Venue, address" query can miss when the place name

function mapsUrl(ev){

}

/* one wordmark, used by the home header and by every subpage's back row */
function brandMark(){ return '<span class="logo">DOWN<i>2</i>CHILL<b>\u2726</b></span>'; }
function infoBtn(mini){

}
/* dot + label: green verified, amber parked-for-later, gray this device */
function dotState(){

/* the web is only the scheduled half of Down2Chill - each surface carries one

function appCard(kind, host){

  var tb = kind==='invite' ? [h(fn)+' might be free right now',
             'This event was planned ahead. In the app, '+h(fn)+' - and anyone who knows you - '+
             'can invite you the moment they’re free. Those invites never reach the web.']

     : kind==='sheet' ? ['This is only half of Down2Chill',
             'Scheduled events live on the web. The app adds right-now invites from friends who '+
             'are free at this moment - and fills in your contacts when you host.']
     : ['Down2Chill is better live',
             'This page only shows scheduled plans. Right-now invites - friends who are free at '+
             'this moment - only happen in the app.'];
  return '<a class="appcard" href="https://down2chill.com/get" target="_blank" rel="noopener">'+
    '<span class="apic">'+ico('bolt')+'</span>'+
    '<span class="aptx"><b>'+tb[0]+'</b><span>'+tb[1]+'</span></span>'+
    '<span class="apcta">Get the app</span>'+
  '</a>';
}
/* the "how it works" sheet - state-aware, one screen, no jargon */
function infoCard(){
  var m = loadMe(), st = authState(), fn = fname(m.name||''), live = smsLive();
  var tel = live ? toE164(m.phone) : m.phone;
  var n = phoneVerified() ? linkedProfiles().length : 0;
  var pend = st!=='verified' && verifyPending();
  var stTitle = st==='verified' ? 'You’re '+h(fn)+' · verified'
              : pend && fn      ? 'You’re '+h(fn)+' · verification paused'
              : st==='named'    ? 'You’re '+h(fn)+' · this device only'
              :                   'You’re a guest right now';
  var stSub = st==='verified'
      ? 'Every device that verifies '+h(tel)+' shares this account'+
        (n?' · linked to '+n+' other'+(n===1?'':'s'):'')+'.'
      : pend
      ? 'Texting is down on our side - your number is saved, and everything keeps working meanwhile.'
      : st==='named'
      ? 'Your name and RSVPs live in this browser until you verify your number.'
      : 'This device got its own private account the moment you opened the page. No sign-up needed.';
  var cta = '';
  if(normPhone(m.phone) && !phoneVerified() && live)
    cta = '<button class="modal-cta" type="button" data-info-verify>Verify my number</button>';
  else if(!normPhone(m.phone) || !m.name)
    cta = '<button class="modal-cta" type="button" data-info-profile>Set up my profile</button>';
  return '<div class="modal-card claim info">'+
    '<button class="modal-x" type="button" data-modal-close aria-label="Close">'+ico('x')+'</button>'+
    '<div class="modal-ic">'+ico('help')+'</div>'+
    '<h3 id="modal-h">How events work</h3>'+
    '<div class="ist'+(st==='verified'?' ok':pend?' pend':'')+'"><span class="idot"></span>'+
      '<span class="istx"><b>'+stTitle+'</b><span>'+stSub+'</span></span></div>'+
    '<ul class="ilist">'+
      '<li>No passwords here. RSVP, chat, and add photos right away - everything saves to this device automatically.</li>'+
      '<li>Put a name and photo on your profile so friends recognize you.</li>'+
      '<li>Verify your number once (we text a code) and every device you verify it on becomes one account - your events follow you.</li>'+
      '<li>Not verifying is fine too - things just stay on this device.</li>'+
    '</ul>'+
    '<p class="onote center">'+(location.hash.indexOf('#profile')===0
      ? 'The dot on the profile button on every other page: green = verified, '
      : 'The dot on your profile picture up top: green = verified, ')+
      (pend?'amber = confirming later, ':'')+'gray = this device only.</p>'+
    appCard('sheet')+
    cta+
    '<button class="'+(cta?'modal-later':'modal-cta')+'" type="button" data-modal-close>Got it</button>'+
    '<p class="onote center"><button class="linky" type="button" id="ppOpen">Privacy &amp; data choices</button></p>'+
  '</div>';
}

function statusPill(ev){
  if(ev.dateISO<TODAY) return '<span class="pill went">'+(ev.role==='hosting'?'Hosted':'Went')+'</span>';
  if(ev.role==='hosting') return '<span class="pill host">Hosting</span>';
  var r=myRsvp(ev.id);
  if(r==='going') return '<span class="pill host">Going</span>';
  if(r==='maybe') return '<span class="pill inv">Maybe</span>';
  if(r==='cant')  return '<span class="pill went">Can\u2019t go</span>';
  if(joinMode(ev)==='public' && !inMyList(ev)) return '<span class="pill inv">Public</span>';
  return '<span class="pill inv">Invited</span>';
}

/* ================= HOME ================= */
function eventCard(ev){
  var dp=dparts(ev.dateISO);
  return '<a class="ecard" href="#event/'+ev.id+'" data-nav>'+
    img(ev.thumbUrl||DEF_COVER, ev.title, 'thumb')+
    '<span class="emore" data-evmenu="'+ev.id+'" role="button" tabindex="0" aria-haspopup="true" '+
      'aria-expanded="false" aria-label="Options for '+h(ev.title)+'">'+ico('more')+'</span>'+
    '<div class="ebody">'+
      '<div class="etop">'+
        '<div class="einfo">'+
          '<h3>'+h(ev.title)+'</h3>'+
          '<div class="eloc">'+ico('pin')+'<span>'+h(ev.venue)+'</span></div>'+
          '<div class="ewhen"><span>'+dp.dowShort+', '+dp.monShort+' '+dp.day+' \u00B7 '+h(ev.time)+'</span></div>'+
        '</div>'+
        '<div class="edate"><b>'+dp.day+'</b><span>'+dp.monUp+'</span></div>'+
      '</div>'+
      '<div class="ehost">'+img(ev.hostAvatarUrl,'')+
        '<p><span class="hb">Hosted by </span><b>'+h(fname(ev.hostName))+'</b> \u00B7 '+goingTotal(ev)+' going</p>'+
        statusPill(ev)+
      '</div>'+
    '</div></a>';
}

function groupByMonth(list){
  var out=[],last=null;
  list.forEach(function(ev){
    var dp=dparts(ev.dateISO);
    if(dp.monKey!==last){ out.push({month:dp.mon+(dp.year!==dparts(TODAY).year?' '+dp.year:'')}); last=dp.monKey; }
    out.push({ev:ev});
  });
  return out;
}

function dataBanner(){
  if(STORE.mode==='live') return '';
  return '<div class="banner">'+ico('globe')+'<span>'+
    (STORE.error ? h(STORE.error) : 'Showing bundled sample data - Firebase not connected.')+
    '</span></div>';
}

function draftCard(d){
  var dp=dparts(d.date);
  return '<div class="ecard draftc" data-draft="'+h(d.draftId)+'" role="button" tabindex="0">'+
    (d.coverUrl ? img(d.coverUrl,'','thumb')
                : '<span class="thumb dthumb">'+ico('pen')+'</span>')+
    '<button class="emore ddel" type="button" data-draftdel="'+h(d.draftId)+'" aria-label="Delete draft">'+
      ico('trash')+'</button>'+
    '<div class="ebody"><div class="etop"><div class="einfo">'+
      '<h3>'+h(d.title||'Untitled event')+'</h3>'+
      (d.venue?'<div class="eloc">'+ico('pin')+'<span>'+h(d.venue)+'</span></div>':'')+
      '<div class="ewhen"><span>'+dp.dowShort+', '+dp.monShort+' '+dp.day+' \u00B7 '+h(d.time)+'</span></div>'+
    '</div>'+
    '<div class="edate"><b>'+dp.day+'</b><span>'+dp.monUp+'</span></div></div>'+
    '<div class="ehost"><p>Not sent to anyone yet - tap to keep editing</p>'+
      '<span class="pill draft">Draft</span></div>'+
  '</div></div>';
}
var DISC_OPEN=false;   /* Discover rail folded to 3 until expanded */
function homeList(tab,q){
  var list = (tab==='hosting'?hosting() : tab==='past'?past() : upcoming())
              .filter(function(e){ return matches(e,q); });
  var hid = hiddenCount(),
      foot = hid ? '<p class="hid-note">'+hid+(hid===1?' event hidden':' events hidden')+
                   ' \u00B7 <button type="button" data-unhide>Show all</button></p>' : '';
  var dr='';
  if(tab==='hosting'){
    var ds=eventDrafts().filter(function(x){
      return !q || (x.title||'').toLowerCase().indexOf(q.trim().toLowerCase())>-1; });
    if(ds.length) dr='<h3 class="mon-h">Drafts</h3><div class="ecards">'+
      ds.map(draftCard).join('')+'</div>';
  }
  /* public events surface for everyone, below whatever is theirs -
     three at first, the rest behind the expand button */
  var disc='';
  if(tab==='upcoming'){
    var pub=discover(q);
    if(pub.length){
      var pshow=DISC_OPEN?pub:pub.slice(0,3);
      disc='<h3 class="mon-h">Discover</h3><div class="ecards">'+
        pshow.map(eventCard).join('')+'</div>'+
        (pub.length>3
          ? '<button class="disc-more" type="button" data-discmore aria-expanded="'+DISC_OPEN+'">'+
            (DISC_OPEN
              ? 'Show less'+ico('chevu')
              : 'Show all ('+pub.length+')<svg class="i" style="transform:rotate(180deg)"><use href="#chevu"/></svg>')+
            '</button>'
          : '');
    }
  }
  if(!list.length){
    if(dr) return dr + disc + foot;
    return (q && !disc ? '<p class="no-hit">No events match <b>\u201C'+h(q)+'\u201D</b>.</p>'
         : q ? disc
         : '<p class="empty">Nothing here yet. Open an event link someone sent you and it\u2019ll appear on this page.</p>' + disc) + foot;
  }
  var body='',open=false;
  groupByMonth(list).forEach(function(row){
    if(row.month){ if(open) body+='</div>'; body+='<h3 class="mon-h">'+h(row.month)+'</h3><div class="ecards">'; open=true; }
    else body+=eventCard(row.ev);
  });
  if(open) body+='</div>';
  return dr + body + disc + foot;
}

function renderHome(tab,q,open){
  tab=tab||'upcoming';
  open = !!open || !!q;
  var heading = tab==='hosting'?'Hosting' : tab==='past'?'Past' : 'Upcoming';
  return '<div class="sky"><div class="wrap">'+
      '<div class="brand"><a class="icon-btn" href="https://down2chill.com" aria-label="Back to down2chill.com">'+ico('back')+'</a>'+
        brandMark()+'</div>'+
      '<div class="page-h"><h1>Events</h1><div class="btns">'+
        infoBtn()+
        '<button class="round-btn'+(open?' on':'')+'" type="button" data-focus-search '+

        /* filters is parked for now - unhide when it does something */
        '<button class="round-btn" type="button" aria-label="Filters" style="display:none">'+ico('sliders')+'</button>'+

        ['upcoming','hosting','past'].map(function(t){
          return '<button role="tab" type="button" data-tab="'+t+'" aria-selected="'+(t===tab)+'">'+
            t.charAt(0).toUpperCase()+t.slice(1)+'</button>';
        }).join('')+
      '</div>'+
      '<div class="searchbar home-search'+(open?' open':'')+'">'+ico('search')+

        '<span class="filt">'+ico('sliders')+'</span></div>'+
    '</div></div>'+
    '<div class="wrap">'+dataBanner()+'<h2 class="list-h">'+heading+'</h2>'+

/* the hosting tab talks to creators, the rest to invitees */
function homeTabRole(tab){ return tab==='hosting' ? 'host' : 'list'; }

/* ================= CALENDAR ================= */
var calState={ y:2021, m:6, sel:TODAY, mode:'month', q:'', open:1 };
/* live data runs on the real clock - the mock date only serves the bundled
   sample set. Called once, just before the first live paint. */
function goLiveClock(){
  TODAY = isoOf(new Date());
  var d = parse(TODAY);
  calState.y = d.getFullYear(); calState.m = d.getMonth(); calState.sel = TODAY;
}

function calCell(iso,out,q,maxLab){
  var evs=out?[]:eventsOn(iso,q), sel=(!out && iso===calState.sel), d=parse(iso);
  return '<button type="button" class="cal-c'+(out?' out':'')+(sel?' sel':'')+'" data-day="'+iso+'"'+
    (out?' tabindex="-1"':' aria-label="'+d.getDate()+' '+MON[d.getMonth()]+', '+evs.length+' events"')+'>'+
    '<span class="d">'+d.getDate()+'</span>'+
    '<span class="dots-row">'+evs.slice(0,3).map(function(e){
      return '<i style="background:'+e.dot+'"></i>'; }).join('')+'</span>'+
    evs.slice(0,maxLab).map(function(e){
      return '<span class="ev-lab"><i style="background:'+e.dot+'"></i>'+h(e.title)+'</span>'; }).join('')+
    '</button>';
}

function calBody(){
  var q=calState.q, cells='', label='', i;
  if(calState.mode==='week'){
    var ws=weekStart(calState.sel), we=addDays(ws,6);
    var a=dparts(ws), b=dparts(we);
    label = a.monShort+' '+a.day+' - '+(a.mon===b.mon? b.day : b.monShort+' '+b.day)+', '+b.year;
    for(i=0;i<7;i++) cells+=calCell(addDays(ws,i),false,q,3);
  } else {
    var y=calState.y, m=calState.m,
        firstDow=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate(),
        total=Math.ceil((firstDow+dim)/7)*7;
    label = MON[m]+' '+y;
    for(i=0;i<total;i++){
      var dn=i-firstDow+1, d=new Date(y,m,dn);
      cells+=calCell(isoOf(d), dn<1||dn>dim, q, 2);
    }
  }

  var dp=dparts(calState.sel), dayEvs=eventsOn(calState.sel,q);
  var rows = dayEvs.length ? dayEvs.map(function(ev){
    var stack=ev.guestPreview.slice(0,3).map(function(g){ return img(g.avatarUrl,''); }).join('');
    var extra=Math.max(0, goingTotal(ev)-3);
    return '<a class="drow" href="#event/'+ev.id+'" data-nav>'+
      img(ev.thumbUrl||DEF_COVER,'')+
      '<div class="dinfo">'+
        '<div class="dtime"><i style="background:'+ev.dot+'"></i>'+h(ev.time)+'</div>'+
        '<h4>'+h(ev.title)+'</h4>'+
        '<div class="eloc">'+ico('pin')+'<span>'+h(ev.venue)+'</span></div>'+
      '</div>'+
      '<span class="stack">'+stack+(extra?'<em>+'+extra+'</em>':'')+'</span>'+
      statusPill(ev)+
    '</a>';
  }).join('')
   : (q ? '<p class="no-hit">No events match <b>\u201C'+h(q)+'\u201D</b> on this day.</p>'
        : '<p class="empty">No events on this day.</p>');

  return '<div class="cal">'+
      '<div class="cal-h">'+
        '<button class="cal-nav" type="button" data-step="-1" aria-label="Previous">'+ico('chevl')+'</button>'+
        '<b>'+label+'</b>'+
        '<button class="cal-nav" type="button" data-step="1" aria-label="Next">'+ico('chev')+'</button>'+
      '</div>'+
      '<div class="cal-dow'+(calState.mode==='week'?' week':'')+'">'+
        ['SUN','MON','TUE','WED','THU','FRI','SAT'].map(function(d){ return '<span>'+d+'</span>'; }).join('')+'</div>'+
      '<div class="cal-grid'+(calState.mode==='week'?' week':'')+'">'+cells+'</div>'+
    '</div>'+

/* ================= GUESTS ================= */
var guestsOpen = {}, ACT_OPEN = {};

/* The four lists a guests page shows. Names are the join key: when someone
   claims a curated invite and answers, their own row replaces the host-typed
   pending row instead of sitting next to it.                                */
function guestBuckets(ev){
  var m = loadMe(), my = myRsvp(ev.id), myName = m.name || m.claims[ev.id] || '';
  var b = { going: (ev.guests || []).slice(), maybe: (ev.maybes || []).slice(),
            cant: (ev.cants || []).slice(), waiting: (ev.waiting || []).slice() };
  var mine = function(g){
    return (myName && g.name.toLowerCase() === myName.toLowerCase()) || g.isYou;
  };
  /* local mode: my claim / answer only lives on this device, so fold it in.
     Live mode streams my own guests/{uid} doc, so only mark it as me. */
  if(STORE.mode === 'live'){
    var uids = myUids(),
        myRow = m.claimRow[ev.id] || (ev.slug && m.claimRow[ev.slug]) || '';
    /* visitor rows with no claimOf are pre-claimRow claims: only for those
       does a same-named typed row still fold in by name */
    var legacyByName = {};
    ['going','maybe','cant','waiting'].forEach(function(k){
      b[k].forEach(function(g){
        if(g.uid && !g.claimOf && g.name) legacyByName[k + ':' + g.name.toLowerCase()] = 1;
      });
    });
    ['going','maybe','cant','waiting'].forEach(function(k){
      var seen = {};
      b[k] = b[k].filter(function(g){
        /* per-viewer - never trust a stored isYou flag. Name matching is a
           last resort: two guests may share a full name, so it only marks
           the host-typed (uid-less) row and only while I claimed no row. */
        g.isYou = (!!g.uid && uids.indexOf(g.uid) > -1) ||
                  (!!myRow && (g.claimOf === myRow || g.docId === myRow)) ||
                  (!myRow && !g.uid && !!myName &&
                   g.name.toLowerCase() === myName.toLowerCase());
        /* fold key: rows that answer for the same claimed SPOT share it, my
           linked uids count as one person, and only claim-less legacy rows
           still share the bare name - so two people with the same full name
           keep separate rows once their rows carry claimOf */
        var key = g.claimOf ? 'c:' + g.claimOf
                : g.uid ? (uids.indexOf(g.uid) > -1 ? 'me' : 'n:' + g.name.toLowerCase())
                : (g.docId && !legacyByName[k + ':' + g.name.toLowerCase()])
                  ? 'c:' + g.docId
                  : 'n:' + g.name.toLowerCase();
        var first = seen[key];
        if(!first){ seen[key] = g; return true; }
        /* the same spot twice (the host's typed row + its claimer's own
           uid-keyed rsvp/plus doc) folds into one row */
        if(g.isHost) first.isHost = true;
        if(g.isYou) first.isYou = true;
        if(g.plus) first.plus = g.plus;
        if(!first.avatarUrl) first.avatarUrl = g.avatarUrl;
        if(!first.message) first.message = g.message;
        return false;
      });
    });
  } else if(myName && ev.role !== 'hosting' && canJoin(ev)){
    /* canJoin keeps un-approved requesters out of every list - a request
       shows nowhere until the host approves it */
    ['going','maybe','cant','waiting'].forEach(function(k){
      b[k] = b[k].filter(function(g){ return !mine(g); });
    });
    var meRow = { name: myName, avatarUrl: meAvatar(), message: '',
                  invitedLabel: my ? 'Responded' : 'Viewing this event',
                  isHost: false, isYou: true, status: my || 'pending',
                  plus: myPlus(ev.id) };
    /* you always see yourself first in your section */
    if(my === 'going') b.going.unshift(meRow);
    else if(my === 'maybe') b.maybe.unshift(meRow);
    else if(my === 'cant') b.cant.unshift(meRow);
    else if(m.claims[ev.id] || myEvents().indexOf(ev.id) > -1) b.waiting.unshift(meRow);
  }
  /* whoever answered no longer waits: their claimed spot leaves the pending
     list (row-keyed); answers with no claim info fall back to the old name
     rule so pre-claimRow claims keep collapsing */
  var respondedRow = {}, respondedName = {};
  b.going.concat(b.maybe).concat(b.cant).forEach(function(g){
    if(g.claimOf) respondedRow[g.claimOf] = 1;
    else respondedName[g.name.toLowerCase()] = 1;
    if(g.docId) respondedRow[g.docId] = 1;
  });
  b.waiting = b.waiting.filter(function(g){
    if(g.docId && respondedRow[g.docId]) return false;
    return !(g.claimOf ? respondedRow[g.claimOf]
                       : respondedName[g.name.toLowerCase()]);
  });
  /* my own +1 renders even before (or without) the cloud write landing */
  ['going','maybe','cant'].forEach(function(k){
    b[k].forEach(function(g){ if(g.isYou && !g.plus) g.plus = myPlus(ev.id); });
  });
  return b;
}
/* extras (+1s) brought by people who are officially going - the same rows the
   guests page tags "+N". Before the guest stream lands there's nothing to sum. */
function goingPlus(ev, b){
  if(!b){
    if(ev.guests == null) return +((ev.counts || {}).plus) || 0;
    b = guestBuckets(ev);
  }
  return b.going.reduce(function(s, g){ return s + (+g.plus || 0); }, 0);
}
/* headcount: everyone going plus everyone they bring */
function goingTotal(ev, b){ return (((ev.counts || {}).going) || 0) + goingPlus(ev, b); }
function renderGuests(id){
  var ev=findEvent(id); if(!ev) return renderHome();
  var b=ev.guests?guestBuckets(ev):null;
  var c=b?{going:b.going.length, maybe:b.maybe.length, cant:b.cant.length, pending:b.waiting.length}
       :ev.counts;
  var responses=c.going+c.maybe+c.cant, invites=responses+c.pending;
  var pct=invites?Math.round(responses/invites*100):0;

  /* the host can manage every row (except their own): pending rows lose the
     invitation, claimed/answered rows are removed AND banned from the event.
     Other members get a lighter menu on real people (uid rows): ask the host
     to remove them - nothing happens until the host approves. */
  function rowDots(g){
    if(ev.role==='hosting')
      return g.isHost ? '' :
        '<button class="dots" type="button" data-gdots="'+h(g.name)+'" data-gduid="'+h(g.uid||'')+
        '" data-gdid="'+h(g.docId||'')+'" data-gstat="'+h(g.status||'')+
        '" aria-haspopup="true" aria-expanded="false" '+
        'aria-label="Options for '+h(g.name)+'">'+ico('more')+'</button>';
    if(g.isHost || g.isYou || !g.uid) return '';
    if(!(myRsvp(ev.id) || loadMe().claims[ev.id])) return '';
    return '<button class="dots" type="button" data-greq="'+h(g.name)+'" data-grequid="'+h(g.uid)+
      '" aria-haspopup="true" aria-expanded="false" aria-label="Options for '+h(g.name)+'">'+
      ico('more')+'</button>';
  }
  function goingRow(g){
    return '<div class="g-row"><span class="g-av on">'+img(g.avatarUrl,'')+'</span>'+
      '<div class="g-txt"><div class="g-name"><b>'+h(g.isHost?g.name:evName(ev,g.name,g.uid))+'</b>'+
        (g.isHost?'<span class="tag">Host</span>':'')+
        (g.plus?'<span class="tag">+'+g.plus+'</span>':'')+'</div>'+
        (g.message?'<p>'+h(g.message)+'</p>':'')+'<small>'+h(g.invitedLabel)+'</small></div>'+
      '<span class="g-end">'+(g.isYou?'<em>You</em>':'')+(rowDots(g)||ico('chev'))+'</span></div>';
  }
  function waitRow(g){
    var d8=rowDots(g);
    return '<div class="g-row"><span class="g-av">'+img(g.avatarUrl,'')+'</span>'+
      '<div class="g-txt"><div class="g-name"><b>'+h(g.isHost?g.name:evName(ev,g.name,g.uid))+'</b></div>'+
        '<small>'+h(g.invitedLabel)+'</small></div>'+
      (d8?'<span class="g-end">'+d8+'</span>':'')+'</div>';
  }
  function reqRow(r, i){
    return '<div class="g-row"><span class="g-av">'+img(r.avatarUrl||GAV,'')+'</span>'+
      '<div class="g-txt"><div class="g-name"><b>'+h(evName(ev,r.name,r.uid))+'</b></div>'+
        '<small>'+(r.reqType==='invite' ? 'Suggested by '+h(r.byName?evName(ev,r.byName,r.byUid):'a guest')
                 : r.reqType==='remove' ? 'Removal asked by '+h(r.byName?evName(ev,r.byName,r.byUid):'a guest')
                 : 'Wants to join')+
        (r.phone?' · '+h(r.phone):'')+'</small></div>'+
      '<span class="g-end">'+
        '<button class="gadd" type="button" data-rok="'+h(String(r.docId||i))+
          '" aria-label="Approve '+h(r.name)+'">'+ico('tick')+'</button>'+
        '<button class="gdel" type="button" data-rno="'+h(String(r.docId||i))+
          '" aria-label="Decline '+h(r.name)+'">'+ico('x2')+'</button>'+
      '</span></div>';
  }

  function section(key, label, rows, rowFn, sub){
    var open = !!guestsOpen[key], show = open ? rows : rows.slice(0, 3);

/* ================= CREATE EVENT =================
   Four steps, all rendered from one DRAFT object that is mirrored into
   localStorage. Every control writes straight into DRAFT, so a repaint (or a
   reload, or "Save Draft") never loses what has been typed. Step 4's Invite
   Guests writes the real Firestore document; the cover photo is uploaded to
   Cloud Storage the moment it is chosen.
   =============================================== */

/* tile colours match the mood grid in the app */
var VIBES = [
  { k:'Coffee', ic:'v-coffee', bg:'#A7F3D0', fg:'#10B981' },
  { k:'Chill',  ic:'v-chill',  bg:'#BFDBFE', fg:'#3B82F6' },
  { k:'Game',   ic:'v-game',   bg:'#FECDD3', fg:'#FB7185' },
  { k:'Go-Out', ic:'v-goout',  bg:'#FED7AA', fg:'#FB923C' },
  { k:'Food',   ic:'v-snack',  bg:'#A7F3D0', fg:'#10B981' },
  { k:'Study',  ic:'v-study',  bg:'#C7D2FE', fg:'#6366F1' },
  { k:'Event',  ic:'v-ticket', bg:'#C7D2FE', fg:'#6366F1' },
  { k:'Athletic', ic:'v-athletic', bg:'#FED7AA', fg:'#FB923C' },
  { k:'Custom',   ic:'v-custom',   bg:'#FECDD3', fg:'#FB7185' }
];
/* iconN.svg (grey #E5E7EB / #9CA3AF) is the unselected tile, iconN-bg.svg the
   selected one - same geometry, so one symbol plus these colours covers both. */
var VIBE_OFF = { bg:'#E5E7EB', fg:'#9CA3AF' };
var VIBE_BY = {};
VIBES.forEach(function(v){ VIBE_BY[v.k] = v; });
function vibeDot(list){ var v = VIBE_BY[(list || [])[0]]; return v ? v.fg : '#6d28d9'; }

var TIME_OPTS = (function(){
  var a = [], i, hh, mm;
  for(i = 0; i < 96; i++){
    hh = Math.floor(i / 4); mm = (i % 4) * 15;
    a.push((hh % 12 || 12) + ':' + (mm < 10 ? '0' : '') + mm + ' ' + (hh < 12 ? 'AM' : 'PM'));
  }
  return a;
})();
function timePlus(t, mins){
  var m = t24(t); if(!t) return '';
  return TIME_OPTS[Math.round(((m + mins) % 1440) / 15)];
}
/* ---------- draft state ---------- */
var DRAFT_KEY = 'd2c.draft.v2', DRAFTS_KEY = 'd2c.eventdrafts.v1', DRAFT = null;

/* ---- saved drafts: parked events, visible under Hosting, sent to no one ---- */
function eventDrafts(){
  try{ return JSON.parse(localStorage.getItem(DRAFTS_KEY) || '[]') || []; }catch(e){ return []; }
}
function writeEventDrafts(list){
  try{ localStorage.setItem(DRAFTS_KEY, JSON.stringify(list)); }catch(e){}
}
function saveEventDraft(){
  var d = loadDraft(), list = eventDrafts(), snap = {}, k, i;
  if(!d.draftId) d.draftId = 'dft-' + Date.now().toString(36);
  for(k in d) if(k.charAt(0) !== '_') snap[k] = d[k];
  /* a blob: preview dies with the session - the card would render broken */
  if(!snap.coverPath && /^blob:/.test(snap.coverUrl || '')) snap.coverUrl = '';
  for(i = 0; i < list.length; i++) if(list[i].draftId === d.draftId) break;
  list[i] = snap;
  writeEventDrafts(list);
  return d.draftId;
}
function deleteEventDraft(id){
  writeEventDrafts(eventDrafts().filter(function(x){ return x.draftId !== id; }));
}
function resumeEventDraft(id){
  var snap = eventDrafts().filter(function(x){ return x.draftId === id; })[0];
  if(!snap) return false;
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(snap)); }catch(e){}
  DRAFT = null; loadDraft();
  return true;
}

/* the settings of the last event this device created - new drafts start
   from them, so a repeat host never re-picks the same choices */
var LAST_KEY = 'd2c.lastset.v1';
function lastSettings(){
  try{ return JSON.parse(localStorage.getItem(LAST_KEY) || 'null'); }catch(e){ return null; }
}
function rememberSettings(d){
  try{
    localStorage.setItem(LAST_KEY, JSON.stringify({
      join:d.join, post:d.post, capMode:d.capMode, capacity:d.capacity,
      plusMode:d.plusMode, plusN:d.plusN, rsvpMode:d.rsvpMode,
      entryMode:d.entryMode, entryNote:d.entryNote,
      reminders:d.reminders, remN:d.remN, remUnit:d.remUnit,
      notifyChanges:d.notifyChanges }));
  }catch(e){}
}
function blankDraft(){
  /* the real clock, not the mock TODAY - one week out, 7pm */
  var start = addDays(isoOf(new Date()), 7);
  var d = { draftId:'', title:'', coverUrl:'', coverPath:'',
           date:start, time:'7:00 PM', endTime:null,
           venue:'', address:'', about:'', vibes:[], vibeCustom:'',
           /* step 3 - 'open' is the first-time default */
           capMode:'custom', capacity:30,
           join:'open', post:'guests',
           plusMode:'one', plusN:2,
           /* same day as the event until the host sets it themselves */
           rsvpMode:'custom', rsvpBy:start, rsvpTouched:false,
           entryMode:'free', entryNote:'',
           reminders:[1440], remN:2, remUnit:'Hours', notifyChanges:true,
           /* step 4 */
           invitees:[], extra:[], inviteMsg:'', msgTouched:false };
  var ls = lastSettings(), k;
  if(ls) for(k in ls) if(ls[k] != null && d.hasOwnProperty(k))
    d[k] = Array.isArray(ls[k]) ? ls[k].slice() : ls[k];
  return d;
}
function loadDraft(){
  if(EDIT) return EDIT.draft;        /* step 3 edits the event in place */
  if(DRAFT) return DRAFT;
  DRAFT = blankDraft();
  try{
    var saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if(saved) for(var k in DRAFT){ if(saved[k] != null) DRAFT[k] = saved[k]; }
  }catch(e){}
  /* an object URL from a previous session is dead - drop the preview */
  if(/^blob:/.test(DRAFT.coverUrl) && !DRAFT.coverPath) DRAFT.coverUrl = '';
  if(!Array.isArray(DRAFT.vibes)) DRAFT.vibes = [];
  if(typeof DRAFT.vibeCustom !== 'string') DRAFT.vibeCustom = '';
  if(!Array.isArray(DRAFT.reminders)) DRAFT.reminders = [];
  if(!Array.isArray(DRAFT.invitees)) DRAFT.invitees = [];
  if(!Array.isArray(DRAFT.extra)) DRAFT.extra = [];
  /* a contact icon is an object URL - dead after a reload, so fall back */
  DRAFT.extra.forEach(function(e){ if(/^blob:/.test(e.photo || '')) e.photo = ''; });
  /* an old saved draft keeps its fields but never a past date */
  var today = isoOf(new Date());
  if(DRAFT.date < today){
    DRAFT.date = addDays(today, 7);
    if(!DRAFT.rsvpTouched) DRAFT.rsvpBy = DRAFT.date;
  }
  return DRAFT;
}
function saveDraft(){
  if(EDIT) return;                   /* an edit is committed, never autosaved */
  try{
    var d = loadDraft(), o = {};
    for(var k in d){ if(k.charAt(0) !== '_') o[k] = d[k]; }
    localStorage.setItem(DRAFT_KEY, JSON.stringify(o));
  }catch(e){}
}
function clearDraft(){
  if(DRAFT && DRAFT._objUrl) URL.revokeObjectURL(DRAFT._objUrl);
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
  DRAFT = null;
}

function withCurrent(opts, cur){
  return opts.indexOf(cur) > -1 ? opts : [cur].concat(opts);

function applyP2(key, v){
  var d = loadDraft();
  if(key === 'cap'){
    if(v === 'Unlimited') d.capMode = 'unlimited';
    else { d.capMode = 'custom'; d.capacity = parseInt(v, 10) || d.capacity; }
  } else if(key === 'join'){
    JOIN_OPTS.forEach(function(o){ if(o.lab === v) d.join = o.k; });
  } else if(key === 'post'){
    POST_OPTS.forEach(function(o){ if(o.lab === v) d.post = o.k; });
  } else if(key === 'plus'){
    if(v === 'Not allowed') d.plusMode = 'none';
    else if(v === 'Allowed') d.plusMode = 'one';
    else { d.plusMode = 'custom'; d.plusN = parseInt(v.replace(/\D/g,''), 10) || d.plusN; }
  } else if(key === 'entry'){
    if(v === 'Free') d.entryMode = 'free';
    else if(v === 'Pay at event') d.entryMode = 'door';
  } else if(key === 'rem'){
    if(v === 'None') d.reminders = [];
    else if(v === '1 week before') d.reminders = [10080];
    else if(v === '1 day before')  d.reminders = [1440];
    else if(v === '1 hour before') d.reminders = [60];
  }
}

   localStorage. Only the people actually invited are kept, in DRAFT.extra,
   because those are exactly what the event document will carry anyway.

var CONTACTS = [];

var WEB_ROSTER_DEMO = false;

function slugId(s){
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) ||
         'x' + (Math.abs(hashStr(String(s))) % 100000);
}
function hashStr(s){
  var hOut = 0, i;
  for(i = 0; i < s.length; i++) hOut = (hOut * 31 + s.charCodeAt(i)) | 0;
  return hOut;
}
function faceOf(p){ return p.photo || GAV; }
function extraAt(d, id){
  for(var i = 0; i < d.extra.length; i++) if(d.extra[i].id === id) return i;
  return -1;
}
function inviteCount(d){ return d.invitees.length + d.extra.length; }

/* "Sam Ruiz (530) 555-0123" -> {name:'Sam Ruiz', phone:'(530) 555-0123'} */
function parseEntry(raw){
  var t = String(raw).trim().replace(/\s+/g, ' ');
  if(!t) return null;
  var m = t.match(/^(.*?)[\s,]*([+(]?\d[\d\s\-().]{5,})$/);
  var name = (m ? m[1] : t).trim().replace(/[,;]+$/, '');
  var phone = m ? m[2].trim() : '';
  if(!name){ name = phone; phone = ''; }
  return name ? { name: name, phone: phone } : null;
}
/* Commit one or many comma-separated entries; returns how many were added. */
function addManual(raw){
  var d = loadDraft(), added = 0;
  String(raw).split(/[,;\n]+/).forEach(function(part){
    var e = parseEntry(part);
    if(!e) return;
    var id = 'm-' + slugId(e.name + '|' + e.phone);
    if(extraAt(d, id) > -1) return;                    // already on the list
    /* same person via contacts AND typed by hand = one entry, not two. With
       a phone the number is the identity, so a same-named SECOND person gets
       in; without one the name check still stops accidental duplicates. */
    var pn2 = normPhone(e.phone), nm2 = e.name.toLowerCase();
    if(d.extra.some(function(x){
      return pn2 ? normPhone(x.phone) === pn2 : x.name.toLowerCase() === nm2;
    })) return;
    d.extra.push({ id: id, name: e.name, phone: e.phone, photo: '', src: 'manual' });
    added++;
  });
  if(added) saveDraft();
  return added;
}

/* ---------- contacts ---------- */
function contactsReady(){
  return !!(window.navigator && navigator.contacts && navigator.contacts.select &&
            window.isSecureContext && window.top === window.self);
}
function contactToPerson(c){
  var name = (c.name && c.name[0]) || '',
      tel  = (c.tel && c.tel[0]) || '',
      icon = (c.icon && c.icon[0]) || null;
  return { id: 'c-' + slugId(name + '|' + tel), name: name.trim(), phone: tel,
           photo: icon ? URL.createObjectURL(icon) : '', src: 'contact' };
}
function importContacts(){
  if(!contactsReady()){
    toast('Your contacts aren\u2019t available in this browser - add people by name below.', 'err', 5000);
    return;
  }
  var run = function(props){
    navigator.contacts.select(props, { multiple: true }).then(function(list){
      var people = (list || []).map(contactToPerson).filter(function(p){ return p.name; });
      if(!people.length){ toast('No contacts chosen'); return; }
      CONTACTS = people;
      inviteQ = ''; inviteGroup = 'all';
      toast(people.length + (people.length === 1 ? ' contact loaded' : ' contacts loaded'));
      repaintInvites();
    }).catch(function(e){
      toast(e && e.name === 'AbortError'
        ? 'Contact import cancelled'
        : 'Could not read your contacts on this device.', 'err', 4500);
    });
  };
  var want = ['name', 'tel', 'icon'];
  if(navigator.contacts.getProperties){
    navigator.contacts.getProperties().then(function(have){
      var props = want.filter(function(p){ return have.indexOf(p) > -1; });
      run(props.length ? props : ['name']);

function shrinkImage(file, size, cb){

/* ---- .vcf import: works in every browser, and brings ALL contacts at once.
   Android vCard 2.1 quotes non-ASCII names as QUOTED-PRINTABLE UTF-8. ---- */
function qpDecode(v){
  try{
    var bytes = [];
    String(v).replace(/=([0-9A-F]{2})|([\s\S])/gi, function(_, hx, ch){
      if(hx) bytes.push(parseInt(hx, 16));
      else if(ch) bytes.push(ch.charCodeAt(0) & 255);
      return '';
    });
    return new TextDecoder('utf-8').decode(new Uint8Array(bytes));
  }catch(e){ return v; }
}
function parseVCF(text){
  var out = [];
  text = String(text).replace(/\r/g, '').replace(/\n[ \t]/g, '');   /* unfold */
  text.split(/BEGIN:VCARD/i).forEach(function(card){
    if(!/END:VCARD/i.test(card)) return;
    var fn = '', nName = '', tel = '';
    card.split('\n').forEach(function(ln){
      var ix = ln.indexOf(':');
      if(ix < 0) return;
      var key = ln.slice(0, ix).toUpperCase(), val = ln.slice(ix + 1).trim();
      if(key.indexOf('QUOTED-PRINTABLE') > -1) val = qpDecode(val);
      if(key === 'FN' || key.indexOf('FN;') === 0){ if(!fn) fn = val; }
      else if(key === 'N' || key.indexOf('N;') === 0){ if(!nName) nName = val; }
      else if(key.indexOf('TEL') === 0){ if(!tel) tel = val.replace(/^tel:/i, ''); }   /* vCard 4.0 emits TEL;VALUE=uri:tel:+1… */
    });
    if(!fn && nName) fn = nName.split(';').filter(Boolean).reverse().join(' ').trim();
    fn = fn.trim();
    if(fn) out.push({ name: fn, phone: tel.trim() });
  });
  return out;
}
function importVcf(file){
  var r = new FileReader();
  r.onload = function(){
    var people = parseVCF(r.result), seen = {}, list = [];
    people.forEach(function(p){
      var id = 'c-' + slugId(p.name + '|' + p.phone);
      if(seen[id]) return;
      seen[id] = 1;
      list.push({ id: id, name: p.name, phone: p.phone, photo: '', src: 'contact' });
    });
    if(!list.length){ toast('No contacts found in that file', 'err', 4000); return; }
    CONTACTS = list;
    inviteQ = ''; inviteGroup = 'all';
    toast(list.length + (list.length === 1 ? ' contact imported' : ' contacts imported'));
    repaintInvites();
  };
  r.onerror = function(){ toast('Could not read that file', 'err'); };
  r.readAsText(file);
}

  var tp = String(ev.time || '').split(/\s[–-]\s/);

  d.time = tp[0] || ''; d.endTime = tp[1] || null;
  d.venue = ev.venue; d.address = ev.address; d.about = ev.about;
  d.coverUrl = ev.coverUrl || ''; d.coverPath = ev.coverPath || '';
  d.vibes = (ev.vibes && ev.vibes.length) ? ev.vibes.slice() : [];
  d.vibeCustom = ev.vibeCustom || '';
  d.capMode  = ev.capacityMode || (/unlimited|no limit/i.test(ev.capacity || '') ? 'unlimited' : 'custom');
  d.capacity = ev.capacityMax || numOf(ev.capacity, 30);

  d.plusMode = ev.plusOnesMode || (/not allowed/i.test(ev.plusOnes || '') ? 'none' : 'one');
  d.plusN    = ev.plusOnesMax > 1 ? ev.plusOnesMax : 2;

  d.entryNote = ev.entryNote || (d.entryMode === 'custom' ? (ev.entry || '') : '');

/* ---------- cover photo: pick, upload, preview ---------- */
function repaintCover(){
  var w = document.getElementById('cover-wrap');
  if(w) w.innerHTML = coverBox(loadDraft());
}
function coverBusy(p){
  var box = document.getElementById('cover-box');
  if(!box) return;
  var ov = box.querySelector('.cbusy');
  if(!ov){
    ov = document.createElement('div');
    ov.className = 'cbusy';
    ov.innerHTML = '<span>Uploading\u2026</span><i><b style="width:0"></b></i>';
    box.appendChild(ov);
  }
  ov.querySelector('b').style.width = Math.round(Math.max(0, Math.min(1, p)) * 100) + '%';
}
function pickCover(){
  var input = document.getElementById('cover-input');
  input.value = '';
  input.onchange = function(){
    var f = input.files && input.files[0];
    if(f) takeCover(f);
  };
  input.click();
}
function takeCover(file){
  var d = loadDraft();
  if(!/^image\//.test(file.type)){ toast('That file isn\u2019t an image.', 'err'); return; }
  if(file.size > 25 * 1024 * 1024){
    toast('That image is ' + (file.size/1048576).toFixed(1) + ' MB - the limit is 25 MB.', 'err', 4000);
    return;
  }
  /* offline / unconfigured: show a local preview so the flow still works */
  if(!(STORE.mode === 'live' && window.D2C && D2C.uploadCover)){
    if(d._objUrl) URL.revokeObjectURL(d._objUrl);
    d._objUrl = URL.createObjectURL(file);
    d.coverUrl = d._objUrl; d.coverPath = '';
    saveDraft(); repaintCover();
    toast('Local preview only - connect Firebase to upload.', 'err', 4500);
    return;
  }
  var oldPath = d.coverPath;
  coverBusy(0);
  D2C.uploadCover(file, coverBusy).then(function(r){
    if(d._objUrl){ URL.revokeObjectURL(d._objUrl); d._objUrl = null; }
    d.coverUrl = r.url; d.coverPath = r.path;
    /* replaced file: mid-edit it only dies if the edit is saved */
    if(oldPath){ if(EDIT) EDIT.dropPaths.push(oldPath); else if(D2C.deleteFile) D2C.deleteFile(oldPath); }
    saveDraft(); repaintCover();
    toast('Cover photo uploaded');
  }).catch(function(e){
    repaintCover();
    toast((e && e.message) || 'Upload failed', 'err', 5000);
  });
}
function dropCover(d){
  if(d._objUrl){ URL.revokeObjectURL(d._objUrl); d._objUrl = null; }
  if(d.coverPath){
    if(EDIT) EDIT.dropPaths.push(d.coverPath);          /* dies only on save */
    else if(window.D2C && D2C.deleteFile) D2C.deleteFile(d.coverPath);
  }
  d.coverUrl = ''; d.coverPath = '';
  saveDraft(); repaintCover();
}

/* how many extra people this event lets one guest bring */
function plusMaxOf(ev){
  if(ev.plusOnesMax > 0) return ev.plusOnesMax;
  var p = String(ev.plusOnes || '');
  if(/^allowed$/i.test(p) || /one plus/i.test(p)) return 1;
  var m = p.match(/^\+(\d+)/);
  return m ? +m[1] : 0;
}
function plusRowInner(ev){
  /* the host never RSVPs - they are going by definition */
  var my = myRsvp(ev.id) || (ev.role === 'hosting' ? 'going' : '');
  if(my !== 'going' && my !== 'maybe') return '';
  var max = plusMaxOf(ev);
  if(!max) return '';
  var k = Math.min(myPlus(ev.id), max);
  return '<div class="plusrow"><span>Bringing anyone?</span>' +
    '<button type="button" data-plusadj="-1" aria-label="Fewer"' + (k <= 0 ? ' disabled' : '') + '>' +
      ico('minus') + '</button>' +
    '<b>+' + k + '</b>' +
    '<button type="button" data-plusadj="1" aria-label="More"' + (k >= max ? ' disabled' : '') + '>' +
      ico('plus') + '</button></div>';
}
function isPublicEvent(ev){
  return ev.visibilityMode === 'public' || /public/i.test(ev.visibility || '') ||
         ev.inviteType === 'Public Link';
}
/* the host's curated list plus anyone added from the invite sheet later -
   the identities a visitor can claim, and the roster the invite gates check */
function inviteePool(ev){
  var seen = {}, names = {}, out = [];
  /* live pending rows first: every doc is its own claimable spot, so two
     invitees who share a full name both keep a row (docId is the key).
     Rows with no visitor uid are typed-in people, whoever added them. */
  (ev.waiting || []).forEach(function(g){
    if(g.uid || !g.name) return;
    var k = g.docId ? 'd:' + g.docId : 'n:' + g.name.toLowerCase();
    if(seen[k]) return;
    seen[k] = 1; names[g.name.toLowerCase()] = 1; out.push(g);
  });
  /* the doc-level copies cover local mode and the pre-stream flash; a name
     the rows already carry is the same invite, not another person */
  ((ev.invitedGuests && ev.invitedGuests.length) ? ev.invitedGuests
    : (ev.guestPreview || []).filter(function(g){ return !g.isHost; }))
    .forEach(function(g){
      var k = (g.name || '').toLowerCase();
      if(!k || names[k]) return;
      names[k] = 1; out.push(g);
    });
  return out;
}
function claimList(ev){ return inviteePool(ev).slice(0, 12); }

/* ---- the join gates ----
   amJoined: I already answered, I claimed a curated spot here, the host
   picked one of my uids, my own uid-keyed guest row exists (an approved
   join request), or my profile name is on the curated list. canJoin gates
   participating (RSVP, chat, photos, inviting): open/public rungs admit
   anyone with the link; guests/private rungs need a claimed spot. */
function amJoined(ev){
  var m = loadMe();
  if(myRsvp(ev.id)) return true;
  if(m.claims[ev.id] || (ev.slug && m.claims[ev.slug])) return true;
  var uids = myUids();
  if((ev.invitedUids || []).some(function(u){ return u && uids.indexOf(u) > -1; })) return true;
  if([].concat(ev.guests || [], ev.maybes || [], ev.cants || [], ev.waiting || [])
      .some(function(g){ return g.uid && uids.indexOf(g.uid) > -1; })) return true;
  var nm = (m.name || '').toLowerCase();
  return !!nm && inviteePool(ev).some(function(g){ return (g.name || '').toLowerCase() === nm; });
}
/* my own not-yet-approved join request, if any */
function myJoinRequest(ev){
  var uids = myUids();
  return (ev.requests || []).filter(function(r){
    return r.reqType === 'join' && r.uid && uids.indexOf(r.uid) > -1; })[0] || null;
}
function canJoin(ev){

/* spots already claimed by some OTHER visitor - row-keyed when the claiming
   row says WHICH spot it took (claimOf), name-keyed as the legacy fallback.
   Sources: streamed guest rows (live) and every registry profile (local). */
function takenSpots(ev){
  var m = loadMe(), uids = myUids(), rows = {}, names = {};
  [].concat(ev.guests || [], ev.maybes || [], ev.cants || [], ev.waiting || [])
    .forEach(function(g){
      if(!(g.uid && /^u-/.test(g.uid)) || uids.indexOf(g.uid) > -1) return;
      if(g.claimOf) rows[g.claimOf] = 1;
      else if(g.name) names[g.name.toLowerCase()] = 1;   /* pre-claimRow claim */
    });
  var reg = regAll(), k;
  for(k in reg){
    if(k === m.uid) continue;
    var cr = reg[k].claimRow || {};
    var rid = cr[ev.id] || (ev.slug && cr[ev.slug]);
    if(rid){ rows[rid] = 1; continue; }
    var c = reg[k].claims || {};
    var nm = c[ev.id] || (ev.slug && c[ev.slug]);
    if(nm) names[nm.toLowerCase()] = 1;
  }
