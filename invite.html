/* best-effort recursive delete of one Storage folder */
async function wipeFolder(path){
  const { storage, st } = await initFirebase();
  try {
    const res = await st.listAll(st.ref(storage, path));
    await Promise.all(res.items.map(i => st.deleteObject(i).catch(() => {})));
    await Promise.all(res.prefixes.map(p => wipeFolder(p.fullPath)));
  } catch(e){ warn("storage cleanup " + path + " (" + (e.code || e.message) + ")"); }
}
/* best-effort delete of one Storage file (replaced covers, deleted drafts) */
async function deleteFile(path){
  try {
    const { storage, st } = await initFirebase();
    await st.deleteObject(st.ref(storage, path));
  } catch(e){ /* already gone, or rules said no - either way not fatal */ }
}

async function updateEvent(id, patch){

  logActivity(id, "pen", "updated the event details");

/* Firestore does not cascade, so the subcollections go first. */
async function deleteEvent(id){
  const { db, storage, fs, st } = await initFirebase();
  const evRef = fs.doc(db, ...FS_ROOT, "events", id);

  let cover = "";
  try { const snap = await fs.getDoc(evRef); cover = (snap.data() || {}).coverPath || ""; }
  catch(e){ /* the doc may already be gone */ }

  for(const sub of ["guests", "photos", "activity"]){
    const snap = await fs.getDocs(fs.collection(evRef, sub));
    await Promise.all(snap.docs.map(d => fs.deleteDoc(d.ref)));
  }
  await fs.deleteDoc(evRef);

  /* Storage doesn't cascade either - the event's album and chat pictures */
  await wipeFolder(PHOTO_ROOT + "/" + id);
  await wipeFolder(CHAT_ROOT + "/" + id);

  if(cover){
    try { await st.deleteObject(st.ref(storage, cover)); }
    catch(e){ warn("cover not removed (" + (e.code || e.message) + ")"); }
  }
  ok("event deleted: " + FS_ROOT.join("/") + "/events/" + id);
}

/* ---------------- the host withdraws an invitation ----------------
   Row-keyed when the menu knows the doc (docId): exactly that invitation
   goes, so a same-named second invitee is never collateral. The name sweep
   stays as the fallback for rows the UI met before docIds rode along. */
async function removeGuest(eventId, name, docId){
  const { db, fs } = await initFirebase();
  const evRef = fs.doc(db, ...FS_ROOT, "events", eventId);
  let docs;
  if(docId){
    const one = await fs.getDoc(fs.doc(evRef, "guests", docId));
    docs = (one.exists() && (one.data().status || "") === "pending") ? [one] : [];
  } else {
    const snap = await fs.getDocs(fs.query(fs.collection(evRef, "guests"),
      fs.where("status", "==", "pending"), fs.where("name", "==", name)));
    docs = snap.docs;
  }
  await Promise.all(docs.map(d => fs.deleteDoc(d.ref)));
  if(docs.length) await fs.updateDoc(evRef, { "counts.pending": fs.increment(-docs.length) });
  logActivity(eventId, "x", "removed an invitation");
}

/* Events written before hostAuthUid existed prove no host, so rules refuse the
   host's deletes on guest rows their guests authored ("insufficient permissions"
   on removing a link-joiner, while host-authored invite rows still delete).
   Rules DO let the host update such a legacy event, so stamping hostAuthUid on
   it upgrades it in place and every host power starts working. No-op when
   already stamped, not signed in, or not ours (rules refuse the write). */
async function stampHost(evRef, fs){
  const uid = authUid(); if(!uid) return;
  try {
    const d = (await fs.getDoc(evRef)).data() || {};
    if(!d.hostAuthUid) await fs.updateDoc(evRef, {
      hostAuthUid: uid,
      hostPhone: d.hostPhone || (fb.auth.currentUser && fb.auth.currentUser.phoneNumber) || ""
    });
  } catch(e){ /* someone else's event */ }
}

/* ---------------- the host removes a person ----------------
   Every row of theirs goes (uid-keyed docs plus uid-less rows under the same
   name), the counters follow, and the uid lands on the event's ban list so
   the link stops working for them. erase (the popup toggle) also wipes what
   they left behind: chat messages + their images, photos, activity rows. */
async function banGuest(eventId, uid, name, erase){
  const { db, fs } = await initFirebase();
  const evRef = fs.doc(db, ...FS_ROOT, "events", eventId);
  await stampHost(evRef, fs);
  const gcol  = fs.collection(evRef, "guests");
  const [byUid, byName] = await Promise.all([
    fs.getDocs(fs.query(gcol, fs.where("uid", "==", uid))),
    name ? fs.getDocs(fs.query(gcol, fs.where("name", "==", name)))
         : Promise.resolve({ docs: [] })
  ]);
  /* rows this person claimed point straight at their curated source rows
     (claimOf) - fetched by id because a rename can outdate the name query.
     With that map, a same-named OTHER invitee's row is never collateral;
     only claim-less legacy rows still fall back to the name sweep. */
  const claimSrc = {};
  byUid.docs.forEach(d => { const c = d.data().claimOf; if(c) claimSrc[c] = 1; });
  const srcDocs = (await Promise.all(Object.keys(claimSrc).map(id =>
    fs.getDoc(fs.doc(evRef, "guests", id)).then(s => (s.exists() ? s : null), () => null)
  ))).filter(Boolean);
  const hasClaim = Object.keys(claimSrc).length > 0;
  const seen = {}, dead = [];
  byUid.docs.concat(srcDocs).concat(byName.docs).forEach(d => {
    if(seen[d.id]) return;
    const v = d.data();
    if(v.uid === uid || claimSrc[d.id] || (!v.uid && !hasClaim)){   // never someone else's row
      seen[d.id] = 1; dead.push(d);
    }
  });
  /* one refused row must not strand the rest - deletes settle one by one and
     only the rows that really went adjust the counters */
  const gone = (await Promise.all(dead.map(d =>
    fs.deleteDoc(d.ref).then(() => d, () => null)))).filter(Boolean);
  const cut = {};
  gone.forEach(d => {
    const s = d.data().status;
    if(/^(going|maybe|cant|pending)$/.test(s)) cut[s] = (cut[s] || 0) + 1;
  });
  /* ban every uid their rows carried, not just the one clicked - a person can
     hold rows under more than one visitor id (second device, relinked phone) */
  const uids = {}; uids[uid] = 1;
  dead.forEach(d => { const u = d.data().uid; if(u) uids[u] = 1; });
  const patch = { banned: fs.arrayUnion.apply(null, Object.keys(uids)) };
  Object.keys(cut).forEach(s => { patch["counts." + s] = fs.increment(-cut[s]); });
  await fs.updateDoc(evRef, patch);
  /* the ban is what actually locks them out - never report success on faith */
  const now = ((await fs.getDoc(evRef)).data() || {}).banned || [];
  if(now.indexOf(uid) < 0) throw new Error("The removal didn't lock them out - this " +
    "device isn't proving host rights. Verify your number in your profile, then " +
    "remove them again.");
  let denied = dead.length - gone.length;
  if(erase) denied += await wipeGuestContent(evRef, fs, uid);
  if(denied) throw new Error("Removed and banned, but " + denied + " of their item(s) " +
    "stayed - this device isn't proving host rights. Verify your number in your " +
    "profile, then remove them again.");
}

/* everything the removed person left behind, best-effort per item */
async function wipeGuestContent(evRef, fs, uid){
  let denied = 0;
  try {
    const arr = ((await fs.getDoc(evRef)).data() || {}).chatMessages || [];
    const mine = arr.filter(m => (m.fromUid || "") === uid);
    if(mine.length){
      await fs.updateDoc(evRef, { chatMessages: arr.filter(m => (m.fromUid || "") !== uid) });
      mine.forEach(m => { if(m.imagePath) deleteFile(m.imagePath); });
    }
  } catch(e){ denied++; }
  const zap = async (sub, field, after) => {
    try {
      const s = await fs.getDocs(fs.query(fs.collection(evRef, sub), fs.where(field, "==", uid)));
      const got = (await Promise.all(s.docs.map(d =>
        fs.deleteDoc(d.ref).then(() => d, () => { denied++; return null; })))).filter(Boolean);
      if(got.length && after) after(got);
    } catch(e){ denied++; }
  };
  await zap("photos", "byUid", got => {
    got.forEach(d => { const p = d.data().path; if(p) deleteFile(p); });
    fs.updateDoc(evRef, { photoCount: fs.increment(-got.length) }).catch(() => {});
  });
  await zap("activity", "personUid", null);
  return denied;
}

/* ---------------- RSVP ----------------
   One guests doc per visitor uid, so re-answering overwrites instead of
   piling up rows, and the counts move by increments on the event doc.   */
async function setRsvp(eventId, status, prev, wasReq){
  const { db, fs } = await initFirebase();
  const me = meIdent();
  const evRef = fs.doc(db, ...FS_ROOT, "events", eventId);
  const row = {
    uid: me.fsId, name: me.name, avatarUrl: me.av, message: "",
    invitedLabel: "Responded just now", isHost: false, isYou: false, authUid: authUid(),
    status: status, order: Date.now(), source: "rsvp",
    plus: (window.loadMe && loadMe().plus[eventId]) || 0
  };
  /* keep the claimed-spot key on answers too (merge preserves an earlier
     stamp; this covers an RSVP that lands before/without announceGuest) */
  const claimOf = (window.loadMe && (loadMe().claimRow || {})[eventId]) || "";
  if(claimOf) row.claimOf = claimOf;
  await fs.setDoc(fs.doc(evRef, "guests", me.fsId || "anon"), row, { merge: true });
  const inc = {};
  inc["counts." + status] = fs.increment(1);
  if(prev && prev !== status) inc["counts." + prev] = fs.increment(-1);
  /* an approved join request was counted as pending until this answer */
  if(!prev && wasReq) inc["counts.pending"] = fs.increment(-1);
  await fs.updateDoc(evRef, inc);
  /* a first answer absorbs the curated invite row that carried this name */
  if(!prev){
    const nm = (window.loadMe && (loadMe().claims[eventId] || loadMe().name)) || "";
    if(nm) absorbPending(eventId, nm, me.fsId || "anon").catch(() => {});
  }
  const act = RSVP_ACT[status];
  if(act) logActivity(eventId, act[0], act[1], act[2]);
}

/* The host-typed pending doc and the visitor's own uid-keyed response are the
   same person once the name is claimed - the response wins, the curated row
   (uid-less, so never someone's live doc) goes, and the counter follows. */
async function absorbPending(eventId, name, keepId){
  const { db, fs } = await initFirebase();
  const evRef = fs.doc(db, ...FS_ROOT, "events", eventId);
  const snap = await fs.getDocs(fs.query(fs.collection(evRef, "guests"),
    fs.where("status", "==", "pending"), fs.where("name", "==", name)));
  const dead = snap.docs.filter(d => d.id !== keepId && !d.data().uid);
  await Promise.all(dead.map(d => fs.deleteDoc(d.ref)));
  if(dead.length) await fs.updateDoc(evRef, { "counts.pending": fs.increment(-dead.length) });
}

/* ---------------- 7. SMS phone check (Firebase Phone Auth) ----------------
   Runs entirely in the browser - Firebase texts the code and verifies it,
   no Cloud Function anywhere. Needs the Phone provider + billing enabled
   in the Firebase console; the invisible reCAPTCHA proves a human asked. */
let smsConf = null, smsCap = null, smsTo = "";
async function smsSend(e164){
  const { auth, au } = await initFirebase();
  /* a solved reCAPTCHA token is single-use, so rebuild the widget per send */
  if(smsCap){ try{ smsCap.clear(); }catch(e){} smsCap = null; }
  let host = document.getElementById("sms-captcha");
  if(host) host.remove();
  host = document.createElement("div"); host.id = "sms-captcha";
  document.body.appendChild(host);
  smsCap = new au.RecaptchaVerifier(auth, host, { size: "invisible" });
  smsConf = await au.signInWithPhoneNumber(auth, e164, smsCap);
  smsTo = e164;
}
async function smsCheck(code){
  if(!smsConf) throw { code: "auth/code-expired", message: "no code was sent" };
  /* Confirming swaps the signed-in user (anon -> phone), which would orphan
     events this device hosted under the anon uid. While we are STILL that
     anon host, stamp the number being verified onto our events so the rules'
     hostPhone door stays open across the switch. Best-effort. */
  try {
    const { db, fs, auth } = fb;
    if(auth.currentUser && !auth.currentUser.phoneNumber){
      const mine = await fs.getDocs(fs.query(fs.collection(db, ...FS_ROOT, "events"),
        fs.where("hostAuthUid", "==", auth.currentUser.uid)));
      await Promise.all(mine.docs.map(d => fs.updateDoc(d.ref, { hostPhone: smsTo }).catch(() => {})));
    }
  } catch(e){}
  const cred = await smsConf.confirm(code);   // wrong guess -> auth/invalid-verification-code
  smsConf = null;                             // the right code also signs the phone user in
  smsAbort();                                 // widget done - take the badge with it
  return cred.user.phoneNumber;
}
/* remove the reCAPTCHA widget + badge; any sent code stays confirmable */
function smsAbort(){
  if(smsCap){ try{ smsCap.clear(); }catch(e){} smsCap = null; }
  const h = document.getElementById("sms-captcha");
  if(h) h.remove();
}

/* ---------------- live data ---------------- */
let unsubEvents = null, unsubDetail = [], watchingId = null;

async function connectLive(){
  if(!KEY_OK){
    useLocalData(UNSUBBED(FB_CONFIG.apiKey)
      ? "Build placeholder not substituted - showing bundled sample data."
      : "Firebase not configured - showing bundled sample data.");
    return;
  }
  if(unsubEvents){ try{ unsubEvents(); }catch(e){} unsubEvents = null; }
  try {
    const { db, fs } = await initFirebase();
    // Events from the last ~6 weeks onward, ordered by date. Without the
    // window every event ever created streams to every visitor forever.
    const since = isoOf(new Date(Date.now() - 45 * 86400000));
    unsubEvents = fs.onSnapshot(
      fs.query(fs.collection(db, ...FS_ROOT, "events"),
        fs.where("dateISO", ">=", since), fs.orderBy("dateISO")),
      snap => {
        if(STORE.mode !== "live" && window.goLiveClock) goLiveClock();   // real clock from the first live paint
        STORE.setEvents(snap.docs.map(d => docToModel(d.id, d.data())), "live");
        dim("events snapshot: " + snap.size + " docs" +
            (snap.metadata.fromCache ? " (cache)" : ""));
        if(watchingId) watchDetail(watchingId);   // re-attach if the doc set changed
      },
      e => { err("events listener: " + e.code); useLocalData("Firestore read failed (" + e.code + ")."); }
    );
  } catch(e){
    useLocalData("Firebase init failed: " + e.message);
  }
}

/* Subcollections stream only while a detail view is open. */
async function watchDetail(id){
  const ev = findEvent(id);
  if(!ev) return;
  if(STORE.mode === "local"){ if(ev._seed) STORE.setDetail(id, seedDetail(ev)); return; }

  const { db, fs } = await initFirebase();
  const base = [db, ...FS_ROOT, "events", ev.id];

  unsubDetail.push(fs.onSnapshot(fs.collection(...base, "guests"), snap => {
    const all = snap.docs.map(d => mapGuest(d.data(), d.id));
    STORE.setDetail(id, {
      guests:  all.filter(g => g.status === "going"),
      maybes:  all.filter(g => g.status === "maybe"),
      cants:   all.filter(g => g.status === "cant"),
      waiting: all.filter(g => g.status === "pending"),
      requests: all.filter(g => g.status === "request")
    });
  }, e => err("guests: " + e.code)));

  unsubDetail.push(fs.onSnapshot(fs.query(fs.collection(...base, "photos"), fs.orderBy("order", "desc")),
    snap => STORE.setDetail(id, { photos: snap.docs.map(d => {
      const p = d.data();
      return { id: d.id, url: p.url, thumbUrl: p.thumbUrl || p.url, byName: p.byName || "Someone",
               byAvatarUrl: p.byAvatarUrl || "", whenLabel: p.whenLabel || "",
               byUid: p.byUid || "", path: p.path || "" };
    })}), e => err("photos: " + e.code)));

  /* order desc: seeds count down from the list length, app entries use
     Date.now(), so the newest is always first - same scheme as photos. */
  unsubDetail.push(fs.onSnapshot(fs.query(fs.collection(...base, "activity"), fs.orderBy("order", "desc")),
    snap => STORE.setDetail(id, { activity: snap.docs.map(d => {
      const a = d.data();
      return { personName: a.personName || "Someone", personAvatarUrl: a.personAvatarUrl || "",
               icon: a.icon || "check", isCheck: !!a.isCheck, text: a.text || "", ms: a.ms || 0,
               whenLabel: a.whenLabel || "",
               /* docs from before `at` existed still carry their ms epoch in
                  order - derive the time instead of a frozen "Just now" */
               at: a.at || (a.order > 1e12 ? new Date(a.order).toISOString() : ""),
               quote: /^[\u201C"]/.test(a.text || "") };
    })}), e => err("activity: " + e.code)));
}

function mapGuest(g, id){
  return { name: g.name || "Guest", avatarUrl: g.avatarUrl || "", message: g.message || "",
           invitedLabel: g.invitedLabel || "", isHost: !!g.isHost, isYou: !!g.isYou,
           status: g.status || "going", uid: g.uid || "", source: g.source || "",
           phone: g.phone || "", plus: g.plus || 0, claimOf: g.claimOf || "",
           docId: id || "", reqType: g.reqType || "", byName: g.byName || "",
           targetUid: g.targetUid || "", targetName: g.targetName || "" };
}

function stopDetail(){ unsubDetail.forEach(u => { try{ u(); }catch(e){} }); unsubDetail = []; }

/* chatMessages rides ON the event doc, which caps at 1 MB - keep the array
   from ever getting near it. Best-effort, races only cost old messages. */
async function trimChat(evRef){
  try {
    const { fs } = fb;
    const snap = await fs.getDoc(evRef);
    const msgs = (snap.data() || {}).chatMessages;
    if(Array.isArray(msgs) && msgs.length > 420)
      await fs.updateDoc(evRef, { chatMessages: msgs.slice(-400) });
  } catch(e){}
}

async function sendMessage(eventId, text){
  const { db, fs } = await initFirebase();
  const me = meIdent();
  const evRef = fs.doc(db, ...FS_ROOT, "events", eventId);
  const stamp = Date.now();   /* uniqueness for arrayUnion + the feed's handle
                                 back to this message after edits/deletions */
  await fs.updateDoc(evRef, {
    chatMessages: fs.arrayUnion({
      fromUid: me.fsId || "", fromName: me.name, fromAvatarUrl: me.av,
      text: text, at: new Date().toISOString(), isYou: true, ms: stamp
    })
  });
  trimChat(evRef);
  logActivity(eventId, "chat",
    "“" + (text.length > 80 ? text.slice(0, 80) + "…" : text) + "”", false, { ms: stamp });
}

/* A picture message. The file lives under its own storage prefix (CHAT_ROOT),
   apart from the event photo albums, and the message rides the same
   chatMessages array with an imageUrl instead of text. */
async function sendImage(eventId, file){
  const { db, storage, fs, st } = await initFirebase();
  if(!eventId) throw new Error("No event id.");
  if(!file) throw new Error("Choose an image file first.");
  if(!/^image\//.test(file.type)) throw new Error("That file isn’t an image.");
  if(file.size > 25 * 1024 * 1024)
    throw new Error("File is " + (file.size/1048576).toFixed(1) + " MB - the limit is 25 MB.");

  file = await downscale(file, 1600);
  const safe = (file.name || "chat.jpg").replace(/[^\w.\-]+/g, "_");
  const path = CHAT_ROOT + "/" + eventId + "/" + Date.now() + "_" + safe;
  const ref  = st.ref(storage, path);
  await st.uploadBytes(ref, file, { contentType: file.type });
  const url  = await st.getDownloadURL(ref);

  const me = meIdent();
  const evRef = fs.doc(db, ...FS_ROOT, "events", eventId);
  const stamp = Date.now();
  await fs.updateDoc(evRef, {
    chatMessages: fs.arrayUnion({
      fromUid: me.fsId || "", fromName: me.name, fromAvatarUrl: me.av,
      text: "", imageUrl: url, imagePath: path,
      at: new Date().toISOString(), isYou: true, ms: stamp
    })
  });
  trimChat(evRef);
  logActivity(eventId, "cam", "sent a photo in the chat", false, { ms: stamp });
  return { url, path };
}

window.D2C = {
  pickPhoto, sendMessage, sendImage, inviteGuests, removeGuest, banGuest,
  requestJoin, suggestInvites, requestRemoval, approveRequest, declineRequest,
  uploadCover, deleteFile, createEvent, updateEvent, deleteEvent,
  deletePhoto, deleteMessage, editMessage,
  saveProfile, findByPhone, setRsvp, setPlus, propagateProfile, announceGuest, renameLinked,
  smsSend, smsCheck, smsAbort, smsReady: () => KEY_OK,
  smsPending: () => smsConf ? smsTo : "",     // E.164 a code is out to, else ""
  watchEvent(id){ watchingId = id; stopDetail(); watchDetail(id); },
  unwatchEvent(){ watchingId = null; stopDetail(); },
  reconnect: connectLive
};

// Start streaming (or fall back to bundled data if the key is missing).
connectLive();
</script>
