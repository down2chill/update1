<style>
:root{
  --bg:#f7f7fb; --card:#fff; --ink:#000042; --ink-soft:#2a2c63;
  --muted:#70748f; --muted-2:#8a8da6;   /* dark enough for AA at small sizes */
  --primary:#4038f0; --primary-ink:#4b46d6; --soft:#efeefd;
  --line:#e5e4f4; --line-2:#dfddf7;
  --blue:#2b6cf6; --blue-bg:#e6eefd; --green:#16a34a;
  --pad:20px; --r-lg:24px; --r-md:18px; --r-sm:14px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;
  --disp:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  --navh:96px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased}
/* the one and only scroller: a fixed full-viewport pane, so it tracks the
   exact same viewport the fixed bars anchor to */
#shell{position:fixed;inset:0;overflow:hidden;transform:translateZ(0)}
@supports (height:100dvh){
  #shell{bottom:auto;height:100dvh}
}
@supports (-moz-appearance:none){
  @media (pointer:coarse){
    /* lvh reaches the glass but slightly past the usable edge on Fenix;
       trimming it restores the same breathing room Chrome shows */
    #shell{bottom:auto;height:calc(100lvh - 16px)}
  }
}
#app{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scroll-behavior:smooth}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:6px}
/* sheets receive programmatic focus for keyboard users - no ring on the card
   itself, the controls inside keep theirs */
.modal-card:focus-visible,.modal-card:focus{outline:none}
.wrap{max-width:720px;margin:0 auto;padding:0 max(var(--pad),env(safe-area-inset-right)) 0 max(var(--pad),env(safe-area-inset-left))}
.sp{flex:1}
.center{text-align:center}

/* ============ sky header (home + calendar) ============ */
.sky{position:relative;isolation:isolate;
  background:linear-gradient(180deg,#7d8ffb 0%,#95a6fc 14%,#b4c0fd 30%,#d3dafd 48%,#eceefb 70%,var(--bg) 88%)}
.sky::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.85;
  background:
   radial-gradient(1.6px 1.6px at 18% 14%,#fff,transparent),
   radial-gradient(1.4px 1.4px at 34% 8%,#fff,transparent),
   radial-gradient(1.8px 1.8px at 62% 18%,#fff,transparent),
   radial-gradient(1.3px 1.3px at 78% 9%,#fff,transparent),
   radial-gradient(1.5px 1.5px at 88% 22%,#fff,transparent),
   radial-gradient(1.2px 1.2px at 47% 26%,#fff,transparent),
   radial-gradient(120px 60px at 12% 40%,rgba(255,255,255,.55),transparent),
   radial-gradient(150px 70px at 82% 46%,rgba(255,255,255,.45),transparent)}
.moon{position:absolute;right:14%;top:16px;width:44px;height:44px;border-radius:50%;
  background:#fdfbf3;box-shadow:0 0 22px 6px rgba(255,252,235,.55);z-index:-1}
.moon::after{content:"";position:absolute;left:-11px;top:-4px;width:44px;height:44px;border-radius:50%;
  background:linear-gradient(180deg,#9fb0fc,#c0c8fd)}
.brand{display:flex;align-items:center;gap:12px;padding-top:calc(14px + env(safe-area-inset-top));height:auto;min-height:60px}
.logo{position:relative;font:800 clamp(19px,5vw,23px)/1 var(--disp);letter-spacing:.06em;color:#0d1152}
.logo i{font-style:normal;color:#4b6bf5}
.logo b{position:absolute;right:-13px;top:-9px;font-size:12px;color:#f7b733}
.round-btn{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#fff;
  color:var(--ink);box-shadow:0 3px 12px rgba(40,40,120,.14);transition:transform .16s}
.round-btn:hover{transform:translateY(-1px)}
.top .logo{margin-left:4px;font-size:clamp(16px,4.4vw,19px)}
.top .logo b{right:-11px;top:-7px;font-size:10px}
.page-h{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
.page-h h1{font:700 clamp(34px,10vw,46px)/1.02 var(--disp);letter-spacing:-.03em;margin:0}
.page-h .round-btn{margin-left:0}
.page-h .btns{margin-left:auto;display:flex;gap:12px}

/* segmented tabs */
.segs{display:flex;background:rgba(255,255,255,.72);border-radius:999px;padding:5px;gap:4px;
  box-shadow:0 3px 14px rgba(40,40,120,.1);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.segs button{flex:1;min-width:0;padding:13px 6px;border-radius:999px;font-size:clamp(14px,3.9vw,16px);
  font-weight:600;color:var(--ink);transition:background .18s,color .18s}
.segs button[aria-selected="true"]{background:#fff;color:var(--primary);
  box-shadow:0 2px 8px rgba(40,40,120,.12),inset 0 0 0 1px #e8e4fc}

/* search */
.searchbar{display:flex;align-items:center;gap:12px;background:#fff;border-radius:999px;
  padding:0 18px;height:58px;margin-top:16px;box-shadow:0 3px 14px rgba(40,40,120,.09)}
.searchbar input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink)}
.searchbar input::placeholder{color:var(--muted-2)}
.searchbar svg.i{color:var(--ink)}
.searchbar .filt{color:var(--primary-ink)}

/* ============ event cards (home) ============ */
.list-h{font:700 clamp(24px,6.4vw,30px)/1.1 var(--disp);letter-spacing:-.025em;margin:26px 0 0}
.mon-h{font:700 clamp(17px,4.6vw,19px)/1.2 var(--disp);color:#6b5fe0;margin:20px 0 12px}
.ecards{display:grid;gap:16px}
.ecard{position:relative;display:flex;gap:14px;background:var(--card);border-radius:22px;padding:11px;
  box-shadow:0 2px 10px rgba(30,30,100,.06);transition:transform .16s,box-shadow .16s}
.ecard:hover{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(40,40,140,.22)}
.ecard .thumb{flex:none;width:35%;max-width:158px;aspect-ratio:9/10;border-radius:16px;object-fit:cover;background:var(--soft)}
.ebody{flex:1;min-width:0;display:flex;flex-direction:column;padding:8px 4px 4px 0}
.etop{display:flex;gap:10px;align-items:flex-start}
.einfo{flex:1;min-width:0}
.einfo h3{font:700 clamp(18px,4.9vw,21px)/1.2 var(--disp);letter-spacing:-.02em;margin:0 0 8px}
.eloc,.ewhen{display:flex;align-items:center;gap:7px;font-size:14.5px;color:var(--ink-soft);min-width:0}
.eloc{color:var(--primary-ink);margin-bottom:5px}
.eloc svg.i{width:16px;height:16px;flex:none;color:var(--primary)}
.eloc span,.ewhen span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edate{flex:none;text-align:right;padding-top:34px;line-height:1}
.edate b{display:block;font:800 clamp(26px,7vw,32px)/1 var(--disp);letter-spacing:-.03em}
.edate span{display:block;margin-top:3px;font-size:13px;font-weight:700;color:var(--primary);letter-spacing:.04em}
.emore{position:absolute;top:12px;right:12px;display:grid;place-items:center;width:34px;height:34px;
  border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(30,30,100,.12);color:var(--ink);z-index:2}
.emore svg.i{width:18px;height:18px}
.ehost{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.ehost img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft)}
.ehost p{margin:0;font-size:13.5px;color:var(--ink-soft);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ehost b{color:var(--primary);font-weight:600}
.pill{flex:none;margin-left:auto;font-size:14px;font-weight:600;padding:8px 15px;border-radius:11px;white-space:nowrap}
.pill.host{background:var(--blue-bg);color:var(--blue)}
.pill.inv{background:#ece9fe;color:#5b46e8}
.pill.went{background:#eef0f5;color:#6b7091}
.empty{text-align:center;color:var(--muted);padding:46px 20px;font-size:15.5px}

.ecard.draftc{border:1.5px dashed #c9c2f4;background:#fbfaff;cursor:pointer;box-shadow:none}
.ecard.draftc:hover{transform:none;box-shadow:0 6px 18px -8px rgba(60,50,160,.18)}
.dthumb{display:grid;place-items:center;color:#b7b3d9}
.dthumb svg.i{width:34px;height:34px;stroke-width:1.4}
.pill.draft{background:#fef3c7;color:#b45309}
.emore.ddel{color:#c0414f}

/* ============ bottom nav ============ */
.bnav{position:fixed;z-index:25;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));
  bottom:calc(14px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;
  display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:34px;background:#fff;
  box-shadow:0 10px 30px -8px rgba(50,40,140,.24),0 0 0 1px rgba(20,20,80,.04)}
.bnav-i{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:var(--ink);font-size:12.5px;font-weight:600;transition:color .18s}
.bnav-i svg.i{width:25px;height:25px;stroke-width:1.7}
.bnav-i[aria-current="page"]{color:var(--primary)}
.bnav-i[aria-current="page"] svg.i{stroke-width:2.1}
.bnav-new{flex:0 1 auto;display:flex;align-items:center;justify-content:center;gap:9px;height:58px;
  padding:0 clamp(14px,4.5vw,26px);border-radius:29px;color:#fff;font-size:clamp(14px,4vw,17px);font-weight:700;
  background:linear-gradient(100deg,#5b3ff0,#4a34ea);box-shadow:0 8px 20px -6px rgba(74,52,234,.6);
  white-space:nowrap;transition:filter .18s,transform .14s}
.bnav-new:hover{filter:brightness(1.07)}
.bnav-new:active{transform:scale(.98)}
.bnav-new .em{font-size:20px;line-height:1}
.has-nav #app{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom))}

/* ============ calendar ============ */
.cal{background:var(--card);border-radius:var(--r-md);margin-top:16px;overflow:hidden;
  box-shadow:0 2px 10px rgba(30,30,100,.06)}
.cal-h{display:flex;align-items:center;gap:10px;padding:16px 14px}
.cal-h b{flex:1;text-align:center;font:700 clamp(17px,4.7vw,20px)/1.2 var(--disp)}
.cal-nav{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--ink);transition:background .18s}
.cal-nav:hover{background:#f2f1fb}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line)}
.cal-dow span{padding:10px 2px;text-align:center;font-size:clamp(9.5px,2.7vw,11.5px);font-weight:700;
  letter-spacing:.06em;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-c{position:relative;min-height:62px;padding:6px 3px 4px;border-top:1px solid var(--line);
  border-left:1px solid var(--line);text-align:center;transition:background .16s}
.cal-c:nth-child(7n+1){border-left:0}
button.cal-c:hover{background:#faf9ff}
.cal-c .d{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;
  font-size:clamp(13px,3.7vw,15.5px);font-weight:700;line-height:1}
.cal-c.out .d{color:#c3c5d6;font-weight:600}
.cal-c.sel .d{background:var(--primary);color:#fff;box-shadow:0 4px 12px -3px rgba(64,56,240,.6)}
.dots-row{display:flex;justify-content:center;gap:3px;margin-top:5px;min-height:7px;flex-wrap:wrap}
.dots-row i{width:6px;height:6px;border-radius:50%}
.ev-lab{display:none;font-size:10px;line-height:1.25;color:var(--ink-soft);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-lab i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:3px;vertical-align:1px}
.cal-grid.week .cal-c{min-height:96px}
.cal-dow.week span{padding-bottom:4px}
.searchbar.cal-search,.searchbar.home-search{display:none}
.searchbar.cal-search.open,.searchbar.home-search.open{display:flex}
.round-btn.on{background:var(--primary);color:#fff;box-shadow:0 4px 14px -3px rgba(64,56,240,.5)}
.no-hit{text-align:center;color:var(--muted);padding:40px 20px;font-size:15.5px}
.no-hit b{color:var(--ink)}

/* day panel */
.day{background:var(--card);border-radius:var(--r-md);margin-top:16px;overflow:hidden;
  box-shadow:0 2px 10px rgba(30,30,100,.06)}
.day-h{display:flex;align-items:center;gap:10px;width:100%;padding:17px 18px;text-align:left}
.day-h b{font:700 clamp(17px,4.7vw,20px)/1.2 var(--disp)}
.day-h em{margin-left:auto;font-style:normal;font-size:14px;color:var(--muted)}
.day-h svg.i{width:20px;height:20px;stroke-width:2.2;transition:transform .22s}
.day[data-open="0"] .day-h svg.i{transform:rotate(180deg)}
.day[data-open="0"] .day-list{display:none}
.drow{display:flex;align-items:center;gap:13px;padding:13px 18px;border-top:1px solid var(--line);width:100%;text-align:left}
.drow:hover{background:#faf9ff}
.drow>img{width:60px;height:60px;border-radius:14px;object-fit:cover;flex:none;background:var(--soft)}
.dinfo{flex:1;min-width:0}
.dtime{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--primary)}
.dtime i{width:8px;height:8px;border-radius:50%;flex:none}
.dinfo h4{margin:2px 0 3px;font:700 clamp(15.5px,4.2vw,17px)/1.25 var(--disp);letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dinfo .eloc{margin:0;font-size:13.5px}
.stack{display:flex;align-items:center;flex:none;padding-left:6px;border-left:1px solid var(--line)}
.stack img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #fff;margin-left:-9px;background:var(--soft)}
.stack img:first-child{margin-left:0}
.stack em{display:grid;place-items:center;min-width:32px;height:32px;padding:0 5px;border-radius:16px;
  background:var(--soft);color:var(--primary-ink);font-style:normal;font-size:12px;font-weight:700;
  border:2px solid #fff;margin-left:-9px}

/* ============ event detail ============ */
.top{display:flex;align-items:center;gap:6px;height:64px;padding-top:env(safe-area-inset-top)}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--ink);transition:background .18s}
.icon-btn:hover{background:#ecebf7}
.icon-btn svg.i{width:24px;height:24px}
.title{font:700 clamp(32px,9vw,42px)/1.05 var(--disp);letter-spacing:-.025em;margin:6px 0 22px}
.hero{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r-lg);background:var(--soft)}
.grid{display:grid;gap:34px}
.grid>*{min-width:0}
.meta{margin-top:26px;display:grid;gap:18px}
.row{display:flex;align-items:center;gap:16px}
.row svg.i{color:var(--ink);width:26px;height:26px;stroke-width:1.7}
.host{display:flex;align-items:center;gap:14px}
.host img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--soft)}
.host p{margin:0;color:var(--ink-soft);font-size:17px}
.host b{font-weight:700;color:var(--ink)}
.pill-tag{margin-left:auto;background:var(--blue-bg);color:var(--blue);font-size:15px;font-weight:600;
  padding:9px 18px;border-radius:12px;white-space:nowrap}
.pill-tag.inv{background:#ece9fe;color:#5b46e8}
.row .when{font-size:17px}
.place b{display:block;font-size:17px;font-weight:700}
.place span{display:block;color:var(--muted);font-size:15.5px;margin-top:2px}
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 16px}
h2{font:700 clamp(21px,5.4vw,24px)/1.2 var(--disp);letter-spacing:-.02em;margin:0}
.link{margin-left:auto;color:var(--primary);font-size:15px;font-weight:600}
.link-row{display:inline-flex;align-items:center;gap:8px;color:var(--primary);font-weight:600;font-size:15.5px}
.link-row svg.i{width:18px;height:18px;stroke-width:2}
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.rsvp button{display:flex;align-items:center;justify-content:center;gap:9px;min-height:60px;padding:0 6px;
  border-radius:var(--r-sm);background:#fbfbfe;border:1px solid var(--line-2);color:var(--primary-ink);
  font-size:15.5px;font-weight:600;transition:background .18s,border-color .18s,transform .12s}
.rsvp button svg.i{width:21px;height:21px}
.rsvp button:hover{border-color:#c9c5f2}
.rsvp button:active{transform:scale(.98)}
.rsvp button[aria-pressed="true"]{background:linear-gradient(180deg,#4a41f5,#3830e2);border-color:transparent;
  color:#fff;box-shadow:0 8px 18px -6px rgba(58,50,226,.55)}
.tally{text-align:center;margin:20px 0 0;font-size:16px;color:var(--ink-soft)}
.tally b{color:var(--primary);font-weight:700}
.tally i{font-style:normal;color:var(--muted-2);padding:0 6px}
.plusrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 0}
.plusrow span{font-size:14.5px;font-weight:600;color:var(--ink-soft)}
.plusrow button{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;
  background:#fbfbfe;border:1px solid var(--line-2);color:var(--primary);transition:border-color .16s}
.plusrow button:hover{border-color:#c9c5f2}
.plusrow button:disabled{opacity:.35;cursor:default}
.plusrow button svg.i{width:16px;height:16px;stroke-width:2.4}
.plusrow b{font:700 16px/1 var(--disp);min-width:32px;text-align:center;color:var(--primary)}
.note{text-align:center;color:var(--muted);font-size:14.5px;margin:8px 0 0}
.about{margin:0;font-size:16.5px;line-height:1.62;color:var(--ink-soft);white-space:pre-wrap;overflow-wrap:break-word}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
.chip{display:flex;align-items:center;gap:11px;min-height:56px;padding:0 14px;background:var(--soft);
  border-radius:var(--r-sm);color:var(--primary-ink);font-size:clamp(13.8px,3.7vw,15.5px);font-weight:500}
.chip svg.i{width:20px;height:20px;stroke-width:1.7}
.guests{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.guest{display:block;text-align:center;min-width:0}
.guest img{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;background:var(--soft);transition:transform .16s}
a.guest:hover img,.more-g:hover{transform:scale(1.05)}
.guest span{display:block;margin-top:9px;font-size:12.5px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guest em{display:block;font-style:normal;font-size:11.5px;color:var(--primary);margin-top:2px}
.more-g{display:grid;place-content:center;text-align:center;width:100%;aspect-ratio:1;border-radius:50%;
  background:var(--soft);color:var(--primary);line-height:1.15;transition:transform .16s}
.more-g b{font-size:15px;font-weight:700}
.more-g small{font-size:9.5px;opacity:.85}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ghost{display:inline-flex;align-items:center;gap:9px;padding:11px 18px;border-radius:var(--r-sm);
  background:#fbfbfe;border:1px solid var(--line-2);color:var(--primary-ink);font-size:15px;font-weight:600;
  transition:border-color .18s,background .18s}
.ghost:hover{border-color:#c9c5f2;background:#fff}
.ghost svg.i{width:19px;height:19px}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  margin-right:calc(-1 * max(var(--pad), env(safe-area-inset-right)));
  cursor:grab;overscroll-behavior-x:contain}
.strip.drag{cursor:grabbing;scroll-behavior:auto}
.strip.drag *{pointer-events:none}
.strip::-webkit-scrollbar{display:none}
.strip>*{flex:0 0 auto;scroll-snap-align:start;border-radius:var(--r-md)}
.strip img{width:112px;height:180px;object-fit:cover;background:var(--soft)}
.add-photo{width:112px;height:180px;display:grid;place-content:center;gap:5px;text-align:center;padding:8px;
  border:1.5px dashed #c9c5ef;background:#fafaff;color:var(--primary-ink)}
.add-photo svg.i{width:30px;height:30px;margin:0 auto;stroke-width:1.5}
.add-photo b{font-size:13.5px;font-weight:600}
.add-photo small{font-size:10.5px;color:var(--muted);line-height:1.3;display:block}
.strip-meta{margin:14px 0 6px;font-size:14.5px;color:var(--muted)}
.chat-card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--soft);border-radius:var(--r-md)}
.av-wrap{position:relative;flex:none}
.av-wrap img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#ddd}
.badge{position:absolute;top:-4px;left:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;
  background:var(--primary);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--soft)}
.chat-txt{min-width:0;flex:1}
.chat-txt b{display:block;font-size:16px;font-weight:700}
.chat-txt p{margin:3px 0 2px;font-size:15.5px;color:var(--ink-soft);overflow:hidden;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.chat-txt small{color:var(--muted-2);font-size:13.5px}
.chat-card .ghost{background:#fff;flex:none}
.map-card{border-radius:var(--r-md);overflow:hidden;background:var(--card);box-shadow:0 1px 2px rgba(20,20,80,.05)}
.map{position:relative}
.map img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#e8eee6}
.pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);color:var(--primary);
  filter:drop-shadow(0 3px 5px rgba(0,0,60,.28))}
.pin svg.i{width:36px;height:36px;fill:var(--primary);stroke:none}
.map-label{position:absolute;left:50%;top:46%;transform:translateX(-50%);background:#fff;border-radius:9px;
  padding:6px 14px;font-size:14px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,60,.14);white-space:nowrap}
.map-foot{display:flex;align-items:center;gap:14px;padding:16px}
.map-foot b{display:block;font-size:16.5px;font-weight:700}
.map-foot span{display:block;font-size:14.5px;color:var(--muted);margin-top:2px}
.map-foot .ghost{margin-left:auto;flex:none}
.details{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:6px 18px 10px}
.details h3{font:700 19px/1.2 var(--disp);margin:16px 0 6px}
.drow2{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.drow2:first-of-type{border-top:0}
.drow2 svg.i{color:var(--primary-ink);width:22px}
.drow2 img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
.drow2 span{color:var(--ink-soft);font-size:15.5px}
.drow2 b{margin-left:auto;font-weight:700;font-size:15.5px;text-align:right}
.feed{list-style:none;margin:0;padding:0 0 0 4px;position:relative}
.feed::before{content:"";position:absolute;left:4px;top:14px;bottom:14px;width:2px;background:#e2e0f6;border-radius:1px}
.feed li{position:relative;display:flex;align-items:center;gap:11px;padding:9px 0 9px 22px}
.feed li::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:10px;height:10px;
  border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--bg)}
.feed img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft)}
.feed svg.i{width:19px;height:19px;color:var(--primary-ink)}
.feed svg.ok{color:var(--green)}
.feed p{margin:0;font-size:15px;color:var(--ink-soft);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed b{font-weight:700;color:var(--ink)}
.feed time{margin-left:auto;font-size:13.5px;color:var(--muted-2);white-space:nowrap;padding-left:8px}
.caught{text-align:center;color:var(--muted-2);font-size:14.5px;margin:22px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.dock{position:fixed;z-index:20;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));
  bottom:calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;height:66px;border-radius:33px;
  display:flex;align-items:center;
  background:linear-gradient(90deg,#e7eefd 0%,#f8eefe 17%,#f4e4fe 31%,#eceafd 44%,#fbfaff 52%,#efeafd 63%,#f5e8fd 76%,#edf0fd 89%,#f3f7fe 100%);
  box-shadow:0 10px 30px -8px rgba(50,40,140,.22),0 0 0 1px rgba(255,255,255,.7) inset;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.dock>*{position:relative;flex:1;min-width:0;padding:0;display:flex;align-items:center;justify-content:center;gap:10px;
  height:100%;color:var(--primary-ink);font-size:clamp(13.5px,3.7vw,15.5px);font-weight:600;
  transition:opacity .16s}
.dock>*:hover{opacity:.7}
.dock>*+*::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:1px;height:26px;background:rgba(10,11,69,.13)}
.dock span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock svg.i{flex:none;width:22px;height:22px}
.has-dock #app{padding-bottom:calc(112px + env(safe-area-inset-bottom))}

/* ============ guests ============ */
.stats{background:var(--card);border-radius:var(--r-md);padding:20px 18px 16px;box-shadow:0 1px 2px rgba(20,20,80,.05)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{text-align:center;position:relative}
.stat+.stat::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line)}
.stat b{display:block;font:700 clamp(22px,6vw,26px)/1.1 var(--disp)}
.stat span{display:block;margin-top:5px;font-size:14px;color:var(--ink-soft)}
.prog{height:8px;border-radius:4px;background:#eae8fa;margin:18px 0 14px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#4744fc,#5b46f5)}
.stats p{margin:0;text-align:center;font-size:14.5px;color:var(--ink-soft)}
.cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:62px;margin:16px 0 0;
  border-radius:var(--r-md);background:linear-gradient(90deg,#4a41f5,#4b31ea);color:#fff;font-size:17px;
  font-weight:700;letter-spacing:-.01em;box-shadow:0 10px 22px -8px rgba(60,50,230,.6);transition:transform .14s,filter .18s}
.cta:hover{filter:brightness(1.06)}
.cta:active{transform:scale(.99)}
.cta svg.i{width:24px;height:24px;stroke-width:1.9}
.lcard{background:var(--card);border-radius:var(--r-md);margin-top:16px;overflow:hidden;box-shadow:0 1px 2px rgba(20,20,80,.05)}
.lcard>h2{font-size:clamp(18px,4.8vw,20px);padding:18px 18px 0}
.lcard>.sub{margin:6px 0 0;padding:0 18px 14px;font-size:14.5px;color:var(--muted)}
.g-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line);position:relative}
.lcard>h2+.g-row,.lcard>.sub+.g-row{border-top:0}
.g-av{position:relative;flex:none}
.g-av img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--soft)}
.g-av.on::after{content:"";position:absolute;right:1px;bottom:1px;width:14px;height:14px;border-radius:50%;
  background:#22c55e;border:2.5px solid #fff}
.g-txt{min-width:0;flex:1}
.g-name{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.g-name b{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.tag{background:var(--soft);color:var(--primary-ink);font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px}
.g-txt p{margin:3px 0 0;font-size:15px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-txt small{display:block;margin-top:2px;font-size:13.5px;color:var(--muted)}
.g-end{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none;color:var(--muted-2)}
.g-end em{font-style:normal;font-size:14.5px}
.g-end svg.i{width:20px;height:20px;stroke-width:2.2;color:var(--ink)}
.dots{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:var(--ink);transition:background .18s}
.dots:hover{background:#f0eff9}
.view-all{display:block;width:100%;text-align:center;padding:16px;border-top:1px solid var(--line);
  color:var(--primary);font-weight:600;font-size:16px}
.view-all:hover{background:#faf9ff}
.seg{display:flex;align-items:center;width:100%;background:var(--card);border-radius:var(--r-md);margin-top:14px;
  padding:20px 18px;box-shadow:0 1px 2px rgba(20,20,80,.05);font:700 clamp(17px,4.6vw,19px)/1.2 var(--disp);transition:background .18s}
.seg:hover{background:#fbfaff}
.seg svg.i{margin-left:auto;width:20px;height:20px;stroke-width:2.2;color:var(--ink)}
.slink{background:var(--card);border-radius:var(--r-md);margin-top:16px;box-shadow:0 1px 2px rgba(20,20,80,.05)}
.slink-top{display:flex;align-items:center;gap:14px;padding:18px}
.slink-top h2{font-size:clamp(18px,4.8vw,20px)}
.slink-top p{margin:5px 0 0;font-size:14.5px;color:var(--muted)}
.slink-top .ghost{margin-left:auto;flex:none}
.regen{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;
  border-top:1px solid var(--line);color:var(--primary);font-weight:600;font-size:16px}
.regen:hover{background:#faf9ff}
.menu{position:fixed;left:0;top:0;z-index:60;width:252px;max-width:calc(100vw - 20px);background:var(--card);
  border-radius:var(--r-md);padding:8px;box-shadow:0 18px 40px -10px rgba(20,20,80,.28),0 0 0 1px rgba(20,20,80,.06)}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;border-radius:11px;
  font-size:15.5px;text-align:left;transition:background .16s}
.menu button:hover{background:#f5f4fd}
.menu svg.i{width:21px;height:21px;color:var(--ink)}
.menu .danger,.menu .danger svg.i{color:#ef4444}

/* Discover expand: a card-shaped button under the rail */
.disc-more{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;
  padding:15px;border-radius:18px;background:var(--card);color:var(--primary);
  font-size:15.5px;font-weight:600;box-shadow:0 2px 10px rgba(30,30,100,.06);
  transition:transform .16s,box-shadow .16s}
.disc-more:hover{transform:translateY(-1px);box-shadow:0 8px 20px -8px rgba(40,40,140,.2)}
.disc-more svg.i{width:18px;height:18px;stroke-width:2.2}

.hid-note{margin:18px 2px 0;font-size:14.5px;color:var(--muted)}
.hid-note button{color:var(--primary);font-weight:700;font-size:inherit}
.hid-note button:hover{opacity:.75}

/* ============ photos page ============ */
.pmeta{margin:-8px 0 18px;color:var(--muted);font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pgrid button{padding:0;border-radius:14px;overflow:hidden;aspect-ratio:1;background:var(--soft);
  position:relative;display:block}
.pgrid img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.pgrid button:hover img{transform:scale(1.06)}
.pgrid .who{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:7px;
  padding:16px 10px 8px;color:#fff;font-size:12px;font-weight:600;
  background:linear-gradient(180deg,transparent,rgba(6,6,40,.72));opacity:0;transition:opacity .22s}
.pgrid button:hover .who,.pgrid button:focus-visible .who{opacity:1}
.pgrid .who img{width:22px;height:22px;border-radius:50%;flex:none}

.lightbox{position:fixed;inset:0;z-index:60;background:rgba(8,8,34,.94);
  display:flex;flex-direction:column;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lightbox[hidden]{display:none}
.lb-bar{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;color:#fff;flex:none}
.lb-bar .cnt{font-size:15px;font-weight:600;opacity:.85}
.lb-bar button{margin-left:auto;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;
  color:#fff;background:rgba(255,255,255,.14);transition:background .18s}
.lb-bar button:hover{background:rgba(255,255,255,.26)}
.lb-bar button+button{margin-left:0}      /* only the first button takes the auto gap */
.lb-bar .lb-del:hover{background:rgba(220,38,38,.55)}
.bub[data-msg]{cursor:pointer}
.bub[data-msg]:hover{filter:brightness(.985)}
.lb-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:0 12px}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
.lb-arrow{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;
  width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;transition:background .18s}
.lb-arrow:hover{background:rgba(255,255,255,.3)}
.lb-arrow.prev{left:6px}.lb-arrow.next{right:6px}
.lb-cap{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));font-size:14px}
.lb-cap img{width:28px;height:28px;border-radius:50%}
.lb-cap span{opacity:.7}
body.lb-open #app{overflow:hidden}

.skel{color:var(--muted);font-size:15px;padding:22px 0;text-align:center}
.lcard .skel{padding:34px 18px}
.banner{display:flex;align-items:center;gap:10px;margin-top:18px;padding:12px 14px;border-radius:var(--r-sm);
  background:#fff7e6;border:1px solid #f6e0b0;color:#8a6414;font-size:14px;line-height:1.45}
.banner svg.i{width:19px;height:19px;flex:none}
.banner a{color:var(--primary);font-weight:600;text-decoration:underline}

/* ---- chat page ---- */
.chat-wrap{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.chat-sub{margin:-12px 0 20px;color:var(--muted);font-size:15px}
.thread{display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:11px;align-items:flex-end;max-width:82%}
.msg img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft)}
.msg .bub{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 20px 6px;
  padding:11px 15px;box-shadow:0 1px 2px rgba(20,20,80,.04)}
.msg .who2{display:block;font-size:12.5px;font-weight:700;color:var(--primary-ink);margin-bottom:3px}
.msg .bub p{margin:0;font-size:15.5px;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
.msg time{display:block;margin-top:5px;font-size:11.5px;color:var(--muted-2)}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.msg.me .bub{background:linear-gradient(180deg,#4a41f5,#3830e2);border-color:transparent;
  border-radius:20px 20px 6px 20px;box-shadow:0 6px 16px -6px rgba(58,50,226,.5)}
.msg.me .bub p,.msg.me time{color:#fff}
.msg.me time{opacity:.75;text-align:right}
.chat-empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:15.5px}
.composer{position:fixed;z-index:25;left:0;right:0;bottom:0;
  padding:12px max(var(--pad),env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom));
  background:rgba(247,247,251,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-top:1px solid var(--line)}
.composer-in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.composer input{flex:1;min-width:0;height:52px;padding:0 18px;border:1px solid var(--line-2);
  border-radius:26px;background:#fff;font:inherit;font-size:16px;color:var(--ink);outline:0;
  transition:border-color .18s}
.composer input:focus{border-color:#b9b3f0}
.composer button{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;
  background:linear-gradient(140deg,#5b3ff0,#4a34ea);color:#fff;
  box-shadow:0 8px 18px -6px rgba(74,52,234,.55);transition:filter .18s,transform .12s}
.composer button:hover{filter:brightness(1.07)}
.composer button:active{transform:scale(.95)}
.composer button[disabled]{opacity:.45;box-shadow:none;filter:grayscale(.5);cursor:not-allowed}
.composer svg.i{width:22px;height:22px;stroke-width:2}
.composer .attach{background:#fbfbfe;border:1px solid var(--line-2);color:var(--primary-ink);box-shadow:none}
.msg.me .who2{color:rgba(255,255,255,.82);text-align:right}
.msg .bub .chat-img{width:210px;max-width:100%;height:auto;max-height:280px;object-fit:cover;
  border-radius:13px;display:block;cursor:zoom-in;margin:2px 0 4px;background:var(--soft)}
.strip .sph{padding:0;overflow:hidden;cursor:zoom-in}
.strip .sph img{display:block}

/* ---- toast ---- */
.toast{position:fixed;z-index:80;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));
  transform:translateX(-50%);max-width:min(420px,calc(100vw - 32px));
  display:flex;align-items:center;gap:10px;padding:13px 18px;border-radius:999px;
  background:#12143a;color:#fff;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  box-shadow:0 14px 34px -10px rgba(10,10,50,.55);animation:trise .2s ease-out}
.toast[hidden]{display:none}
/* raised variant (welcome after claiming), "tup" because bare .top is the header bar:
   rides over the finish-card avatar, just above its cam button (card centers at 50vh;
   210 = cardH/2 - 50), instead of covering Save/Skip */
.toast.tup{bottom:auto;top:max(calc(14px + env(safe-area-inset-top)),calc(50vh - 210px));
  animation:tdrop .2s ease-out}
@keyframes trise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes tdrop{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.err{background:#a4212a}
.toast .spin{width:15px;height:15px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;animation:tspin .7s linear infinite}
@keyframes tspin{to{transform:rotate(360deg)}}

/* ---- get-the-app modal ---- */
.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(10,10,40,.55);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  animation:mfade .18s ease-out}
.modal[hidden]{display:none}
@keyframes mfade{from{opacity:0}to{opacity:1}}
@keyframes mrise{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modal-card{position:relative;width:100%;max-width:390px;background:var(--card);border-radius:26px;
  padding:34px 26px 26px;text-align:center;box-shadow:0 30px 70px -20px rgba(20,20,80,.5);
  animation:mrise .24s cubic-bezier(.2,.8,.3,1)}
.modal-x{position:absolute;top:14px;right:14px;display:grid;place-items:center;width:38px;height:38px;
  border-radius:50%;color:var(--muted);transition:background .18s,color .18s}
.modal-x:hover{background:#f2f1fb;color:var(--ink)}
.modal-ic{width:74px;height:74px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;
  font-size:36px;line-height:1;background:linear-gradient(145deg,#ede9fe,#dbeafe);
  box-shadow:0 10px 24px -10px rgba(74,52,234,.5)}
.modal-card h3{margin:0 0 10px;font:700 clamp(21px,5.6vw,24px)/1.2 var(--disp);letter-spacing:-.02em}
.modal-card p{margin:0 0 22px;font-size:15.5px;line-height:1.55;color:var(--ink-soft)}
.modal-cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;
  border-radius:var(--r-md);background:linear-gradient(100deg,#5b3ff0,#4a34ea);color:#fff;
  font-size:16.5px;font-weight:700;box-shadow:0 10px 22px -8px rgba(74,52,234,.6);
  transition:filter .18s,transform .12s}
.modal-cta:hover{filter:brightness(1.07)}
.modal-cta:active{transform:scale(.99)}
.modal-cta svg.i{width:20px;height:20px;stroke-width:2.2}
.modal-later{display:block;width:100%;margin-top:6px;padding:14px;color:var(--muted);
  font-size:15px;font-weight:600;border-radius:var(--r-sm);transition:background .18s,color .18s}
.modal-later:hover{background:#f7f6fd;color:var(--ink-soft)}
body.modal-open #app{overflow:hidden}

/* ============ create event (steps 1 & 2) ============ */
.chead{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 0 10px;background:var(--bg)}
.chead .icon-btn,.chead .draft{flex:none}
.chead .logo{margin:0 auto;font-size:clamp(17px,4.9vw,22px)}
.chead .draft{color:var(--primary);font-weight:700;font-size:clamp(14.5px,4vw,17px);
  padding:9px 4px;border-radius:10px;transition:opacity .18s}
.chead .draft:hover{opacity:.72}
.csteps{margin:8px 0 0;font-size:clamp(14.5px,4vw,16.5px);font-weight:600;color:var(--ink-soft)}
.pbar{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:11px 0 4px}
.pbar i{display:block;height:7px;border-radius:4px;background:#e3e1f3}
.pbar i.on{background:linear-gradient(90deg,#5b3ff0,#3b30ea)}
.pbar+.title{margin-top:20px}
.pbar+.cgrid{margin-top:26px}

.cgrid{display:grid;gap:34px}
.cgrid+.cgrid{margin-top:34px}
.cgrid>*{min-width:0}
.ccol{display:grid;gap:34px;align-content:start}
.ccol>*{min-width:0}
.fld{font:700 clamp(19px,5.1vw,23px)/1.25 var(--disp);letter-spacing:-.02em;margin:0 0 10px}
.fsub{margin:-2px 0 15px;color:var(--muted);font-size:clamp(14px,3.9vw,15.5px)}
.lab{display:block;margin:0 0 8px;font-size:14px;font-weight:600;color:var(--ink-soft)}

.inp{display:block;width:100%;height:64px;padding:0 18px;border-radius:var(--r-md);background:#fff;
  border:1px solid var(--line-2);color:var(--ink);font:inherit;font-size:clamp(16px,4.3vw,17.5px);
  outline:0;transition:border-color .18s,box-shadow .18s}
.inp::placeholder{color:var(--muted-2)}
.inp:focus{border-color:#b9b2f3;box-shadow:0 0 0 4px rgba(91,63,240,.12)}
.tawrap{position:relative}
textarea.inp{height:auto;min-height:158px;padding:16px 18px 40px;line-height:1.62;resize:vertical}
.count{position:absolute;right:16px;bottom:12px;font-size:14px;color:var(--muted);pointer-events:none}

/* cover photo */
.cover{position:relative;width:100%;aspect-ratio:1/1.04;border-radius:var(--r-lg);overflow:hidden;background:var(--soft)}
.cover img{width:100%;height:100%;object-fit:cover}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  width:100%;height:100%;padding:22px;border:2px dashed #cfcbf0;border-radius:var(--r-lg);background:#fbfbfe;
  color:var(--primary-ink);font-size:clamp(15px,4vw,16.5px);font-weight:700;transition:border-color .18s,background .18s}
.drop:hover,.cover.over .drop{border-color:var(--primary);background:#f5f3ff}
.drop svg.i{width:38px;height:38px;stroke-width:1.5;color:var(--primary)}
.drop small{max-width:26ch;color:var(--muted);font-size:13.5px;font-weight:500;line-height:1.5}
.cbusy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;
  background:rgba(12,12,45,.58);color:#fff;font-size:14.5px;font-weight:600;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.cbusy i{display:block;width:min(62%,220px);height:6px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.cbusy i b{display:block;height:100%;border-radius:3px;background:#fff;transition:width .2s}
.cover-acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.cover-acts .ghost{justify-content:center;min-height:56px}

/* date / time / select fields - a native control sits transparent on top */
/* two-up that wraps: a field drops to its own row when its text can't fit */
.duo{display:flex;flex-wrap:wrap;gap:12px}
.duo>div{flex:1 1 auto;min-width:0}
.pick{position:relative;display:flex;align-items:center;gap:11px;height:64px;padding:0 14px;
  border-radius:var(--r-md);background:#fff;border:1px solid var(--line-2);
  transition:border-color .18s,box-shadow .18s}
.pick:hover{border-color:#c9c5f2}
.pick:focus-within{border-color:#b9b2f3;box-shadow:0 0 0 4px rgba(91,63,240,.12)}
.pick>svg.i{flex:none;width:21px;height:21px;color:var(--ink)}
.pick b{flex:1;min-width:0;font-weight:600;font-size:clamp(14.5px,3.9vw,16.5px);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv{flex:none;width:18px;height:18px;color:var(--muted-2);transform:rotate(90deg)}
.pick input,.pick select,.srow select,.srow input{position:absolute;inset:0;width:100%;height:100%;opacity:0;
  border:0;background:none;font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.pick input::-webkit-calendar-picker-indicator,.srow input::-webkit-calendar-picker-indicator{
  position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:pointer}
.dash{display:inline-flex;align-items:center;gap:9px;margin-top:13px;padding:12px 18px;border-radius:var(--r-sm);
  border:1.5px dashed #c9c2f4;background:#fbfaff;color:var(--primary);font-size:clamp(14px,3.8vw,15px);
  font-weight:600;transition:background .18s,border-color .18s}
.dash:hover{background:#f3f0ff;border-color:var(--primary)}
.dash svg.i{width:19px;height:19px}

/* where */
.wcard{background:#fff;border:1px solid var(--line-2);border-radius:var(--r-md);padding:4px 16px 12px;
  transition:border-color .18s}
.wcard:focus-within{border-color:#b9b2f3}
.wtop{display:flex;align-items:center;gap:12px;min-height:62px}
.wtop>svg.i{flex:none;width:23px;height:23px;color:var(--ink)}
.wtop .inp{height:54px;padding:0;border:0;border-radius:0;background:none;
  font:700 clamp(17px,4.6vw,20px)/1.2 var(--disp);letter-spacing:-.02em}
.wtop .inp:focus{box-shadow:none}
.mapb{flex:none;display:inline-flex;align-items:center;gap:8px;padding:11px 15px;border-radius:12px;
  background:var(--soft);color:var(--primary);font-size:clamp(14px,3.8vw,15px);font-weight:700;transition:background .18s}
.mapb:hover{background:#e6e2fb}
.mapb[hidden]{display:none}
.mapb svg.i{width:19px;height:19px}
.waddr{display:block;width:100%;padding:0 0 8px;border:0;outline:0;background:none;font:inherit;
  font-size:clamp(14.5px,3.9vw,16px);color:var(--ink-soft)}
.waddr::placeholder{color:var(--muted-2)}

/* vibe picker */
.vibes{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,2.3vw,15px)}
.vibe{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
.vtile{position:relative;width:100%;max-width:78px;aspect-ratio:1;border-radius:20px;
  display:grid;place-items:center;transition:transform .16s,box-shadow .16s}
.vibe:hover .vtile{transform:translateY(-2px)}
.vtile>svg{width:58%;height:58%}
.vtile.more{background:#fff;border:1px solid var(--line-2);color:var(--muted)}
.vtile.more svg.i{width:26px;height:26px}
.vibe>span{max-width:100%;font-size:clamp(11px,3.1vw,13.5px);font-weight:600;color:var(--ink-soft);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vibe>span{color:var(--muted)}
.vibe[aria-pressed="true"] .vtile{box-shadow:0 6px 16px -7px rgba(30,30,110,.45)}
.vibe[aria-pressed="true"]>span{color:var(--ink)}
/* event-page vibe display - same tiles, read-only, sized to sit with the chips */
.vibe-show{display:flex;flex-wrap:wrap;gap:8px 16px;margin:14px 0 2px}
.vibe-show .vibe{width:62px;gap:6px}
.vibe-show .vtile{border-radius:16px}
.vibe-show .vibe:hover .vtile{transform:none}
.vibe-show .vibe>span:last-child{font-size:12px;color:var(--ink-soft)}
/* a Custom tile with a note behind it stays tappable but LOOKS like every
   other tile - strip the button chrome (UA padding shifted the icon) and
   let the label take the shared style, no primary tint */
.vibe-show .vcust{cursor:pointer;padding:0;border:0;background:none;font:inherit;color:inherit}
.vibe-show .vcust:hover .vtile{transform:scale(1.05)}

/* settings rows */
.scard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:0 16px;
  box-shadow:0 1px 2px rgba(20,20,80,.05)}
.srow{position:relative;display:flex;align-items:center;gap:14px;min-height:78px;padding:13px 0;
  border-top:1px solid var(--line);cursor:pointer}
.srow:first-child{border-top:0}
.sic{flex:none;display:grid;place-items:center;width:50px;height:50px;border-radius:15px;
  background:var(--soft);transition:background .18s}
.srow:hover .sic{background:#e6e2fb}
.sic svg.i{width:23px;height:23px;color:var(--ink)}
.srow>b{flex:1;min-width:0;font-size:clamp(15px,4vw,17px);font-weight:700}
.sval{flex:none;max-width:47%;text-align:right;color:var(--primary);line-height:1.35;
  font-size:clamp(13.5px,3.7vw,15.5px);font-weight:600}

/* ---- step 3: expanded settings cards ---- */
.sec3{padding:0 14px}
.sec3>.srow{width:100%;text-align:left}
.sec3>.srow>b{flex:1 1 auto;min-width:0}
.sec3>.srow .sval{flex:0 1 auto;min-width:0;max-width:none}
.sec3>.srow .cv{transition:transform .2s}
/* dual-speed header: the invisible quick-pick covers everything except the
   expander strip, so a tap changes the value and the arrow opens the card */
.sec3>.qrow{padding-right:50px}
.sec3>.qrow select,.sec3>.qrow input[type=date]{width:calc(100% - 50px);cursor:pointer}
.sec3.open>.qrow select,.sec3.open>.qrow input[type=date]{display:none}
.xpd{position:absolute;top:0;right:-14px;bottom:0;width:56px;display:grid;place-items:center;
  color:var(--muted);border-left:1px solid var(--line);border-radius:0;transition:color .15s}
.xpd:hover{color:var(--primary)}
.sec3.open>.srow .cv{transform:rotate(-90deg)}
.secb{display:none;padding:2px 0 16px}
.sec3.open>.secb{display:block}
.opts{display:grid;background:#fbfbfe;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.opt{position:relative;display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:15px 14px;border-top:1px solid var(--line);background:none;transition:background .16s}
.opt:first-child{border-top:0}
.opt:hover{background:#f5f4fd}
.opt.on{background:#f0edfe;box-shadow:inset 0 0 0 1.5px #c3bbf6;border-radius:var(--r-sm);border-top-color:transparent}
.opt.on+.opt{border-top-color:transparent}
.opts.tight .opt{padding:11px 14px}
.rad{flex:none;display:grid;place-items:center;width:21px;height:21px;border-radius:50%;
  border:2px solid #c8c6dd;transition:border-color .16s}
.rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary);transform:scale(0);
  transition:transform .16s}
.opt.on .rad{border-color:var(--primary)}
.opt.on .rad::after{transform:scale(1)}
.oic{flex:none;display:grid;place-items:center;width:30px;color:var(--ink)}
.oic svg.i{width:23px;height:23px}
.otx{flex:1;min-width:0}
.otx b{display:block;font-size:clamp(14.5px,3.9vw,16px);font-weight:700;letter-spacing:-.01em}
.otx span{display:block;margin-top:3px;font-size:clamp(13px,3.5vw,14.5px);color:var(--muted);line-height:1.45}
.ock{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;
  background:var(--primary);color:#fff}
.ock svg.i{width:13px;height:13px;stroke-width:2.6}
.onote{margin:9px 2px 0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.onote.pad{margin:16px 2px;padding-top:15px;border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;margin-top:12px;height:56px;padding:0 6px;background:#fff;
  border:1px solid var(--line-2);border-radius:var(--r-sm)}
.stepper button{display:grid;place-items:center;width:48px;height:44px;border-radius:11px;color:var(--primary);
  transition:background .16s}
.stepper button:hover{background:var(--soft)}
.stepper svg.i{width:21px;height:21px;stroke-width:2.4}
.stepper b{flex:1;text-align:center;font:700 20px/1 var(--disp);color:var(--primary)}
.stepper input{flex:1;min-width:0;width:100%;text-align:center;font:700 20px/1 var(--disp);
  color:var(--primary);border:0;background:none;outline:0;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.datebox{margin-top:14px}
.sec3 .tawrap{margin-top:12px}
.sec3 .tawrap .inp{height:56px;padding-right:74px}
.sec3 .tawrap .count{bottom:19px}

/* reminders */
.remgrid{display:grid;gap:18px}
.remcol{min-width:0}
.remcol.b{padding-top:16px;border-top:1px solid var(--line)}
.remcol h4{margin:0 0 4px;font:700 14.5px/1.3 var(--disp);letter-spacing:-.01em}
.remcol h4.mt{margin-top:18px}
.remcol .onote{margin-top:4px}
.chk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 2px;
  font-size:clamp(14.5px,3.9vw,16px);font-weight:600}
.cbx{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:7px;
  border:2px solid #c8c6dd;color:transparent;transition:background .16s,border-color .16s,color .16s}
.cbx svg.i{width:13px;height:13px;stroke-width:3}
.chk.on .cbx{background:var(--primary);border-color:var(--primary);color:#fff}
.chk:hover .cbx{border-color:var(--primary)}
.remrow{display:flex;gap:10px;margin-top:10px}
.remrow .stepper{flex:1;min-width:0;margin-top:0;height:54px}
.pick.unit{flex:1;min-width:0;height:54px;padding:0 12px}
.pick.unit b{font-size:clamp(13.5px,3.6vw,15px)}
.dash.wide{display:flex;width:100%;justify-content:center;margin-top:10px}
.rchips{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}
.rchip{display:inline-flex;align-items:center;gap:5px;padding:8px 8px 8px 14px;border-radius:11px;
  background:#f4f2fe;border:1px solid #ddd7fa;color:var(--primary);font-size:14px;font-weight:600}
.rchip button{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;color:var(--primary);
  transition:background .16s}
.rchip button:hover{background:#e3ddfb}
.rchip svg.i{width:15px;height:15px;stroke-width:2.4}
.swrow{display:flex;align-items:center;gap:16px;font-size:clamp(14.5px,3.9vw,16px);font-weight:600}
.sw{flex:none;width:56px;height:31px;border-radius:16px;background:#d7d5e6;padding:3px;
  display:flex;transition:background .18s}
.sw i{width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,20,80,.3);
  transition:transform .18s}
.sw.on{background:var(--primary)}
.sw.on i{transform:translateX(25px)}
/* erase-their-content toggle inside the remove-guest popup */
.modal-card .rm-erase{justify-content:space-between;margin:16px 0 2px;padding:12px 14px;
  border-radius:14px;background:var(--soft);font-size:13.5px;text-align:left}

.s3cards{display:grid;gap:16px;align-items:start}
.cgrid.c3>.full{grid-column:1/-1}
.c3 section.full{margin-bottom:-16px}

.chead .draft.dim{color:var(--muted-2);cursor:default}
.elede{margin:-16px 0 24px;font:600 clamp(15px,4vw,17.5px)/1.35 var(--disp);letter-spacing:-.01em;color:var(--primary)}
.ghost.wide{flex:none;justify-content:center;min-height:62px;padding:0 22px}
.modal-ic.warn{background:linear-gradient(145deg,#fee2e2,#fce7f3);color:#dc2626}
.modal-ic.warn svg.i{width:32px;height:32px}
.modal-cta.danger{background:linear-gradient(100deg,#ef4444,#dc2626);
  box-shadow:0 10px 22px -8px rgba(220,38,38,.6)}
/* ---- step 4: guest picker ---- */
.cgrid.c4{gap:30px}
.c4 .lede{margin:0 0 4px;font:700 clamp(16px,4.3vw,19px)/1.35 var(--disp);letter-spacing:-.02em}
.c4 .fsub{margin:0 0 14px}
.c4 .searchbar{margin-top:0}
.c4 .searchbar input::-webkit-search-cancel-button{display:none}
.gh{margin:0 0 2px;font:700 clamp(15px,4.1vw,17.5px)/1.3 var(--disp);letter-spacing:-.02em}
.gchips{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;margin-right:calc(-1 * max(var(--pad),env(safe-area-inset-right)));
  padding-right:max(var(--pad),env(safe-area-inset-right))}
.gchips::-webkit-scrollbar{display:none}
.gchip{flex:none;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 17px;border-radius:23px;
  background:#fff;border:1.5px solid var(--line-2);color:var(--ink-soft);
  font-size:clamp(13.5px,3.7vw,15px);font-weight:600;white-space:nowrap;
  transition:border-color .18s,color .18s,background .18s}
.gchip svg.i{width:18px;height:18px}
.gchip:hover{border-color:#c9c5f2}
.gchip.on{border-color:var(--primary);color:var(--primary);background:#fbfaff}

.ghead{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.ghead h3{margin:0;font:700 clamp(15px,4.1vw,17.5px)/1.2 var(--disp);letter-spacing:-.02em}
.ghead button{margin-left:auto;color:var(--primary);font-size:clamp(13.5px,3.7vw,15px);font-weight:700;
  padding:6px 2px;transition:opacity .18s}
.ghead button:hover{opacity:.72}
.glist{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:0 16px;
  box-shadow:0 1px 2px rgba(20,20,80,.05)}
.glist.mt{margin-top:14px}
.grow,.grp{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:13px 0;
  border-top:1px solid var(--line);transition:opacity .16s}
.grow:first-child,.grp:first-child{border-top:0}
.grow:hover,.grp:hover{opacity:.82}
.gav{position:relative;flex:none;width:46px;height:46px}
.gav img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--soft)}
.gav i{position:absolute;right:0;bottom:1px;width:13px;height:13px;border-radius:50%;
  background:#22c55e;border:2.5px solid var(--card)}
.gtx{flex:1;min-width:0}
.gtx b{display:block;font-size:clamp(14.5px,3.9vw,16px);font-weight:700;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtx>span{display:block;margin-top:2px;font-size:clamp(12.5px,3.4vw,14px);color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gadd{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;
  border:1.8px solid var(--primary);color:var(--primary);
  transition:background .16s,color .16s}
.gadd svg.i{width:18px;height:18px;stroke-width:2.4}
.grow.on .gadd,.gadd.on{background:var(--primary);border-color:var(--primary);color:#fff}
.gic{flex:none;display:grid;place-items:center;width:50px;height:50px;border-radius:15px}
.gic svg.i{width:24px;height:24px}
.grp .gtx>span{white-space:normal;overflow:visible;text-overflow:clip}
.grp .inv{flex:none;color:var(--primary);font-size:clamp(14px,3.8vw,15.5px);font-weight:700}
.cv2{flex:none;width:20px;height:20px;color:var(--muted-2)}
.gempty{padding:30px 4px;text-align:center;color:var(--muted);font-size:15px}
.c4 textarea.inp{min-height:150px}

.cbanner{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);
  border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:0 1px 2px rgba(20,20,80,.05)}
.cbanner .gic{background:#EDEBFE;color:#5B46E8}
.cbanner .alt{display:block;margin-top:7px;padding:0;font-size:13px;font-weight:700;
  color:var(--primary);text-align:left;transition:opacity .18s}
.cbanner .alt:hover{opacity:.72}
.ghead button+button{margin-left:14px}
.cbanner .gtx>span{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.45}
.cbanner button{flex:none;height:44px;padding:0 18px;border-radius:14px;background:var(--primary);color:#fff;
  font-size:clamp(14px,3.8vw,15px);font-weight:700;transition:filter .18s}
.cbanner button:hover{filter:brightness(1.08)}
.cbanner.off button{background:var(--soft);color:var(--muted-2);cursor:default;filter:none}
.addbox{display:flex;gap:8px}
/* 16px flat (no clamp) + slim padding: "Christopher Alexander (530) 555-0123"
   must fit a 390px phone without clipping */
.addbox .inp{flex:1;min-width:0;height:58px;font-size:16px;padding:0 14px}
/* icon-only: every pixel saved goes to the name+number input */
.addbtn{flex:none;display:grid;place-items:center;width:52px;height:58px;
  border-radius:var(--r-md);background:var(--soft);color:var(--primary);
  transition:background .18s}
.addbtn:hover{background:#e6e2fb}
.addbtn svg.i{width:21px;height:21px;stroke-width:2.4}
/* ---- contacts import card + how-to sheet ---- */
.ccard{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(30,30,90,.08)}
.cchead{display:flex;align-items:flex-start;gap:13px;text-align:left}
.ccard .gic{background:#EDEBFE;color:#5B46E8;flex:none}
.cchead .gtx>span{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.45}
.ccbtns{display:flex;gap:10px;margin-top:14px}
.ccb{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;
  border-radius:14px;background:var(--soft);color:var(--primary-ink);font-weight:700;
  font-size:14px;transition:filter .15s}
.ccb.main{background:var(--primary);color:#fff}
.ccb:hover{filter:brightness(1.05)}
.ccb svg.i{width:18px;height:18px}
@media (max-width:430px){.ccbtns{flex-direction:column}}
.vhow{display:flex;gap:10px;margin:2px 0 12px}
.vtab{flex:1;height:44px;border-radius:12px;background:var(--soft);color:var(--primary-ink);
  font-weight:700;font-size:13.5px;transition:background .15s,color .15s}
.vtab.on{background:var(--primary);color:#fff}
.vsteps{margin:0 2px 14px;padding-left:22px;text-align:left}
.vsteps li{font-size:13.5px;line-height:1.5;color:var(--ink-soft);margin:6px 0}
.ghead.mt{margin-top:20px}
.gav .cam{position:absolute;right:-3px;bottom:-2px;display:grid;place-items:center;width:21px;height:21px;
  border-radius:50%;background:var(--primary);color:#fff;border:2px solid var(--card);transition:filter .18s}
.gav .cam:hover{filter:brightness(1.12)}
.gav .cam svg.i{width:11px;height:11px;stroke-width:2}
.gdel{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;
  border:1.8px solid var(--line-2);color:var(--muted);transition:border-color .16s,color .16s}
.gdel:hover{border-color:#e3909b;color:#c0414f}
.gdel svg.i{width:17px;height:17px;stroke-width:2.2}
/* selection summary lives in the step footer */
.cbar-in>span.fsel{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:10px}
@media (max-width:520px){ .fsel .stack2 img:nth-child(n+3),.fsel .stack2 span{display:none} }
.ftx{min-width:0}
.ftx b{display:block;font-size:clamp(13.5px,3.7vw,15px);font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftx>span{display:block;margin-top:1px;font-size:12.5px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack2{display:flex;flex:none}
.stack2 img,.stack2 span{width:36px;height:36px;border-radius:50%;flex:none;margin-left:-11px;
  border:2px solid #fff;background:var(--soft)}
.stack2 img:first-child,.stack2 span:first-child{margin-left:0}
.stack2 img{object-fit:cover}
.stack2 span{display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--primary)}

.inp.vf{text-align:center;font:700 24px/1 var(--disp);letter-spacing:10px;margin-bottom:16px}
.modal-cta.pick{margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:10px;
  background:#fff;color:var(--ink);border:1.5px solid var(--line-2);
  box-shadow:0 2px 10px rgba(30,30,100,.08)}
.modal-cta.pick:hover{filter:none;border-color:var(--primary);background:#fbfaff}
.tagn{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:var(--soft);color:var(--primary);padding:3px 8px;border-radius:8px}
/* dvh where supported - plain vh overshoots under mobile URL bars and cut
   the card's bottom edge off screen */
.modal-card.claim{max-height:calc(100vh - 72px);overflow-y:auto;padding-bottom:32px}
@supports (height:100dvh){.modal-card.claim{max-height:calc(100dvh - 72px)}}
/* the info sheet is the tallest card - its close button rides the scroll,
   pinned to the top right of the visible area */
.modal-card.info .modal-x{position:sticky;top:6px;float:right;margin:-24px -14px 0 0;
  z-index:3;background:rgba(255,255,255,.92);box-shadow:0 1px 7px rgba(20,20,80,.10)}
.modal-cta.pick.on{border-color:var(--primary);background:#f3f0ff;
  box-shadow:0 0 0 1.5px var(--primary),0 2px 10px rgba(30,30,100,.08)}
.mg-lab{margin:16px 2px 8px;font:700 12px/1 var(--disp);letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);text-align:left}
.lk-head{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.lk-head .mg-lab{margin:0 2px}
.lk-all{border:0;background:none;padding:4px 2px;color:var(--primary);
  font:700 13.5px/1 var(--disp);cursor:pointer}
.lk-all:hover{opacity:.8}
.mg-avs{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:2px 0 8px}
.mg-av{position:relative;flex:0 0 76px;width:76px;height:76px;aspect-ratio:1;border-radius:50%;padding:0;
  border:3px solid var(--line-2);transition:border-color .15s,transform .15s}
.mg-av:hover{transform:scale(1.04)}
.mg-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--soft)}
.mg-av.on{border-color:var(--primary)}
.mg-av.on::after{content:"";position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;
  border-radius:50%;background:var(--primary);border:3px solid #fff}
.mg-av.up{display:grid;place-items:center;border-style:dashed;border-color:#c9c2f4;
  background:#fbfaff;color:var(--primary)}
.mg-av.up:hover{border-color:var(--primary)}
.mg-av.up svg.i{width:26px;height:26px;stroke-width:1.7}
.claim-row.off{opacity:.55;cursor:default}
.claim-row.off:hover{background:none}
.claim-row .tk{margin-left:auto;flex:none;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);background:var(--soft);padding:4px 9px;border-radius:8px}
.modal-cta.go{margin-top:16px}
.modal-ic svg.i{width:32px;height:32px}
.onote.center{text-align:center;margin-top:14px}
.round-btn.mini{width:42px;height:42px;flex:none}
.fin-av{position:relative;width:96px;height:96px;margin:0 auto 16px}
.fin-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--soft)}
.fin-av .cam{position:absolute;right:-3px;bottom:0;display:grid;place-items:center;width:32px;height:32px;
  border-radius:50%;background:var(--primary);color:#fff;border:3px solid var(--card);transition:filter .18s}
.fin-av .cam:hover{filter:brightness(1.1)}
.fin-av .cam svg.i{width:16px;height:16px}
.modal-card .inp{margin-bottom:16px;text-align:center}
button.view-all{display:block;width:100%;text-align:center}
/* ---- profile & claim ---- */
.me-card{display:flex;gap:26px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:26px;box-shadow:0 1px 2px rgba(20,20,80,.05)}
.me-av{position:relative;flex:none;width:118px;height:118px}
.me-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--soft)}
.me-av .cam{position:absolute;right:0;bottom:2px;display:grid;place-items:center;width:36px;height:36px;
  border-radius:50%;background:var(--primary);color:#fff;border:3px solid var(--card);transition:filter .18s}
.me-av .cam:hover{filter:brightness(1.1)}
.me-av .cam svg.i{width:18px;height:18px}
.me-fields{flex:1;min-width:0}
.me-fields .lab{margin-top:16px}
.me-fields .lab:first-child{margin-top:0}
.cta.solo{flex:none;width:100%;margin-top:20px}
.srow.noact{cursor:default}
.srow.act{cursor:pointer}
/* ---- CookieYes (injected by GTM) - same treatment as index.html ----
   Its UI never renders; the app's own privacy panel below drives the hidden
   opt-out checkbox + save button programmatically. */
.cky-consent-container,.cky-consent-bar,.cky-overlay,.cky-modal{display:none!important}
/* revisit button: always visible, pinned just above the bottom nav */
.cky-btn-revisit-wrapper{display:flex!important;position:fixed!important;top:auto!important;
  left:auto!important;right:12px!important;bottom:104px!important;z-index:45!important}
/* app-styled privacy panel, opened from the revisit button or the info sheet */
.privacy-panel{position:fixed;right:12px;bottom:160px;z-index:55;
  width:min(340px,calc(100vw - 24px));border-radius:20px;border:1px solid var(--line);
  background:var(--card);box-shadow:0 24px 60px -18px rgba(20,20,80,.4);padding:18px}
.pp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pp-head .ppt{display:flex;align-items:center;gap:7px;font:700 11px/1 var(--disp);
  letter-spacing:.1em;color:var(--primary-ink)}
.pp-close{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--line-2);color:var(--muted)}
.pp-lead{font-size:12.5px;line-height:1.55;color:var(--ink-soft)}
.pp-lead strong{color:var(--ink)}
.pp-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-top:14px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--soft);cursor:pointer}
.pp-label{font-size:12px;font-weight:700;color:var(--ink)}
.pp-sub{font-size:10.5px;font-weight:500;color:var(--muted)}
.pp-row input{position:absolute;opacity:0;pointer-events:none}
.pp-switch{position:relative;flex-shrink:0;width:40px;height:22px;border-radius:999px;
  background:var(--muted-2);transition:background .2s}
.pp-switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;
  border-radius:999px;background:#fff;transition:transform .2s}
.pp-row input:checked+.pp-switch{background:var(--primary)}
.pp-row input:checked+.pp-switch::after{transform:translateX(18px)}
.pp-note{margin-top:10px;font-size:10.5px;color:var(--muted)}
.linky{font:inherit;font-size:12.5px;color:var(--primary);text-decoration:underline;cursor:pointer}
.tzn{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--soft);
  padding:2px 7px;border-radius:999px;vertical-align:2px}
/* ---- info button + sign-in state ---- */
.round-btn{position:relative}
.avdot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;
  background:#9aa0b5;border:2.5px solid #fff;pointer-events:none}
.avdot.ok{background:#10b981}
.avdot.pend{background:#eaa53e}
.ist.pend .idot{background:#eaa53e}
.info-btn.pulse{animation:ipulse 2.4s ease-out infinite}
@keyframes ipulse{
  0%{box-shadow:0 3px 12px rgba(40,40,120,.14),0 0 0 0 rgba(64,56,240,.35)}
  70%{box-shadow:0 3px 12px rgba(40,40,120,.14),0 0 0 10px rgba(64,56,240,0)}
  100%{box-shadow:0 3px 12px rgba(40,40,120,.14),0 0 0 0 rgba(64,56,240,0)}}
.ist{display:flex;align-items:flex-start;gap:11px;background:var(--soft);border-radius:14px;
  padding:12px 14px;margin:4px 0 2px;text-align:left}
.ist .idot{width:10px;height:10px;border-radius:50%;background:#9aa0b5;flex:none;margin-top:6px}
.ist.ok .idot{background:#10b981}
.istx{min-width:0}
.istx b{display:block;font-size:15px}
.istx span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.ilist{list-style:none;margin:10px 0 0;padding:0;text-align:left}
.ilist li{position:relative;padding:6px 0 6px 24px;font-size:13.5px;line-height:1.45;color:var(--ink-soft)}
.ilist li::before{content:"";position:absolute;left:5px;top:12.5px;width:6px;height:6px;
  border-radius:50%;background:var(--primary);opacity:.7}
/* ---- get-the-app card ---- */
.appcard{display:flex;align-items:center;gap:13px;margin:22px 0 8px;padding:15px 16px;
  border-radius:18px;background:linear-gradient(135deg,#4038f0,#7a5cff);color:#fff;
  text-align:left;text-decoration:none;box-shadow:0 10px 24px rgba(64,56,240,.25);
  transition:transform .16s}
.appcard:active{transform:scale(.985)}
.appcard .apic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);
  display:grid;place-items:center;flex:none}
.appcard .apic svg.i{width:20px;height:20px;color:#ffd76a}
.aptx{flex:1;min-width:0}
.aptx b{display:block;font-size:14.5px}
.aptx span{display:block;font-size:12.5px;line-height:1.42;opacity:.86;margin-top:2px}
.apcta{flex:none;background:#fff;color:#4038f0;font-weight:700;font-size:13px;
  padding:9px 13px;border-radius:999px}
.modal-card .appcard{margin:14px 0 4px}
.modal-card .appcard .apic{display:none}
@media (max-width:420px){.appcard .apic{display:none}}
.sval.mono{font:600 12.5px/1.4 ui-monospace,Consolas,monospace;color:var(--muted);
  max-width:52%;overflow:hidden;text-overflow:ellipsis}
.me-mini{width:100%;height:100%;border-radius:50%;object-fit:cover}
@media (max-width:560px){
  .me-card{flex-direction:column;align-items:center}
  .me-fields{width:100%}
}
.modal-card.claim p{margin-bottom:16px}
.claim-list{display:grid;gap:2px;max-height:264px;overflow-y:auto;margin:0 0 6px;text-align:left}
.claim-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 10px;
  border-radius:12px;transition:background .15s}
.claim-row:hover{background:#f5f4fd}
.claim-row img{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft)}
.claim-row b{font-size:15px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.claim-row span{margin-left:auto;font-size:13px;color:var(--muted-2);flex:none}
.claim-or{display:flex;align-items:center;gap:12px;margin:8px 0 12px;color:var(--muted-2);font-size:13px}
.claim-or::before,.claim-or::after{content:"";flex:1;height:1px;background:var(--line)}
.modal-card .tawrap .inp{padding-right:64px}
.modal-card .addbox .inp{height:54px}
.modal-card .addbtn{width:50px;height:54px}
/* labelled addbtn ("That's me" / "Continue"): text beside the arrow, never wrapped */
.addbtn.lbl{width:auto;grid-auto-flow:column;gap:7px;padding:0 15px;white-space:nowrap;font-size:15px;font-weight:700}
.addbtn.lbl svg.i{width:18px;height:18px}
.claim-row.inv:hover{background:none}
.claim-row.inv span{margin-left:auto}
.inv-x{flex:none;display:grid;place-items:center;width:34px;height:34px;margin-left:6px;
  border-radius:50%;color:var(--muted);transition:background .15s,color .15s}
.inv-x:hover{background:#fee2e2;color:#dc2626}
.inv-x svg.i{width:16px;height:16px;stroke-width:2.4}
.modal-cta[disabled]{opacity:.45;filter:grayscale(.4);cursor:not-allowed;box-shadow:none}

/* fixed step footer */
.cbar-foot{position:fixed;z-index:22;left:0;right:0;bottom:0;border-top:1px solid var(--line);
  padding:12px max(var(--pad),env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left));
  background:rgba(247,247,251,.93);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.cbar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:16px}
.cbar-in>span{flex:none;color:var(--muted);font-size:clamp(14px,3.8vw,16px);font-weight:600}
.cbar-in .cta{margin-top:0}
.cta{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:10px;min-height:62px;
  padding:0 20px;border-radius:var(--r-md);color:#fff;font-size:clamp(16px,4.4vw,18px);font-weight:700;
  background:linear-gradient(100deg,#6b4bf5,#4231e6);box-shadow:0 10px 24px -8px rgba(74,52,234,.6);
  transition:filter .18s,transform .12s}
.cta:hover{filter:brightness(1.07)}
.cta:active{transform:scale(.99)}
.cta[disabled]{opacity:.62;filter:none;cursor:default;transform:none}
.cta svg.i{width:20px;height:20px;stroke-width:2.3}
.cta .spin{width:17px;height:17px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;animation:tspin .7s linear infinite}
.has-cbar #app{padding-bottom:calc(100px + env(safe-area-inset-bottom))}

/* ============ responsive ============ */

  .chat-card{flex-wrap:wrap}
  .chat-card .ghost{flex:1 0 100%;justify-content:center;margin-top:2px}
  .chat-txt p{-webkit-line-clamp:3;line-clamp:3}
  .map-foot{flex-wrap:wrap;gap:12px}
  .map-foot .ghost{margin-left:0;flex:1 0 100%;justify-content:center}
  .feed li{gap:9px}

  .feed p{white-space:normal;font-size:14px}

  .menu{width:min(252px,calc(100vw - 20px))}
  .slink-top{flex-wrap:wrap;gap:14px}

  .eloc{font-size:13px}
  .ewhen{font-size:12.8px}
  .edate{padding-top:32px}
  .edate b{font-size:25px}
  .edate span{font-size:11.5px}
  .ehost{gap:8px;padding-top:10px}
  .ehost img{width:26px;height:26px}
  .ehost p{font-size:11.9px}
  .ehost .hb{display:none}
  .pill{font-size:11.9px;padding:6px 9px;border-radius:9px}
}
@media (max-width:370px){
  .bnav-i span{display:none}
  .bnav-new{padding:0 16px}
}
@media (min-width:600px){
  :root{--pad:28px}
  .strip img,.add-photo{width:126px;height:206px}
  .guests{gap:12px}
  .guest span{font-size:14px}
  .cal-c{min-height:78px}
  .pgrid{grid-template-columns:repeat(3,1fr);gap:12px}
}
@media (min-width:700px){
  .cal-c{min-height:104px;padding:8px 5px}
  .cal-grid.week .cal-c{min-height:150px}
  .dots-row{display:none}

}
@media (min-width:768px){
  .hero{aspect-ratio:16/11}
  .title{margin-bottom:26px}
}

  :root{--pad:40px}
  .wrap{max-width:1120px}
  .grid{grid-template-columns:minmax(0,1fr) minmax(0,1.06fr);gap:56px;align-items:start}

}
/* ---- create-event responsive ---- */
@media (max-width:440px){
  .cover-acts{grid-template-columns:1fr}
  .srow{min-height:70px;gap:11px}
  .sic{width:44px;height:44px;border-radius:13px}
  .sval{max-width:54%}
  .cbar-in{gap:12px}
  .vibes{gap:6px}
  .vtile{border-radius:16px}
}
@media (max-width:380px){
  .cbar-in>span{display:none}
}
@media (min-width:600px){

}

var POOL = SEED_PEOPLE.map(function(p){ return p.id; });
/* "4:00 PM" -> minutes since midnight, for sorting within a day. */
function t24(t){ var m=String(t||'').match(/(\d+):(\d+)\s*(AM|PM)/i); if(!m) return 0;
  var hh=+m[1]%12 + (/pm/i.test(m[3])?12:0); return hh*60 + +m[2]; }
var MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function parse(iso){ var p=iso.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }

/* Date fields every view needs, derived from one ISO string */
function dparts(iso){
  var d=parse(iso);
  return { d:d, day:d.getDate(), mon:MON[d.getMonth()], monShort:MON[d.getMonth()].slice(0,3),
           monUp:MON[d.getMonth()].slice(0,3).toUpperCase(), dow:DOW[d.getDay()],
           dowShort:DOW[d.getDay()].slice(0,3), year:d.getFullYear(),
           key:iso, monKey:iso.slice(0,7) };
}

/* Fill in guests / photos / chat / activity for rows that don't define them */
function hydrate(ev){
  if(ev._h) return ev;
  ev._h=true;
  var dp=dparts(ev.date);
  var others=POOL.filter(function(p){ return p!==ev.hostId; });
  var pick=function(n,off){ var r=[],i; for(i=0;i<n;i++) r.push(others[(i+off)%others.length]); return r; };
  var seedN = ev.id.length % 11;

  if(!ev.guests){
    var lines=['Looking forward to it.','See you there!','Count me in.','Wouldn\u2019t miss it.'];
    ev.guests=[{id:ev.hostId,msg:'Created this event',when:'Created this event',host:true,
                you:ev.hostId==="emily"}]
      .concat(pick(3,seedN).map(function(p,i){
        return {id:p,msg:lines[i%lines.length],when:'Invited '+(i+1)+' day'+(i?'s':'')+' ago by '+pf(ev.hostId)};
      }));
  }
  if(!ev.waiting){
    ev.waiting=pick(Math.min(ev.pending||0,4),seedN+5).map(function(p,i){
      return {id:p,when:'Invited '+(i+1)+' day'+(i?'s':'')+' ago by '+pf(ev.hostId)};
    });
  }
  /* grow the response lists toward the authored counts, then clamp the
     counts to the rows - every page tells the same story */
  var used={};
  ev.guests.forEach(function(g){ used[g.id]=1; });
  ev.waiting.forEach(function(g){ used[g.id]=1; });
  var free=others.filter(function(p){ return !used[p]; }),
      fills=['Sounds fun!','I’m in.','Wouldn’t miss it.','Ready when you are.'],
      grow=Math.max(0,(ev.going||0)-ev.guests.length), gi;
  for(gi=0; gi<grow && free.length; gi++)
    ev.guests.push({ id:free.shift(), msg:fills[gi%fills.length],
                     when:'Invited by '+pf(ev.hostId) });
  ev.maybesL=[]; ev.cantsL=[];
  for(gi=0; gi<(ev.maybe||0) && free.length; gi++)
    ev.maybesL.push({ id:free.shift(), when:'Responded maybe' });
  for(gi=0; gi<(ev.cant||0) && free.length; gi++)
    ev.cantsL.push({ id:free.shift(), when:'Can’t make it' });
  ev.going=ev.guests.length;  ev.maybe=ev.maybesL.length;
  ev.cant=ev.cantsL.length;   ev.pending=ev.waiting.length;
  if(!ev.photos){ ev.photos=[ev.img+'a',ev.img+'b',ev.img+'c',ev.img+'d']; }
  if(ev.photoCount==null){ ev.photoCount=ev.photos.length; ev.photoWhen=dp.monShort+' '+dp.day; }
  ev.allPhotos=[];
  var whens=['Just now','18 minutes ago','2 hours ago','Yesterday','2 days ago','Last week'];
  for(var k=0;k<ev.photoCount;k++){
    ev.allPhotos.push({ seed: ev.photos[k] || (ev.img+'-p'+k),
      byId: k===0 ? ev.hostId : others[(k+seedN)%others.length],
      when: whens[k%whens.length] });
  }
  if(!ev.chat){
    ev.chat={fromId:ev.hostId,msg:'Everything\u2019s set for '+dp.dow+'.',time:'1 day ago',unread:0};
  }
  /* Chat lives on the event as an array; this is the seeded thread. */
  if(!ev.thread){
    var canned=['Who\u2019s bringing what?','I can grab ice on the way.',
                'What time should we get there?','Just parked - heading in.'];
    ev.thread=[];
    for(var t=0;t<3;t++){
      ev.thread.push({ from: ev.guests[(t+1)%ev.guests.length].id,
                       text: canned[(t+seedN)%canned.length], minsAgo: 240-t*70 });
    }
    ev.thread.push({ from: ev.chat.fromId, text: ev.chat.msg, minsAgo: 2 });
  }
  if(!ev.activity){
    ev.activity=[
      {id:ev.guests[1]?ev.guests[1].id:ev.hostId, ic:'check', ok:1, txt:'is Going', t:'2 hours ago'},
      {id:ev.hostId, ic:'pen', txt:'updated the event description', t:'Yesterday'},
      {id:ev.guests[2]?ev.guests[2].id:ev.hostId, ic:'check', ok:1, txt:'is Going', t:'2 days ago'}
    ];
  }
  if(!ev.chips){
    ev.chips=[['sun',ev.vibe],['users',ev.capacity+' max'],['money',ev.entry],
              [ev.invite==='Invite only'?'lock':'globe',ev.invite]];
  }
  return ev;
}

function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/* events store the creator's IANA zone; viewers in another zone get a hint */
function hostZone(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){ return ''; } }

function weekStart(s){ var d=parse(s); d.setDate(d.getDate()-d.getDay()); return isoOf(d); }
